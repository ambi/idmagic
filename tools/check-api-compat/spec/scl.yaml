# check-api-compat — Specification Core Language (SCL) Document

system: check-api-compat
spec_version: "3.0"

glossary:
  Baseline:
    definition: 前回リリース時点で固定した OpenAPI 3.1 ドキュメントのスナップショット。
  BreakingChange:
    definition: ADR-156 の互換定義でフィールド削除・改名・型変更・必須化・エラーコード変更・既定値変更のいずれかに該当する差分。
  Maintainer:
    definition: check-api-compat を実行する開発者または CI。

models:
  CompareRequest:
    kind: value_object
    fields:
      baseline: { type: String, constraints: [non_empty] }
      current: { type: String, constraints: [non_empty] }
  CompatFinding:
    kind: value_object
    fields:
      operation: { type: String, constraints: [non_empty] }
      message: { type: String, constraints: [non_empty] }

interfaces:
  CompareOpenApi:
    description: |
      baseline と current の OpenAPI 3.1 ドキュメントを比較し、ADR-156 の破壊的変更定義
      (フィールド削除・改名・型変更・必須化・エラーコード変更・既定値変更) に該当する差分を
      検出する。追加的な変更 (フィールド追加・任意パラメータ追加・新エンドポイント・
      エラーコード追加) は検出しない。
    input:
      request: { type: CompareRequest }
    output:
      findings: { type: List<CompatFinding> }
    ensures:
      - output.findings.size() >= 0
      - additive_changes_produce_no_findings(input.request, output.findings)
      - removed_fields_are_findings(input.request, output.findings)
      - removed_error_codes_are_findings(input.request, output.findings)
    stability: internal
    access: public
    idempotent: true
    read_only: true
    bindings:
      - kind: cli
        command: check-api-compat
        flags:
          - { name: baseline, required: true }
          - { name: current, required: true }
        exit_codes:
          success: 0
          breaking_changes_detected: 1
          usage_error: 2

objectives:
  CompareLatency:
    interface: CompareOpenApi
    indicator: measurement.latency_ms < 2000
    target: 0.95
    window: 30d
    budgeting: occurrences

scenarios:
  破壊的変更のないPRはゼロ件で通る:
    actor: Maintainer
    main_success:
      - baseline と同一互換の current を CompareOpenApi に渡す
      - findings が空になる
  フィールド削除は破壊的変更として検出される:
    actor: Maintainer
    given:
      - baseline のある operation の response が field を含む
    main_success:
      - その field を欠く current を CompareOpenApi に渡す
      - findings にその field の削除を示す1件が含まれる
  エラーコードの削除は破壊的変更として検出される:
    actor: Maintainer
    given:
      - baseline のある operation のエラー応答が複数の error code を含む
    main_success:
      - 1つの error code を欠く current を CompareOpenApi に渡す
      - findings にその error code の削除を示す1件が含まれる
  追加的な変更は検出されない:
    actor: Maintainer
    main_success:
      - 新しい任意フィールド・新しい endpoint・新しい error code を追加した current を CompareOpenApi に渡す
      - findings が空になる
