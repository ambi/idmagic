# backend/tenancy — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: tenancy
updated_at: 2026-07-26
modules:
  tenancy-domain:
    path: domain
    responsibility: Tenancy のドメインモデルと純粋な規則。
    context: Tenancy
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-kernel
        via: technical_shared
      - module: shared-spec
        via: technical_shared
  tenancy-ports:
    path: ports
    responsibility: Tenancy の公開 port と外界への抽象。
    context: Tenancy
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idmanagement-user-domain
        via: published_interface
      - module: shared-services
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
  tenancy-usecases:
    path: usecases
    responsibility: Tenancy のユースケース。
    context: Tenancy
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idmanagement-user-domain
        via: published_interface
      - module: shared-services
        via: technical_shared
      - module: shared-notification-template
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
  tenancy-adapters:
    path: handlers_http
    responsibility: Tenancy の HTTP・永続化 adapter。
    context: Tenancy
    layer: adapters
    role: binding
    depends_on:
      - module: authentication-password-usecases
        via: binding
      - module: authentication-usecases
        via: binding
      - module: http-support
        via: binding
      - module: idmanagement-domain
        via: binding
      - module: idmanagement-group-ports
        via: binding
      - module: idmanagement-user-domain
        via: binding
      - module: idmanagement-user-ports
        via: binding
      - module: shared-adapters
        via: binding
      - module: shared-services
        via: technical_shared
      - module: shared-notification-template
        via: technical_shared
      - module: shared-spec
        via: binding
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-usecases
        via: published_interface
  tenancy-public:
    path: "."
    responsibility: Tenancy root package の公開 facade。
    context: Tenancy
    layer: use_cases
    role: published_interface
    depends_on:
      - module: tenancy-domain
        via: published_interface
  tenancy-composition:
    path: module.go
    responsibility: Tenancy の adapter と port を束ねる composition module。
    context: Tenancy
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: tenancy-adapters
        via: published_interface
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-usecases
        via: published_interface
  tenancy-db-memory:
    path: db_memory
    responsibility: backend/tenancy/db_memory の Flat Architecture adapter。
    context: Tenancy
    layer: adapters
    role: binding
    depends_on:
      - module: tenancy-ports
        via: binding
      - module: shared-services
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
  tenancy-db-postgres:
    path: db_postgres
    responsibility: backend/tenancy/db_postgres の Flat Architecture adapter。
    context: Tenancy
    layer: adapters
    role: binding
    depends_on:
      - module: tenancy-ports
        via: binding
      - module: shared-adapters
        via: technical_shared
      - module: shared-services
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
