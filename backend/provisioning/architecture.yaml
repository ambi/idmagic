# backend/provisioning — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: provisioning
updated_at: 2026-07-26
modules:
  provisioning-domain:
    path: domain
    responsibility: Provisioning のドメインモデルと純粋な規則。
    context: Provisioning
    layer: domain
    role: published_interface
  provisioning-ports:
    path: ports
    responsibility: Provisioning の公開 port と外界への抽象。
    context: Provisioning
    layer: use_cases
    role: published_interface
    depends_on:
      - module: provisioning-domain
        via: published_interface
  provisioning-scim:
    path: client_scim
    responsibility: SCIM プロトコル別 outbound feature slice (ADR-128 決定2)。
    context: Provisioning
    layer: adapters
    role: binding
    depends_on:
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
  provisioning-usecases:
    path: usecases
    responsibility: Provisioning のユースケース (capture/dispatch/deliver/quarantine と admin 操作)。
    context: Provisioning
    layer: use_cases
    role: published_interface
    depends_on:
      - module: application-domain
        via: published_interface
      - module: application-ports
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: jobs-domain
        via: published_interface
      - module: jobs-usecases
        via: published_interface
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
  provisioning-adapters:
    path: handlers_http
    responsibility: Provisioning の HTTP・永続化・IdManagement 属性取得 adapter。
    context: Provisioning
    layer: adapters
    role: binding
    depends_on:
      - module: application-ports
        via: binding
      - module: http-support
        via: binding
      - module: idmanagement-domain
        via: binding
      - module: idmanagement-user-ports
        via: published_interface
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
      - module: provisioning-usecases
        via: published_interface
      - module: shared-adapters
        via: binding
  provisioning-composition:
    path: "."
    responsibility: Provisioning の adapter と port を束ねる composition module (Module 型、cross-context notifier/job handler の配線)。
    context: Provisioning
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: application-ports
        via: published_interface
      - module: http-support
        via: composition_root
      - module: idmanagement-user-ports
        via: published_interface
      - module: jobs-ports
        via: published_interface
      - module: jobs-usecases
        via: published_interface
      - module: provisioning-adapters
        via: composition_root
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
      - module: provisioning-scim
        via: published_interface
      - module: provisioning-usecases
        via: published_interface
      - module: tenancy-ports
        via: composition_root
  provisioning-db-memory:
    path: db_memory
    responsibility: backend/provisioning/db_memory の Flat Architecture adapter。
    context: Provisioning
    layer: adapters
    role: binding
    depends_on:
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
      - module: shared-storage-db-memory
        via: technical_shared
  provisioning-db-postgres:
    path: db_postgres
    responsibility: backend/provisioning/db_postgres の Flat Architecture adapter。
    context: Provisioning
    layer: adapters
    role: binding
    depends_on:
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
  provisioning-source-idmanagement:
    path: source_idmanagement
    responsibility: backend/provisioning/source_idmanagement の Flat Architecture adapter。
    context: Provisioning
    layer: adapters
    role: binding
    depends_on:
      - module: idmanagement-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: provisioning-domain
        via: published_interface
      - module: provisioning-ports
        via: published_interface
