  oauth2-token-db-postgres:
    path: token/db_postgres
    responsibility: backend/oauth2/token/db_postgres の Flat Architecture adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: oauth2-db-postgres
        via: binding
      - module: oauth2-domain
        via: published_interface
      - module: shared-adapters
        via: technical_shared
