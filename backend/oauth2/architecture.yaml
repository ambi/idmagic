        via: binding
      - module: oauth2-client-adapters
        via: binding
      - module: oauth2-consent-adapters
        via: binding
      - module: oauth2-device-adapters
        via: binding
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-token-adapters
        via: binding
