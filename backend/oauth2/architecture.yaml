# backend/oauth2 — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: oauth2
updated_at: 2026-07-26
modules:
  oauth2-domain:
    path: domain
    responsibility: OAuth2 feature 横断のイベント・resource server 型と互換 facade。
    context: OAuth2
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
      - module: oauth2-authorization-domain
        via: published_interface
      - module: oauth2-client-domain
        via: published_interface
      - module: oauth2-consent-domain
        via: published_interface
      - module: oauth2-device-domain
        via: published_interface
      - module: oauth2-token-domain
        via: published_interface
      - module: signingkeys-domain
        via: published_interface
      - module: tenancy-domain
        via: published_interface
  oauth2-ports:
    path: ports
    responsibility: OAuth2 feature 横断 port と feature port の互換 facade。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: claimmapping-domain
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-authorization-ports
        via: published_interface
      - module: oauth2-client-ports
        via: published_interface
      - module: oauth2-consent-ports
        via: published_interface
      - module: oauth2-device-ports
        via: published_interface
      - module: oauth2-token-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: workloadidentity-domain
        via: published_interface
  oauth2-usecases:
    path: usecases
    responsibility: OAuth2 feature 横断のエラー・イベント・resource indicator helper。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: shared-kernel
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
  oauth2-adapters:
    path: handlers_http
    responsibility: OAuth2 の HTTP・永続化 adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: apitoken-domain
        via: binding
      - module: claimmapping-domain
        via: published_interface
      - module: claimmapping-usecases
        via: published_interface
      - module: shared-security-certificates-mtls
        via: technical_shared
      - module: shared-security-tokens-jose
        via: technical_shared
      - module: application-domain
        via: binding
      - module: application-usecases
        via: binding
      - module: audit-ports
        via: binding
      - module: authentication-domain
        via: binding
      - module: authentication-mfa-domain
        via: binding
      - module: authentication-mfa-ports
        via: binding
      - module: authentication-mfa-usecases
        via: binding
      - module: authentication-password-ports
        via: binding
      - module: authentication-password-usecases
        via: binding
      - module: authentication-ports
        via: binding
      - module: authentication-recovery-ports
        via: binding
      - module: authentication-recovery-usecases
        via: binding
      - module: authentication-session-ports
        via: binding
      - module: authentication-session-usecases
        via: binding
      - module: authentication-totp-ports
        via: binding
      - module: authentication-totp-usecases
        via: binding
      - module: authentication-usecases
        via: binding
      - module: authentication-webauthn-ports
        via: binding
      - module: authentication-webauthn-adapters
        via: binding
      - module: authentication-webauthn-usecases
        via: binding
      - module: http-support
        via: binding
      - module: idmanagement-agent-ports
        via: binding
      - module: idmanagement-domain
        via: binding
      - module: idmanagement-user-domain
        via: binding
      - module: idmanagement-user-ports
        via: binding
      - module: sharedsignals-ports
        via: binding
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: oauth2-authorization-adapters
        via: published_interface
      - module: oauth2-authorization-usecases
        via: published_interface
      - module: oauth2-client-adapters
        via: published_interface
      - module: oauth2-client-usecases
        via: published_interface
      - module: oauth2-consent-adapters
        via: published_interface
      - module: oauth2-consent-usecases
        via: published_interface
      - module: oauth2-device-adapters
        via: published_interface
      - module: oauth2-device-usecases
        via: published_interface
      - module: oauth2-token-adapters
        via: published_interface
      - module: oauth2-token-usecases
        via: published_interface
      - module: shared-adapters
        via: binding
      - module: shared-spec
        via: binding
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-ports
        via: published_interface
      - module: tenancy-domain
        via: binding
      - module: tenancy-ports
        via: binding
      - module: tenancy-public
        via: binding
      - module: tenancy-usecases
        via: binding
  oauth2-client-domain:
    path: client/domain
    responsibility: OAuth2 client と client secret のドメイン規則。
    context: OAuth2
    layer: domain
    role: published_interface
    depends_on:
      - module: claimmapping-domain
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
  oauth2-client-ports:
    path: client/ports
    responsibility: Client repository の feature port。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
  oauth2-client-usecases:
    path: client/usecases
    responsibility: Client 登録・管理・secret rotation のユースケース。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
      - module: tenancy-usecases
        via: published_interface
  oauth2-client-adapters:
    path: client/db_memory
    responsibility: Client の memory / PostgreSQL persistence adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: shared-storage-db-memory
        via: technical_shared
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: shared-adapters
        via: binding
      - module: shared-spec
        via: binding
      - module: signingkeys-domain
        via: published_interface
  oauth2-client-cimd-http:
    path: client/cimd_http
    responsibility: Client ID Metadata Document (CIMD) の SSRF-safe fetch と、OAuth2ClientRepository への解決フォールバックの decorator (ADR-155)。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: oauth2-client-domain
        via: published_interface
      - module: oauth2-client-ports
        via: published_interface
      - module: shared-security-safehttp
        via: technical_shared
      - module: shared-spec
        via: technical_shared
  oauth2-consent-domain:
    path: consent/domain
    responsibility: Consent のドメインモデルとイベント。
    context: OAuth2
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
  oauth2-consent-usecases:
    path: consent/usecases
    responsibility: 管理者・account consent のユースケース。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-consent-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
      - module: tenancy-usecases
        via: published_interface
  oauth2-consent-ports:
    path: consent/ports
    responsibility: Consent repository の feature port。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-consent-domain
        via: published_interface
  oauth2-consent-adapters:
    path: consent/db_memory
    responsibility: Consent の memory / PostgreSQL persistence adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: shared-storage-db-memory
        via: technical_shared
      - module: oauth2-domain
        via: published_interface
      - module: shared-adapters
        via: binding
  oauth2-authorization-domain:
    path: authorization/domain
    responsibility: Authorization request/code、PKCE、authorization details のドメイン規則。
    context: OAuth2
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
  oauth2-authorization-ports:
    path: authorization/ports
    responsibility: Authorization request/code/PAR store の feature port。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
      - module: shared-spec
        via: technical_shared
  oauth2-authorization-usecases:
    path: authorization/usecases
    responsibility: Authorize、complete login、PAR のユースケース。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: authentication-domain
        via: published_interface
      - module: authentication-ports
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-public
        via: published_interface
  oauth2-authorization-adapters:
    path: authorization/db_memory
    responsibility: Authorization request/code/PAR の memory persistence adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: shared-storage-db-memory
        via: technical_shared
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: shared-adapters
        via: binding
      - module: shared-spec
        via: binding
  oauth2-token-domain:
    path: token/domain
    responsibility: Refresh token 発行・rotation のドメイン規則。
    context: OAuth2
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
  oauth2-token-ports:
    path: token/ports
    responsibility: Refresh token store と access-token denylist の feature port。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
  oauth2-token-usecases:
    path: token/usecases
    responsibility: Code/token exchange、refresh、revoke、introspect、userinfo のユースケース。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: apitoken-domain
        via: published_interface
      - module: claimmapping-domain
        via: published_interface
      - module: claimmapping-usecases
        via: published_interface
      - module: idmanagement-agent-ports
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: sharedsignals-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
      - module: workloadidentity-domain
        via: published_interface
  oauth2-token-adapters:
    path: token/db_memory
    responsibility: Token の memory / PostgreSQL persistence adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: shared-storage-db-memory
        via: technical_shared
      - module: oauth2-domain
        via: published_interface
      - module: shared-adapters
        via: binding
  oauth2-device-domain:
    path: device/domain
    responsibility: Device code / user code のドメイン規則。
    context: OAuth2
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
  oauth2-device-ports:
    path: device/ports
    responsibility: Device code store の feature port。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
  oauth2-device-usecases:
    path: device/usecases
    responsibility: Device authorization、user code approval、device code exchange のユースケース。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-public
        via: published_interface
  oauth2-device-adapters:
    path: device/db_memory
    responsibility: Device code の memory persistence adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: shared-storage-db-memory
        via: technical_shared
      - module: oauth2-domain
        via: published_interface
      - module: shared-adapters
        via: binding
      - module: shared-spec
        via: binding
  oauth2-public:
    path: "."
    responsibility: OAuth2 root package の公開 facade。
    context: OAuth2
    layer: use_cases
    role: published_interface
    depends_on:
      - module: oauth2-domain
        via: published_interface
  oauth2-composition:
    path: module.go
    responsibility: OAuth2 の adapter と port を束ねる composition module。
    context: OAuth2
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: oauth2-adapters
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
  oauth2-client-db-postgres:
    path: client/db_postgres
    responsibility: backend/oauth2/client/db_postgres の Flat Architecture adapter。
    context: OAuth2
    layer: adapters
    role: binding
    depends_on:
      - module: claimmapping-domain
        via: published_interface
      - module: oauth2-db-postgres
        via: binding
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
  oauth2-consent-db-postgres:
    path: consent/db_postgres
    responsibility: backend/oauth2/consent/db_postgres の Flat Architecture adapter。
