# backend/workloadidentity — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: workloadidentity
updated_at: 2026-08-08
modules:
  workloadidentity-domain:
    path: domain
    responsibility: WorkloadTrustBundle・AgentWorkloadBinding・MatchAgent (ambiguous match の fail-closed 判定)・WorkloadIdentityGrant・domain event (ADR-053)。
    context: WorkloadIdentity
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
    realizes:
      - context: WorkloadIdentity
        kind: model
        element: WorkloadTrustBundle
      - context: WorkloadIdentity
        kind: model
        element: AgentWorkloadBinding
  workloadidentity-ports:
    path: ports
    responsibility: WorkloadTrustBundleRepository / AgentWorkloadBindingRepository の port。
    context: WorkloadIdentity
    layer: use_cases
    role: published_interface
    depends_on:
      - module: workloadidentity-domain
        via: published_interface
  workloadidentity-usecases:
    path: usecases
    responsibility: VerifyWorkloadAttestation (fail-closed 検証・binding 解決・Agent 束縛)、admin CRUD usecase (trust bundle / binding lifecycle)、OAuth2 の WorkloadTokenVerifier port を満たす adapter。
    context: WorkloadIdentity
    layer: use_cases
    role: published_interface
    depends_on:
      - module: workloadidentity-domain
        via: published_interface
      - module: workloadidentity-ports
        via: published_interface
      - module: idmanagement-agent-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-public
        via: published_interface
    realizes:
      - context: WorkloadIdentity
        kind: interface
        element: VerifyWorkloadAttestation
      - context: WorkloadIdentity
        kind: interface
        element: RegisterWorkloadTrustBundle
      - context: WorkloadIdentity
        kind: interface
        element: CreateAgentWorkloadBinding
  workloadidentity-verification-jose:
    path: verification_jose
    responsibility: ports.WorkloadSVIDVerifier の adapters 層実装。shared/security/tokens_jose の署名検証と last-known-good JWKS cache を包み、usecases 層へ domain sentinel error へ翻訳して返す (ADR-053)。
    context: WorkloadIdentity
    layer: adapters
    role: binding
    depends_on:
      - module: workloadidentity-domain
        via: published_interface
      - module: workloadidentity-ports
        via: published_interface
      - module: shared-security-tokens-jose
        via: technical_shared
  workloadidentity-db-memory:
    path: db_memory
    responsibility: WorkloadTrustBundleRepository / AgentWorkloadBindingRepository の in-process 参照実装。テストとローカルデモの参照でもある。
    context: WorkloadIdentity
    layer: adapters
    role: binding
    depends_on:
      - module: workloadidentity-domain
        via: published_interface
      - module: shared-storage-db-memory
        via: technical_shared
  workloadidentity-db-postgres:
    path: db_postgres
    responsibility: workload_trust_bundles / agent_workload_bindings の PostgreSQL 永続化 (sqlc 生成, ADR-090)。
    context: WorkloadIdentity
    layer: adapters
    role: binding
    depends_on:
      - module: workloadidentity-domain
        via: published_interface
      - module: workloadidentity-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
      - module: shared-spec
        via: technical_shared
  workloadidentity-handlers-http:
    path: handlers_http
    responsibility: federation provider (WorkloadTrustBundle) と subject mapping (AgentWorkloadBinding) の管理 API。
    context: WorkloadIdentity
    layer: adapters
    role: binding
    depends_on:
      - module: workloadidentity-domain
        via: published_interface
      - module: workloadidentity-ports
        via: published_interface
      - module: workloadidentity-usecases
        via: published_interface
      - module: idmanagement-agent-ports
        via: published_interface
      - module: http-support
        via: technical_shared
      - module: shared-spec
        via: technical_shared
    realizes:
      - context: WorkloadIdentity
        kind: interface
        element: ListWorkloadTrustBundles
      - context: WorkloadIdentity
        kind: interface
        element: RegisterWorkloadTrustBundle
      - context: WorkloadIdentity
        kind: interface
        element: CreateAgentWorkloadBinding
  workloadidentity-composition:
    path: "."
    responsibility: WorkloadIdentity の repository を束ねる composition module (bootstrap / http-server が使う)。
    context: WorkloadIdentity
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: workloadidentity-ports
        via: published_interface
