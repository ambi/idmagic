        via: composition_root
      - module: authentication-webauthn-ports
        via: composition_root
      - module: http-support
        via: technical_shared
      - module: idgovernance-adapters
        via: composition_root
      - module: idgovernance-public
        via: composition_root
      - module: idmanagement-adapters
        via: composition_root
      - module: idmanagement-agent-ports
        via: composition_root
      - module: idmanagement-group-ports
        via: composition_root
      - module: idmanagement-public
        via: composition_root
      - module: idmanagement-user-ports
        via: composition_root
      - module: idmanagement-user-domain
        via: composition_root
      - module: idmanagement-user-usecases
        via: composition_root
      - module: jobs-public
        via: composition_root
      - module: oauth2-adapters
        via: composition_root
