# backend/shared — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: shared
updated_at: 2026-07-27
modules:
  shared-kernel:
    path: kernel
    responsibility: context 横断の最小共有ドメイン語彙。
    context: System
    layer: domain
    role: technical_shared
  shared-spec:
    path: spec
    responsibility: SCL の Go binding と仕様整合検査。
    context: System
    layer: domain
    role: technical_shared
    depends_on:
      - module: shared-kernel
        via: technical_shared
  shared-adapters:
    path: storage/db_postgres
    responsibility: HTTP、crypto、persistence、observability の共有 adapter。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: authentication-ports
        via: published_interface
      - module: http-support
        via: technical_shared
      - module: idmanagement-group-domain
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: jobs-domain
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: shared-kernel
        via: technical_shared
      - module: shared-services
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-ports
        via: published_interface
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-public
        via: published_interface
  http-support:
    path: http/support_http
    responsibility: context 横断 HTTP handler binding と request support。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: apitoken-ports
        via: published_interface
      - module: application-domain
        via: published_interface
      - module: application-ports
        via: published_interface
      - module: application-usecases
        via: published_interface
      - module: authentication-domain
        via: published_interface
      - module: authentication-session-usecases
        via: published_interface
      - module: authentication-usecases
        via: published_interface
      - module: idmanagement-group-domain
        via: published_interface
      - module: idmanagement-group-ports
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: oauth2-consent-usecases
        via: published_interface
      - module: oauth2-usecases
        via: published_interface
      - module: shared-kernel
        via: technical_shared
      - module: shared-security-tokens-jose
        via: technical_shared
      - module: shared-services
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
  http-server:
    path: http/server_http
