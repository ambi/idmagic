# backend/sourcing — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: sourcing
updated_at: 2026-08-10
modules:
  sourcing-scim-domain:
    path: scim/domain
    responsibility: Sourcing / scim source slice のドメインモデルと純粋な規則 (SCIM filter・mutation・discovery)。
    context: Sourcing
    layer: domain
    role: published_interface
  sourcing-scim-ports:
    path: scim/ports
    responsibility: scim source slice の公開 port と外界への抽象。
    context: Sourcing
    layer: use_cases
    role: published_interface
    depends_on:
      - module: sourcing-scim-domain
        via: published_interface
  sourcing-scim-usecases:
    path: scim/usecases
    responsibility: scim source slice のユースケース。
    context: Sourcing
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idmanagement-domain
        via: published_interface
      - module: idmanagement-group-domain
        via: published_interface
      - module: idmanagement-group-ports
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: sourcing-scim-domain
        via: published_interface
      - module: sourcing-scim-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
  sourcing-scim-adapters:
    path: scim/handlers_http
    responsibility: scim source slice の HTTP adapter。
    context: Sourcing
    layer: adapters
    role: binding
    depends_on:
      - module: apitoken-domain
        via: published_interface
      - module: apitoken-ports
        via: published_interface
      - module: http-support
        via: binding
      - module: sourcing-scim-domain
        via: published_interface
      - module: sourcing-scim-ports
        via: published_interface
      - module: sourcing-scim-usecases
        via: published_interface
      - module: shared-adapters
        via: binding
      - module: shared-kernel
        via: binding
  sourcing-public:
    path: "."
    responsibility: Sourcing root package の公開 facade。
    context: Sourcing
    layer: use_cases
    role: published_interface
    depends_on:
      - module: sourcing-scim-domain
        via: published_interface
  sourcing-composition:
    path: module.go
    responsibility: Sourcing の source slice adapter と port を束ねる composition module (現在は scim のみ)。
    context: Sourcing
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: apitoken-ports
        via: composition_root
      - module: http-support
        via: composition_root
      - module: idmanagement-group-ports
        via: composition_root
      - module: idmanagement-user-ports
        via: composition_root
      - module: sourcing-scim-adapters
        via: published_interface
      - module: sourcing-scim-domain
        via: published_interface
      - module: sourcing-scim-ports
        via: published_interface
      - module: sourcing-scim-usecases
        via: published_interface
      - module: shared-spec
        via: composition_root
  sourcing-scim-db-memory:
    path: scim/db_memory
    responsibility: backend/sourcing/scim/db_memory の Flat Architecture adapter。
    context: Sourcing
    layer: adapters
    role: binding
    depends_on:
      - module: sourcing-scim-ports
        via: published_interface
  sourcing-scim-db-postgres:
    path: scim/db_postgres
    responsibility: backend/sourcing/scim/db_postgres の Flat Architecture adapter。
    context: Sourcing
    layer: adapters
    role: binding
    depends_on:
      - module: sourcing-scim-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
  sourcing-scim-source-idmanagement:
    path: scim/source_idmanagement
    responsibility: IdManagement が所有する source ownership guard port を SCIM source repository で実装する内向き adapter。
    context: Sourcing
    layer: adapters
    role: binding
    depends_on:
      - module: idmanagement-user-ports
        via: binding
      - module: sourcing-scim-ports
        via: published_interface
