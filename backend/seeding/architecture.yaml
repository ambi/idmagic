# backend/seeding — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: seeding
updated_at: 2026-07-26
modules:
  seeding-domain:
    path: domain
    responsibility: Seeding の環境 policy、profile、versioned manifest、secret reference、plan と純粋な検証規則。
    context: Seeding
    layer: domain
    role: published_interface
    realizes:
      - context: Seeding
        kind: model
        element: SeedRequest
      - context: Seeding
        kind: model
        element: SeedPlan
      - context: Seeding
        kind: model
        element: SeedManifest
      - context: Seeding
        kind: model
        element: SeedSecretReference
  seeding-usecases:
    path: usecases
    responsibility: Seed request、manifest materialization、secret resolver port と context contributor orchestration を担う application service。
    context: Seeding
    layer: use_cases
    role: published_interface
    realizes:
      - context: Seeding
        kind: interface
        element: SeedData
    depends_on:
      - module: seeding-domain
        via: published_interface
  seeding-manifest-adapter:
    path: manifests_yaml
    responsibility: Strict YAML/include loader と env/file secret resolver により外部 seed manifest を安全に materialize する adapter。
    context: Seeding
    layer: adapters
    role: binding
    depends_on:
      - module: seeding-domain
        via: published_interface
      - module: seeding-usecases
        via: published_interface
