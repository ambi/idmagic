# backend/signingkeys — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: signingkeys
updated_at: 2026-07-26
modules:
  signingkeys-domain:
    path: domain
    responsibility: tenant-scoped signing key metadata、状態語彙、domain event。
    context: SigningKeys
    layer: domain
    role: published_interface
    realizes:
      - context: SigningKeys
        kind: model
        element: SignatureAlgorithm
      - context: SigningKeys
        kind: model
        element: KeyProvider
      - context: SigningKeys
        kind: model
        element: KeyUsage
      - context: SigningKeys
        kind: model
        element: SigningKey
  signingkeys-ports:
    path: ports
    responsibility: SigningKeys の鍵 repository/provider port。
    context: SigningKeys
    layer: use_cases
    role: published_interface
    depends_on:
      - module: signingkeys-domain
        via: published_interface
  signingkeys-usecases:
    path: usecases
    responsibility: 鍵 rotation と tenant key health の application service。
    context: SigningKeys
    layer: use_cases
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-ports
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
  signingkeys-adapters:
    path: handlers_http
    responsibility: SigningKeys の HTTP、memory/PostgreSQL/Vault/crypto adapter。
    context: SigningKeys
    layer: adapters
    role: binding
    depends_on:
      - module: http-support
        via: binding
      - module: shared-adapters
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-ports
        via: published_interface
      - module: signingkeys-usecases
        via: published_interface
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
  signingkeys-public:
    path: "."
    responsibility: SigningKeys root package の公開 facade。
    context: SigningKeys
    layer: use_cases
    role: published_interface
    depends_on:
      - module: signingkeys-ports
        via: published_interface
  signingkeys-composition:
    path: module.go
    responsibility: SigningKeys の adapter と port を束ねる composition module。
    context: SigningKeys
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: signingkeys-ports
        via: published_interface
  signingkeys-db-postgres:
    path: db_postgres
    responsibility: backend/signingkeys/db_postgres の Flat Architecture adapter。
    context: SigningKeys
    layer: adapters
    role: binding
    depends_on:
      - module: shared-adapters
        via: technical_shared
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-keys-jose
        via: binding
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-public
        via: published_interface
  signingkeys-keys-jose:
    path: keys_jose
    responsibility: backend/signingkeys/keys_jose の Flat Architecture adapter。
    context: SigningKeys
    layer: adapters
    role: binding
    depends_on:
      - module: signingkeys-domain
        via: published_interface
  signingkeys-keys-memory:
    path: keys_memory
    responsibility: backend/signingkeys/keys_memory の Flat Architecture adapter。
    context: SigningKeys
    layer: adapters
    role: binding
    depends_on:
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-keys-jose
        via: binding
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-public
        via: published_interface
  signingkeys-keys-vault:
    path: keys_vault
    responsibility: backend/signingkeys/keys_vault の Flat Architecture adapter。
    context: SigningKeys
    layer: adapters
    role: binding
    depends_on:
      - module: signingkeys-domain
        via: published_interface
      - module: signingkeys-keys-jose
        via: binding
      - module: tenancy-public
        via: published_interface
