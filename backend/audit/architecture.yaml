# backend/audit — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: audit
updated_at: 2026-08-09
modules:
  audit-ports:
    path: ports
    responsibility: Audit の公開 port と外界への抽象。
    context: Audit
    layer: use_cases
    role: published_interface
  audit-usecases:
    path: usecases
    responsibility: Audit のユースケース。
    context: Audit
    layer: use_cases
    role: published_interface
    depends_on:
      - module: audit-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
  audit-adapters:
    path: handlers_http
    responsibility: Audit の HTTP・永続化 adapter。
    context: Audit
    layer: adapters
    role: binding
    depends_on:
      - module: audit-ports
        via: published_interface
      - module: audit-usecases
        via: published_interface
      - module: http-support
        via: binding
      - module: idmanagement-user-domain
        via: binding
      - module: idmanagement-user-ports
        via: binding
      - module: oauth2-domain
        via: binding
      - module: shared-adapters
        via: binding
      - module: shared-spec
        via: binding
      - module: tenancy-domain
        via: binding
  audit-public:
    path: "."
    responsibility: Audit root package の公開 facade。
    context: Audit
    layer: use_cases
    role: published_interface
  audit-composition:
    path: module.go
    responsibility: Audit の adapter と port を束ねる composition module。
    context: Audit
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: audit-adapters
        via: published_interface
      - module: audit-ports
        via: published_interface
      - module: audit-usecases
        via: published_interface
  audit-db-memory:
    path: db_memory
    responsibility: backend/audit/db_memory の Flat Architecture adapter。
    context: Audit
    layer: adapters
    role: binding
    depends_on:
      - module: audit-ports
        via: published_interface
      - module: shared-storage-db-memory
        via: technical_shared
  audit-db-postgres:
    path: db_postgres
    responsibility: backend/audit/db_postgres の Flat Architecture adapter。
    context: Audit
    layer: adapters
    role: binding
    depends_on:
      - module: audit-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
