# backend/sharedsignals — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: sharedsignals
updated_at: 2026-08-08
modules:
  sharedsignals-domain:
    path: domain
    responsibility: AgentRevocationEpoch・SsfStream/SsfTransmitterConfig/SsfReceiverConfig・SecurityEventToken/SecurityEventDelivery/ReceivedSecurityEvent・CaepEvent/SsfSubject の業務型と domain event (ADR-057)。
    context: SharedSignals
    layer: domain
    role: published_interface
    depends_on:
      - module: shared-spec
        via: technical_shared
    realizes:
      - context: SharedSignals
        kind: model
        element: AgentRevocationEpoch
      - context: SharedSignals
        kind: model
        element: SsfStream
      - context: SharedSignals
        kind: model
        element: SecurityEventDelivery
      - context: SharedSignals
        kind: model
        element: ReceivedSecurityEvent
  sharedsignals-ports:
    path: ports
    responsibility: AgentRevocationEpochRepository / SsfStreamRepository / SsfTransmitterConfigRepository / SsfReceiverConfigRepository / SecurityEventDeliveryRepository / ReceivedSecurityEventRepository の port。
    context: SharedSignals
    layer: use_cases
    role: published_interface
    depends_on:
      - module: sharedsignals-domain
        via: published_interface
  sharedsignals-db-memory:
    path: db_memory
    responsibility: 6 repository の in-process 参照実装。テストとローカルデモの参照でもある。
    context: SharedSignals
    layer: adapters
    role: binding
    depends_on:
      - module: sharedsignals-domain
        via: published_interface
      - module: shared-storage-db-memory
        via: technical_shared
  sharedsignals-db-postgres:
    path: db_postgres
    responsibility: agent_revocation_epochs / ssf_streams / ssf_transmitter_configs / ssf_receiver_configs / security_event_deliveries / received_security_events の PostgreSQL 永続化 (sqlc 生成, ADR-090)。AdvanceAgentRevocationEpoch は条件付き ON CONFLICT で epoch の単調増加を DB 制約として強制する。
    context: SharedSignals
    layer: adapters
    role: binding
    depends_on:
      - module: sharedsignals-domain
        via: published_interface
      - module: sharedsignals-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
      - module: shared-spec
        via: technical_shared
  sharedsignals-usecases:
    path: usecases
    responsibility: "SCL internal interface CheckRevocationEpoch/AdvanceRevocationEpoch と、\nIdManagement が既に emit する DomainEvent (AgentKilled/AgentDisabled/\nAgentCredentialUnbound/UserDisabled/UserSoftDeleted/UserDeleted) に反応して\nAgent revocation epoch を fail-closed に前進させる AgentRevocationReactor を所有する\n(ADR-057, wi-58)。IdManagement 側は SharedSignals に依存せず、\ndeps_http.EventReactor という自前の vocabulary で構造的に受ける\n(deps_http.Deps.ReactiveEmit が合成する)。\n"
    context: SharedSignals
    layer: use_cases
    role: published_interface
    depends_on:
      - module: sharedsignals-domain
        via: published_interface
      - module: sharedsignals-ports
        via: published_interface
      - module: idmanagement-agent-ports
        via: published_interface
      - module: idmanagement-domain
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-public
        via: published_interface
  sharedsignals-adapters:
    path: handlers_http
    responsibility: SsfStream (transmitter/receiver) の管理 CRUD と SecurityEventDelivery 一覧 (delivery health) を提供する admin HTTP API (ADR-057, wi-58 T005)。TenantAdministrator (RequireAdmin) のみ実装、ManagementApiClient (Agent principal の shared-signals:read/write scope) の実 enforcement は他 context 同様に未実装 (wi-274 の既知の保留事項と同じ扱い)。
    context: SharedSignals
    layer: adapters
    role: binding
    depends_on:
      - module: sharedsignals-domain
        via: published_interface
      - module: sharedsignals-ports
        via: published_interface
      - module: sharedsignals-usecases
        via: published_interface
      - module: idmanagement-agent-ports
        via: binding
      - module: http-support
        via: binding
      - module: shared-spec
        via: technical_shared
  sharedsignals-push-http:
    path: push_http
    responsibility: ports.SecurityEventPusher の HTTP 実装。SSF push-based delivery (RFC 8417/RFC 9836 相当) で、SET を配送先 delivery_endpoint へ POST する。DNS-rebinding safe / redirect 再検証 (tokens_jose.JWKResolver・provisioning/client_scim と同じ per-context SSRF-safe transport の前例を踏襲、一元化はしない)。
    context: SharedSignals
    layer: adapters
    role: binding
    depends_on:
      - module: sharedsignals-ports
        via: published_interface
  sharedsignals-sign-jose:
    path: sign_jose
    responsibility: ports.SecurityEventTokenSigner の実装。SET (RFC 8417) の PS256 署名は SigningKeys の鍵ローテーション/JWKS 配布へ相乗りし、新規の鍵管理は持たない (ADR-057 決定3/7)。use_cases 層 (sharedsignals-usecases) を adapters 層の shared-security-tokens-jose / signingkeys-ports から隔離するための境界。
    context: SharedSignals
    layer: adapters
    role: binding
    depends_on:
      - module: sharedsignals-ports
        via: published_interface
      - module: signingkeys-ports
        via: published_interface
      - module: shared-security-tokens-jose
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-public
        via: published_interface
  sharedsignals-verify-jose:
    path: verify_jose
    responsibility: ports.SecurityEventTokenVerifier の実装。inbound SET (RFC 8417) の署名・iss/aud を SsfReceiverConfig の trusted_issuer/jwks_uri/jwks に対して検証する (ADR-057 §ReceiveSecurityEvent)。JWKS 解決は tokens_jose.JWKResolver (SSRF-safe, WorkloadIdentity/OAuth2 と共有) を再利用する。use_cases 層を adapters 層の shared-security-tokens-jose から隔離するための境界 (sharedsignals-sign-jose と対称)。
    context: SharedSignals
    layer: adapters
    role: binding
    depends_on:
      - module: sharedsignals-domain
        via: published_interface
      - module: sharedsignals-ports
        via: published_interface
      - module: shared-security-tokens-jose
        via: technical_shared
  sharedsignals-composition:
    path: "."
    responsibility: SharedSignals の repository を束ねる composition module (bootstrap / http-server が使う)。
    context: SharedSignals
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: sharedsignals-ports
        via: published_interface
