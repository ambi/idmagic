# backend/idgovernance — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: idgovernance
updated_at: 2026-07-26
modules:
  idgovernance-domain:
    path: domain
    responsibility: IdGovernance の LifecycleWorkflow モデル、状態、純粋な評価規則。
    context: IdGovernance
    layer: domain
    role: published_interface
    depends_on:
      - module: idmanagement-domain
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
  idgovernance-ports:
    path: ports
    responsibility: IdGovernance の workflow 定義・run・transactional capture の公開 port。
    context: IdGovernance
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idgovernance-domain
        via: published_interface
      - module: idmanagement-domain
        via: published_interface
      - module: idmanagement-group-domain
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
  idgovernance-usecases:
    path: usecases
    responsibility: LifecycleWorkflow の管理、run planning、実行を担う application service。
    context: IdGovernance
    layer: use_cases
    role: published_interface
    depends_on:
      - module: application-domain
        via: published_interface
      - module: application-ports
        via: published_interface
      - module: idgovernance-domain
        via: published_interface
      - module: idgovernance-ports
        via: published_interface
      - module: idmanagement-domain
        via: published_interface
      - module: idmanagement-group-domain
        via: published_interface
      - module: idmanagement-group-ports
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: jobs-domain
        via: published_interface
      - module: jobs-ports
        via: published_interface
      - module: jobs-usecases
        via: published_interface
      - module: shared-services
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: tenancy-ports
        via: published_interface
      - module: tenancy-public
        via: published_interface
  idgovernance-adapters:
    path: handlers_http
    responsibility: IdGovernance の handlers_http、db_memory、db_postgres Adapter。lifecycle_workflows の PostgreSQL query/sqlcgen は本 context が所有する（ADR-117、ADR-090、ADR-133）。
    context: IdGovernance
    layer: adapters
    role: binding
    depends_on:
      - module: application-ports
        via: binding
      - module: http-support
        via: binding
      - module: idgovernance-domain
        via: published_interface
      - module: idgovernance-ports
        via: published_interface
      - module: idgovernance-usecases
        via: published_interface
      - module: idmanagement-group-ports
        via: binding
      - module: idmanagement-user-adapters
        via: binding
      - module: idmanagement-user-domain
        via: binding
      - module: idmanagement-user-ports
        via: binding
      - module: jobs-ports
        via: binding
      - module: shared-adapters
        via: binding
      - module: shared-services
        via: technical_shared
      - module: shared-spec
        via: binding
      - module: tenancy-ports
        via: binding
      - module: tenancy-public
        via: binding
  idgovernance-public:
    path: "."
    responsibility: IdGovernance root package の公開 facade。
    context: IdGovernance
    layer: use_cases
    role: published_interface
    depends_on:
      - module: idgovernance-ports
        via: published_interface
  idgovernance-composition:
    path: module.go
    responsibility: IdGovernance の adapter と port を束ねる composition module。
    context: IdGovernance
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: idgovernance-adapters
        via: published_interface
      - module: idgovernance-ports
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
  idgovernance-db-memory:
    path: db_memory
    responsibility: backend/idgovernance/db_memory の Flat Architecture adapter。
    context: IdGovernance
    layer: adapters
    role: binding
    depends_on:
      - module: idgovernance-domain
        via: published_interface
      - module: idgovernance-ports
        via: published_interface
      - module: idmanagement-user-db-memory
        via: binding
      - module: idmanagement-user-domain
        via: published_interface
      - module: shared-storage-db-memory
        via: technical_shared
  idgovernance-db-postgres:
    path: db_postgres
    responsibility: backend/idgovernance/db_postgres の Flat Architecture adapter。
    context: IdGovernance
    layer: adapters
    role: binding
    depends_on:
      - module: idgovernance-domain
        via: published_interface
      - module: idgovernance-ports
        via: published_interface
      - module: idmanagement-user-db-postgres
        via: binding
      - module: idmanagement-user-domain
        via: published_interface
      - module: shared-adapters
        via: technical_shared
