# backend/apitoken — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: apitoken
updated_at: 2026-07-26
modules:
  apitoken-domain:
    path: domain
    responsibility: ApiTokens のドメインモデルと純粋な規則 (scope 語彙・検証)。
    context: ApiTokens
    layer: domain
    role: published_interface
  apitoken-ports:
    path: ports
    responsibility: ApiTokens の公開 port と外界への抽象 (repository・authenticator)。
    context: ApiTokens
    layer: use_cases
    role: published_interface
    depends_on:
      - module: apitoken-domain
        via: published_interface
  apitoken-usecases:
    path: usecases
    responsibility: ApiTokens のユースケース (発行・失効・一覧・authenticate)。
    context: ApiTokens
    layer: use_cases
    role: published_interface
    depends_on:
      - module: apitoken-domain
        via: published_interface
      - module: apitoken-ports
        via: published_interface
      - module: oauth2-domain
        via: published_interface
      - module: oauth2-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-public
        via: published_interface
  apitoken-adapters:
    path: handlers_http
    responsibility: ApiTokens の HTTP adapter (発行・失効・一覧の管理 API)。
    context: ApiTokens
    layer: adapters
    role: binding
    depends_on:
      - module: apitoken-domain
        via: published_interface
      - module: apitoken-usecases
        via: published_interface
      - module: http-support
        via: binding
      - module: shared-adapters
        via: binding
  apitoken-public:
    path: "."
    responsibility: ApiTokens root package の公開 facade。
    context: ApiTokens
    layer: use_cases
    role: published_interface
    depends_on:
      - module: apitoken-domain
        via: published_interface
  apitoken-composition:
    path: module.go
    responsibility: ApiTokens の adapter と port を束ねる composition module。
    context: ApiTokens
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: apitoken-adapters
        via: published_interface
      - module: apitoken-domain
        via: published_interface
      - module: apitoken-ports
        via: published_interface
      - module: apitoken-usecases
        via: published_interface
      - module: http-support
        via: composition_root
      - module: oauth2-ports
        via: composition_root
  apitoken-db-memory:
    path: db_memory
    responsibility: backend/apitoken/db_memory の Flat Architecture adapter。
    context: ApiTokens
    layer: adapters
    role: binding
    depends_on:
      - module: apitoken-domain
        via: published_interface
  apitoken-db-postgres:
    path: db_postgres
    responsibility: backend/apitoken/db_postgres の Flat Architecture adapter。
    context: ApiTokens
    layer: adapters
    role: binding
    depends_on:
      - module: apitoken-domain
        via: published_interface
      - module: shared-adapters
        via: technical_shared
