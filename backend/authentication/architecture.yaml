# backend/authentication — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: authentication
updated_at: 2026-07-27
modules:
  authentication-federation-domain:
    path: federation/domain
    responsibility: External IdP connection、federated identity、login attempt と broker event の純粋規則。
    context: Authentication
    layer: domain
    role: published_interface
  authentication-federation-ports:
    path: federation/ports
    responsibility: Connection・identity・attempt・replay・secret resolver の公開 port。
    context: Authentication
    layer: use_cases
    role: published_interface
    depends_on:
      - module: authentication-federation-domain
        via: published_interface
  authentication-federation-usecases:
    path: federation/usecases
    responsibility: Inbound federation routing、safe linking、JIT、session handoff orchestration。
