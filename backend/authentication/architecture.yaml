    responsibility: backend/authentication/totp/db_postgres の Flat Architecture adapter。mfa_factors.secret を DataKeys 経由でエンベロープ暗号化する (ADR-148)。MfaFactorReencryptor が DataKeys の FieldMigrator port を実装する (wi-97 T006)。
    context: Authentication
    layer: adapters
    role: binding
    depends_on:
      - module: authentication-totp-domain
        via: published_interface
      - module: authentication-totp-ports
        via: published_interface
      - module: shared-adapters
        via: technical_shared
      - module: shared-spec
        via: technical_shared
      - module: tenancy-domain
        via: published_interface
      - module: tenancy-public
        via: published_interface
  authentication-webauthn-db-memory:
    path: webauthn/db_memory
    responsibility: backend/authentication/webauthn/db_memory の Flat Architecture adapter。
    context: Authentication
    layer: adapters
    role: binding
    depends_on:
      - module: authentication-webauthn-domain
        via: published_interface
  authentication-webauthn-db-postgres:
    path: webauthn/db_postgres
    responsibility: backend/authentication/webauthn/db_postgres の Flat Architecture adapter。
    context: Authentication
    layer: adapters
    role: binding
    depends_on:
      - module: authentication-webauthn-domain
        via: published_interface
      - module: shared-adapters
        via: technical_shared
      - module: tenancy-public
        via: published_interface
