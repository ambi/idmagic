    layer: use_cases
    role: published_interface
    depends_on:
      - module: authentication-domain
        via: published_interface
      - module: authentication-federation-domain
        via: published_interface
      - module: authentication-federation-ports
        via: published_interface
      - module: authentication-mfa-usecases
        via: published_interface
      - module: authentication-session-usecases
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: tenancy-public
        via: published_interface
