# backend/wsfederation — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: wsfederation
updated_at: 2026-07-26
modules:
  wsfederation-domain:
    path: domain
    responsibility: WsFederation のドメインモデルと純粋な規則。
    context: WsFederation
    layer: domain
    role: published_interface
    depends_on:
      - module: claimmapping-domain
        via: published_interface
      - module: idmanagement-domain
        via: published_interface
      - module: shared-spec
        via: technical_shared
  wsfederation-ports:
    path: ports
    responsibility: WsFederation の公開 port と外界への抽象。
    context: WsFederation
    layer: use_cases
    role: published_interface
    depends_on:
      - module: wsfederation-domain
        via: published_interface
  wsfederation-usecases:
    path: usecases
    responsibility: WsFederation のユースケース。
    context: WsFederation
    layer: use_cases
    role: published_interface
    depends_on:
      - module: claimmapping-usecases
        via: published_interface
      - module: application-domain
        via: published_interface
      - module: authentication-domain
        via: published_interface
      - module: idmanagement-user-domain
        via: published_interface
      - module: idmanagement-user-ports
        via: published_interface
      - module: shared-spec
        via: technical_shared
      - module: wsfederation-domain
        via: published_interface
      - module: wsfederation-ports
        via: published_interface
  wsfederation-adapters:
    path: handlers_http
    responsibility: WsFederation の HTTP・永続化 adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      - module: wsfederation-metadata-wsfederation
        via: binding
      - module: wsfederation-requests-wstrust
        via: binding
      - module: wsfederation-responses-wsfederation
        via: binding
      - module: wsfederation-tokens-saml
        via: binding
      - module: claimmapping-usecases
        via: published_interface
      - module: claimmapping-domain
        via: published_interface
      - module: application-domain
        via: binding
      - module: authentication-domain
        via: binding
      - module: authentication-password-ports
        via: binding
      - module: authentication-ports
        via: binding
      - module: authentication-session-ports
        via: binding
      - module: authentication-session-usecases
        via: binding
      - module: authentication-usecases
        via: binding
      - module: http-support
        via: binding
      - module: idmanagement-user-domain
        via: binding
      - module: idmanagement-user-ports
        via: binding
      - module: oauth2-ports
        via: binding
      - module: shared-adapters
        via: binding
      - module: shared-kernel
        via: binding
      - module: shared-spec
        via: binding
      - module: wsfederation-domain
        via: published_interface
      - module: wsfederation-ports
        via: published_interface
      - module: wsfederation-usecases
        via: published_interface
  wsfederation-public:
    path: "."
    responsibility: WsFederation root package の公開 facade。
    context: WsFederation
    layer: use_cases
    role: published_interface
    depends_on:
      - module: wsfederation-domain
        via: published_interface
  wsfederation-composition:
    path: module.go
    responsibility: WsFederation の adapter と port を束ねる composition module。
    context: WsFederation
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: wsfederation-tokens-saml
        via: binding
      - module: authentication-password-ports
        via: composition_root
      - module: authentication-ports
        via: composition_root
      - module: authentication-session-ports
        via: composition_root
      - module: http-support
        via: composition_root
      - module: idmanagement-user-ports
        via: composition_root
      - module: oauth2-ports
        via: composition_root
      - module: wsfederation-adapters
        via: published_interface
      - module: wsfederation-domain
        via: published_interface
      - module: wsfederation-ports
        via: published_interface
      - module: wsfederation-usecases
        via: published_interface
  wsfederation-db-memory:
    path: db_memory
    responsibility: backend/wsfederation/db_memory の Flat Architecture adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      - module: shared-storage-db-memory
        via: technical_shared
      - module: wsfederation-domain
        via: published_interface
  wsfederation-db-postgres:
    path: db_postgres
    responsibility: backend/wsfederation/db_postgres の Flat Architecture adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      - module: shared-adapters
        via: technical_shared
      - module: wsfederation-domain
        via: published_interface
  wsfederation-metadata-wsfederation:
    path: metadata_wsfederation
    responsibility: backend/wsfederation/metadata_wsfederation の Flat Architecture adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      []
  wsfederation-requests-wstrust:
    path: requests_wstrust
    responsibility: backend/wsfederation/requests_wstrust の Flat Architecture adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      []
  wsfederation-responses-wsfederation:
    path: responses_wsfederation
    responsibility: backend/wsfederation/responses_wsfederation の Flat Architecture adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      - module: http-support
        via: technical_shared
  wsfederation-tokens-saml:
    path: tokens_saml
    responsibility: backend/wsfederation/tokens_saml の Flat Architecture adapter。
    context: WsFederation
    layer: adapters
    role: binding
    depends_on:
      - module: claimmapping-usecases
        via: published_interface
      - module: wsfederation-domain
        via: published_interface
