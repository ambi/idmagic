version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Go 標準同梱 — 最低限の正しさ
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # セキュリティ系 (IdP 用途で特に重視)
    - gosec
    - errorlint
    - bodyclose
    - bidichk
    - forcetypeassert
    - noctx

    # 品質・バグ予防
    - canonicalheader
    - contextcheck
    - depguard
    - durationcheck
    - forbidigo
    - errchkjson
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - makezero
    - modernize
    - revive
    - misspell
    - nilnesserr
    - unconvert
    - unparam
    - unqueryvet
    - wastedassign
    - nolintlint
    - nilerr
    - nilnil
    - rowserrcheck
    - sqlclosecheck
    - thelper

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - paramTypeCombine   # opinionated
        - hugeParam          # 構造体 by-value がデフォの本リポジトリでは noisy
        - rangeValCopy       # 同上
        - unnamedResult      # 多値戻り (string, string, error) は慣習的に許容
        - commentedOutCode   # セクション見出しコメントを誤検知
    depguard:
      rules:
        standard-replacements:
          deny:
            - pkg: github.com/google/uuid
              desc: "標準の uuid パッケージを使う (wi-17165)"
        # domain は決定論的な計算だけを持ち、作用は usecases から引数か ports で受け取る
        # (docs/design/application/backend.md#モジュール間の依存規則)。net の構文解析は作用を持たない。
        domain-effects:
          list-mode: lax
          files:
            - "**/backend/**/domain/**"
            - "!$test"
          allow:
            - net/mail$
            - net/netip$
            - net/url$
          deny:
            - pkg: crypto/rand$
              desc: "domain は乱数を entropy.Source として受け取る"
            - pkg: database/sql$
              desc: "domain はデータベースを直接使わない"
            - pkg: math/rand
              desc: "domain は乱数を entropy.Source として受け取る"
            - pkg: net
              desc: "domain はネットワークを直接使わない"
            - pkg: os
              desc: "domain は OS を直接使わない"
    forbidigo:
      # 別名と dot import、関数値としての参照も型情報で判定する。
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: "domain は現在時刻を引数か ports で受け取る"
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: "起動設定は backend/cmd/internal/bootstrap の ConfigLoader を通して読む"
    gosec:
      excludes:
        - G104  # errcheck と重複
        - G404  # math/rand 警告 — 該当箇所は crypto/rand を使っている。誤検知防止
      severity: medium
      confidence: medium
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
          disabled: true  # 全パッケージに doc コメント強制は重い
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true  # 既存 interface 適合のため許容
        - name: unreachable-code
        - name: redefines-builtin-id
    errcheck:
      check-type-assertions: false  # forcetypeassert で別管理
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*github.com/labstack/echo/v5.Response).Write

  exclusions:
    presets:
      - common-false-positives
      - legacy
    rules:
      # テストでは security / errcheck / forcetypeassert を緩める
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forcetypeassert
          - noctx
          - bodyclose
          - forbidigo
      # server_http.Deps keeps these direct fields only as explicit test
      # compatibility inputs while module migrations wi-177..179 complete.
      - path: _test\.go
        text: "\\.(AttrSchemaRepo|UserRepo|MfaFactorRepo|TokenIssuer|KeyStore) is deprecated:"
        linters:
          - staticcheck
      # time.Now の禁止は domain だけに適用する。診断は別名の綴りで出るので、理由の文で選ぶ。
      - path-except: ^backend/(?:[^/]+/)*domain/
        text: "domain は現在時刻"
        linters:
          - forbidigo
      # 起動設定の読み取りは bootstrap、実行時の locator を解決する *_env アダプター、
      # 本番から到達しないテスト支援だけに許す。入口は読み取り関数を ConfigLoader へ渡す。
      - path: ^backend/cmd/internal/bootstrap/|/[a-z0-9]+_env/|/testing(?:_[a-z0-9_]+)?/
        text: "起動設定は"
        linters:
          - forbidigo
      - source: bootstrap\.NewConfigLoader\(os\.Getenv\)
        text: "起動設定は"
        linters:
          - forbidigo
      # backend/cmd/ の main.go は log.Fatal を許容
      - path: backend/cmd/
        linters:
          - errcheck
      # support.ResolveAuthentication intentionally represents "unauthenticated"
      # as (nil, nil); callers distinguish it from authentication errors.
      - path: backend/shared/http/support_http/auth\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # Authentication resolvers use nil result + nil error for
      # "not authenticated / not applicable" by port contract.
      - path: backend/authentication/internal/usecases/(demo_header_resolver|session_manager)\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # A client with no bound Agent is the ordinary case on every token
      # issuance path, not an error: ResolveIssuableAgent passes through
      # AgentRepository.FindByClientID's (nil, nil) not-bound contract.
      - path: backend/oauth2/internal/usecases/agent_issuance\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # DPoP is optional for non-DPoP-bound calls; no header means no result.
      - path: backend/shared/security/tokens_jose/dpop_verifier\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # normalizeGroupEmail's (nil, nil) is the valid "no email set" case, not a
      # suppressed error (wi-315).
      - path: backend/idmanagement/internal/group/usecases/admin_groups\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # Test repositories mirror production Find* not-found contracts.
      - path: backend/oauth2/internal/handlers_http/userinfo_handler_test\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      - path: backend/audit/internal/handlers_http/admin_audit_event_handler_test\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      - path: backend/jobs/internal/handlers_http/admin_job_handler_test\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # Persistence repository Find* methods use nil result + nil error for
      # "not found" to match existing port contracts. Matches both the
      # Per-context, per-feature, and shared persistence adapters in Flat Architecture.
      - path: backend/[^/]+/(?:internal/)?(?:[^/]+/)?db_(?:memory|postgres|valkey)/
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # TenantNotificationSource adapts Tenancy repositories to the shared
      # notification port, whose "no tenant override for this template" answer is
      # nil result + nil error, same as the Find* repository contracts above.
      - path: backend/tenancy/internal/usecases/manage_notification_templates\.go
        text: "return both a `nil` error and an invalid value"
        linters:
          - nilnil
      # HIBP Range API requires a SHA-1 fingerprint for k-anonymity lookup.
      # This is not password storage/verification; stored password hashes use Argon2id.
      - path: backend/shared/policy/breaches_hibp/hibp_breached_password_checker\.go
        text: "G505: Blocklisted import crypto/sha1"
        linters:
          - gosec
      - path: backend/shared/policy/breaches_hibp/hibp_breached_password_checker\.go
        text: "G401: Use of weak cryptographic primitive"
        linters:
          - gosec

formatters:
  # goimports は入れない。lint の cold 実行 103 秒のうち 88 秒を占めていながら、gofumpt に
  # 足しているのは「不足 import の補完」だけだった (wi-498)。足りない import も余った import も
  # go build が先に落とすので、ゲートとしての意味を持たない。std 群の分離と群内の整列は
  # gofumpt が持ち、それは故障注入で確かめてある。
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/ambi/idmagic
      extra:
        group-params: true
