# REQ-MCPGATEWAY-007 の設定例である。backend/mcpgateway/envoy_e2e_test.go がこのファイルを読み込んで試験する。
# 利用者が変えるのは、公開の経路 /mcp、max_request_bytes、mcp_gateway と mcp_server の接続先、TLS である。
# failure_mode_allow と allow_partial_message を true にすると、失敗した要求か読んでいない本文が上流へ届く。
static_resources:
  listeners:
    - name: mcp
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                # 判定の入口へ届かないか 5xx のとき、Envoy は本文のない 503 を作るので、MCP のエラーへ変換する。
                local_reply_config:
                  mappers:
                    - filter:
                        and_filter:
                          filters:
                            - status_code_filter:
                                comparison:
                                  op: EQ
                                  value: { default_value: 503, runtime_key: mcp_gateway.unavailable_status }
                            - response_flag_filter: { flags: [UAEX] }
                      headers_to_add:
                        - header: { key: cache-control, value: no-store }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      body_format_override:
                        text_format: '{"jsonrpc":"2.0","error":{"code":-32002,"message":"authorization is unavailable"}}'
                        content_type: application/json
                route_config:
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        # Envoy は 200 を許可と読むので、メタデータは判定を通さずゲートウェイへ送る。
                        - match: { path: /.well-known/oauth-protected-resource }
                          route: { cluster: mcp_gateway }
                          typed_per_filter_config: &without_ext_authz
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { path: /.well-known/oauth-protected-resource/mcp }
                          route: { cluster: mcp_gateway }
                          typed_per_filter_config: *without_ext_authz
                        # 長く開く SSE を切らないよう、経路の時間制限を外す。
                        - match: { path: /mcp }
                          route: { cluster: mcp_server, timeout: 0s }
                          # 判定の X-Request-ID へ上流の値が連結されないようにする。
                          response_headers_to_remove: [x-request-id]
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      status_on_error: { code: 503 }
                      with_request_body:
                        # ゲートウェイの max_body_bytes と同じ値にする。
                        max_request_bytes: 4194304
                        allow_partial_message: false
                      allowed_headers:
                        patterns:
                          - { exact: authorization, ignore_case: true }
                          - { exact: dpop, ignore_case: true }
                          - { exact: content-type, ignore_case: true }
                          - { exact: content-encoding, ignore_case: true }
                          - { exact: origin, ignore_case: true }
                          - { prefix: mcp-, ignore_case: true }
                      http_service:
                        server_uri:
                          uri: http://mcp-gateway
                          cluster: mcp_gateway
                          # ゲートウェイの idmagic.timeout より長くする。
                          timeout: 6s
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - { exact: x-request-id, ignore_case: true }
                          allowed_client_headers:
                            patterns:
                              - { exact: www-authenticate, ignore_case: true }
                              - { exact: allow, ignore_case: true }
                              - { exact: retry-after, ignore_case: true }
                              - { exact: x-request-id, ignore_case: true }
                              - { exact: content-type, ignore_case: true }
                              - { exact: cache-control, ignore_case: true }
                          allowed_client_headers_on_success:
                            patterns:
                              - { exact: x-request-id, ignore_case: true }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: mcp_gateway
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: mcp_gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mcp-gateway, port_value: 8090 }
    - name: mcp_server
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: mcp_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mcp-server, port_value: 8091 }
