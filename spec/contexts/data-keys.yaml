# idmagic DataKeys — SCL
# SCL 3.0 context specification.
# wi-97: 保存時のエンベロープ暗号化 (per-tenant DEK / KMS master key)。ADR-148 が
# 設計を確定する。EnvelopeCrypto port (Tink AEAD/keyset, OpenBao/cleartext provider)
# は Go 側の shared technical adapter (backend/shared/security) にとどめ、この
# context は per-tenant DEK のメタデータ・ライフサイクルだけを所有する。実際の
# encrypt/decrypt 呼び出しは各所有 context の repository が行う (SCL への露出は
# 最小限)。

system: idmagic
spec_version: "3.0"
context: DataKeys
glossary:
  DataEncryptionKey:
    definition: レコード単位の可逆秘密を Tink AEAD で直接暗号化/復号するテナントスコープの対称鍵 (DEK)。
    aliases:
      - DEK
  MasterKey:
    definition: DEK を wrap (エンベロープ暗号化) する KMS 側の鍵。provider (OpenBao Transit 互換、または dev/local の Tink cleartext keyset) が custody を持ち、アプリ DB には平文で残らない。
  Wrap:
    definition: MasterKey で DEK を暗号化し、永続化可能な wrapped_dek にする操作。
    aliases:
      - wrap
  Active:
    definition: 新規の暗号化操作に使われる、テナントにつき高々1本の DataEncryptionKey の状態。
  Retiring:
    definition: 新規暗号化には使われないが、既存 ciphertext の復号にはまだ使われる状態。再暗号化 job ([[wi-126-async-job-runner]] 経由) が全参照を移行するまで維持する。
  Disabled:
    definition: 鍵材料の危殆化などにより手動で即時ロックアウトされた状態。この鍵で暗号化された ciphertext の復号は以後 fail-closed で拒否される。
    aliases:
      - disabled
  Destroyed:
    definition: wrapped_dek を破棄した終端状態。復号は恒久的に不能になる (crypto-shredding の前提)。不可逆。
  FailClosed:
    definition: unwrap 失敗・provider 到達不能・AAD/tamper 不一致など復号不能な場合に、平文へのフォールバックをせずアクセスを拒否する方針 ([[ADR-148]])。
  System:
    definition: DataKeys のライフサイクル usecase と再暗号化 job そのものを指す、人間の操作者を伴わない技術的な主体。
models:
  User:
    kind: entity
    description: IdManagement が publish する identity principal を、認可判断に必要な属性だけで表す published language stub。
    identity: id
    fields:
      id:
        type: String
      tenant_id:
        type: String
      status:
        type: String
      roles:
        type: "String[]"
  InvalidRequestError:
    kind: error
    status: 400
    description: リクエストに必須パラメータの欠落・不正値がある (RFC 6749 §5.2 invalid_request)。OAuth2 context が定義する共通 error の published language stub。
    payload:
      reason:
        type: String
        optional: true
  AccessDeniedError:
    kind: error
    status: 403
    description: principal が対象操作の policy を満たさない。Authentication context が定義する共通 error の published language stub。
  DataKeyUnavailableError:
    kind: error
    status: 503
    description: MasterKey provider への到達不能、wrap/unwrap 失敗、または AAD/tamper 不一致により鍵操作が完了できない。呼び出し元は fail-closed としてアクセスを拒否しなければならない。
    payload:
      reason:
        type: String
        optional: true
  DataKeyStillReferencedError:
    kind: error
    status: 409
    description: "DestroyTenantDataKey の対象バージョンについて、所有 context の再暗号化 job ([[wi-126-async-job-runner]] 経由の data_key_reencryption) がまだ全参照を active バージョンへ移行し終えていない。先に再暗号化を完了させてから destroy する。\n"
    payload:
      pendingCount:
        type: Integer
        optional: true
  DataKeyStatus:
    kind: enum
    description: DataEncryptionKeyLifecycle の状態。
    values:
      - active
      - retiring
      - disabled
      - destroyed
  TenantDataEncryptionKey:
    kind: entity
    identity: id
    description: "テナントごとの DEK 1 バージョン。MasterKey provider が wrap した鍵材料 (wrapped_dek) だけを保持し、平文 DEK は保存しない。テナントにつき Active は高々 1 本 ([[ADR-148]])。\n"
    constraints:
      - active_key_count(tenant_id) <= 1
    fields:
      id:
        type: String
        constraints:
          - non_empty
        description: "内部識別子。EncryptedSecret.key_id が参照する値。"
      tenant_id:
        type: String
        description: 鍵が属するテナント ID。既存 Tenant を指す。
      version:
        type: Integer
        description: テナント内で単調増加するバージョン番号。rotation のたびに 1 増える。
      status:
        type: DataKeyStatus
      wrapped_dek:
        type: Bytes
        description: MasterKey provider で wrap 済みの DEK。平文 DEK は保存・ログ・イベントに一切出さない。
      master_key_id:
        type: String
        description: この DEK を wrap した MasterKey (provider 側の鍵/バージョン) の識別子。MasterKey 自体の rotation を追跡する。
      created_at:
        type: DateTime
      activated_at:
        type: DateTime
        optional: true
      disabled_at:
        type: DateTime
        optional: true
      destroyed_at:
        type: DateTime
        optional: true
  EncryptedSecret:
    kind: value_object
    description: "可逆秘密を Active または Retiring の TenantDataEncryptionKey で暗号化した封筒。所有 context (例: Authentication の MFA シード) はこれを永続化し、平文を保存しない ([[ADR-148]])。ciphertext は Tink の AEAD primitive がそのまま出力する不透明な bytes で、nonce/tag は Tink 内部管理のため別フィールドとして持たない (自前で nonce を組み立てない、[[ADR-148]])。\n"
    fields:
      key_version:
        type: Integer
        description: 暗号化に使った TenantDataEncryptionKey.version。所有レコードのテナント境界内で一意なため、復号は呼び出し側が持つ tenant_id とこの version から対象 TenantDataEncryptionKey を選択する (グローバルな鍵 ID lookup を持たない)。
      ciphertext:
        type: Bytes
        description: Tink AEAD primitive が出力する不透明な ciphertext (nonce/tag を内包する)。AAD は呼び出し側が `(tenant, context, table, record id, field)` から再構成して渡す。
  TenantDataKeyHealth:
    kind: value_object
    description: system_admin 向けの鍵健全性スナップショット。秘密鍵材料は含まない。
    fields:
      tenant_id:
        type: String
      active_version:
        type: Integer
      status:
        type: DataKeyStatus
      provider:
        type: String
        description: "MasterKey provider 名 (例: \"openbao\" / \"tink_cleartext\")。"
      provider_reachable:
        type: Boolean
      rotated_at:
        type: DateTime
        optional: true
  DataEncryptionKeyBootstrapped:
    kind: event
    description: テナントの最初の DataEncryptionKey (version 1, active) が生成された。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      version:
        type: Integer
  DataEncryptionKeyRotated:
    kind: event
    description: 新しい DataEncryptionKey が active になり、旧バージョンが retiring に遷移した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      previousVersion:
        type: Integer
      newVersion:
        type: Integer
  DataEncryptionKeyDisabled:
    kind: event
    description: retiring の DataEncryptionKey が手動で即時ロックアウトされた。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      version:
        type: Integer
      reason:
        type: String
        optional: true
  DataEncryptionKeyDestroyed:
    kind: event
    description: wrapped_dek が破棄され、当該バージョンの復号が恒久的に不能になった。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      version:
        type: Integer
states:
  DataEncryptionKeyLifecycle:
    description: "bootstrap で active として生成される。rotation で新バージョンが active になると旧バージョンは retiring へ遷移する。retiring は disable で即時ロックアウトでき、retiring/disabled は全参照の再暗号化 ([[wi-126-async-job-runner]] 経由) 確認後にのみ destroy で終端 (destroyed) へ進む。active を直接 disable/destroy することはできない (先に rotation で退避させる)。\n"
    target: TenantDataEncryptionKey
    initial: active
    terminal:
      - destroyed
    transitions:
      - from: active
        event: DataEncryptionKeyRotated
        to: retiring
      - from: retiring
        event: DataEncryptionKeyDisabled
        to: disabled
      - from: retiring
        event: DataEncryptionKeyDestroyed
        to: destroyed
      - from: disabled
        event: DataEncryptionKeyDestroyed
        to: destroyed
interfaces:
  BootstrapTenantDataKey:
    description: テナントの最初の DataEncryptionKey (version 1) を生成し、MasterKey provider で wrap して active にする内部インターフェース。provider 到達不能時は fail-closed で失敗する。
    input:
      tenant_id:
        type: String
    output:
      key_id:
        type: String
    errors:
      - InvalidRequestError
      - DataKeyUnavailableError
    ensures:
      - active_key_count(input.tenant_id) <= 1
    stability: internal
    access: internal
  RotateTenantDataKey:
    description: テナントに新しい DataEncryptionKey (version + 1) を生成して active に切り替え、旧 active を retiring に遷移させる。旧バージョンは即座に destroy せず、復号は継続できる。
    input:
      tenant_id:
        type: String
    output:
      key_id:
        type: String
    errors:
      - InvalidRequestError
      - DataKeyUnavailableError
    requires:
      - tenant_has_active_data_key(input.tenant_id)
    ensures:
      - active_key_count(input.tenant_id) <= 1
    emits:
      - DataEncryptionKeyRotated
    stability: internal
    access: internal
  DisableTenantDataKey:
    description: "回転済み (retiring) の DataEncryptionKey 1 本を即時ロックアウトする。危殆化対応など、destroy (crypto-shredding) の前に先行して復号を止めたい場合に使う。active な version はこの操作の対象にできない (先に RotateTenantDataKey で退避させる)。\n"
    input:
      tenant_id:
        type: String
      version:
        type: Integer
    errors:
      - InvalidRequestError
      - DataKeyUnavailableError
    requires:
      - data_key_is_not_active(input.tenant_id, input.version)
    emits:
      - DataEncryptionKeyDisabled
    stability: internal
    access: internal
  DestroyTenantDataKey:
    description: "retiring または disabled の DataEncryptionKey 1 本の wrapped_dek を破棄し destroyed (crypto-shredding) にする。所有 context ごとに登録された再暗号化 job ([[wi-126-async-job-runner]] 経由の data_key_reencryption) が全参照を active バージョンへ移行済みであることを呼び出し前に検証し、未移行の参照が残っていれば DataKeyStillReferencedError で拒否する (fail-closed)。不可逆。\n"
    input:
      tenant_id:
        type: String
      version:
        type: Integer
    errors:
      - InvalidRequestError
      - DataKeyStillReferencedError
    requires:
      - data_key_is_not_active(input.tenant_id, input.version)
      - no_pending_reencryption_references(input.tenant_id)
    emits:
      - DataEncryptionKeyDestroyed
    stability: internal
    access: internal
  ListTenantDataKeyHealth:
    description: "system_admin がテナント横断で DEK 健全性 (active version / status / provider 到達性) を一覧する。鍵材料は返さない。fail-closed 判定や rotation 漏れの検知に使う。\n"
    output:
      tenants:
        type: "TenantDataKeyHealth[]"
    errors:
      - AccessDeniedError
    read_only: true
    stability: internal
    access:
      policies: [SystemAdministrator]
      resource:
        type: DataKeyDirectory
        id: '"data_key_directory"'
    bindings:
      - kind: http
        method: GET
        path: /api/admin/v1/data-keys/health
authorization:
  resources:
    DataKeyDirectory:
      description: 全テナントの DEK 健全性を横断する一覧対象を表す singleton resource。
  principals:
    SystemAdministrator:
      type: User
      matches:
        - context.authenticated
        - principal.status == "Active"
        - '"system_admin" in principal.roles'
        - principal.tenant_id == "default"
  policies:
    SystemAdministrator:
      effect: permit
      principal: SystemAdministrator
scenarios:
  テナント初回利用時にDEKがbootstrapされる:
    actor: System
    given:
      - "テナント \"tenant-a\" にまだ DataEncryptionKey が存在しない"
    main_success:
      - "テナント \"tenant-a\" に対して BootstrapTenantDataKey を呼ぶ"
      - version 1 の DataEncryptionKey が active として生成される
      - wrapped_dek のみが永続化され平文 DEK はどこにも残らない
    extensions:
      - at: 1
        condition: MasterKey provider に到達できない
        steps:
          - BootstrapTenantDataKey が DataKeyUnavailableError で失敗し fail-closed のままテナントに DEK が作られない
  DEKをrotationしても既存暗号文が復号できる:
    actor: System
    given:
      - "テナント \"tenant-a\" に active な version 1 の DataEncryptionKey があり、それで暗号化された EncryptedSecret が存在する"
    main_success:
      - "テナント \"tenant-a\" に対して RotateTenantDataKey を呼ぶ"
      - version 2 が active になり version 1 は retiring に遷移する
      - version 1 で暗号化済みの既存 EncryptedSecret は version 1 が retiring である間 引き続き復号できる
  retiringのDEKを即時ロックアウトできる:
    actor: System
    given:
      - "テナント \"tenant-a\" の version 1 が retiring である"
    main_success:
      - "テナント \"tenant-a\" の version 1 に対して DisableTenantDataKey を呼ぶ"
      - version 1 が disabled に遷移する
      - "version 1 で暗号化された EncryptedSecret の以後の復号要求は DataKeyUnavailableError で fail-closed に拒否される"
  activeなDEKは直接disableできない:
    actor: System
    given:
      - "テナント \"tenant-a\" の version 2 が active である"
    main_success:
      - "テナント \"tenant-a\" の version 2 に対して DisableTenantDataKey を呼ぶ"
    extensions:
      - at: 1
        condition: 対象 version が active である
        steps:
          - DisableTenantDataKey が InvalidRequestError で拒否され version 2 は active のままである
  全参照の再暗号化後にDEKをdestroyできる:
    actor: System
    given:
      - "テナント \"tenant-a\" の version 1 が retiring で、[[wi-126-async-job-runner]] 経由の再暗号化 job が version 1 参照をすべて version 2 へ移行済みである"
    main_success:
      - "テナント \"tenant-a\" の version 1 に対して DestroyTenantDataKey を呼ぶ"
      - version 1 が destroyed に遷移し wrapped_dek が破棄される
      - version 1 での復号は恒久的に不能になる
    extensions:
      - at: 1
        condition: 登録済みの所有 context に未移行の参照が残っている
        steps:
          - DestroyTenantDataKey が DataKeyStillReferencedError で拒否され version 1 は retiring のままである
  systemAdminがテナント横断でDEK健全性を一覧する:
    actor: System
    given:
      - 複数テナントにそれぞれ DataEncryptionKey が存在する
    main_success:
      - system_admin が ListTenantDataKeyHealth を呼ぶ
      - 各テナントの active_version / status / provider 到達性が鍵材料を含まずに返る
    extensions:
      - at: 1
        condition: 呼び出し元が system_admin ではない
        steps:
          - ListTenantDataKeyHealth が AccessDeniedError で拒否される
