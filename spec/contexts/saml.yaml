# idmagic Saml — SCL

system: idmagic
spec_version: "3.0"
context: Saml
standards:
  SAML2Core:
    title: Assertions and Protocols for the OASIS Security Assertion Markup Language (SAML) V2.0
    version: "2.0"
    url: https://docs.oasis-open.org/security/saml/v2.0/saml-core-2.0-os.pdf
    roles: [IdentityProvider]
    scope: SAMLResponse / Assertion / AuthnRequest の中核要素
    requirements:
      - id: SAML2Core-BearerAssertion
        section: "§2.4.1.2, §3.4"
        strength: MUST
        adoption: required
        statement: AuthnRequest は Version 2.0 と許容された IssueInstant を持ち、発行 assertion は Audience / Recipient / InResponseTo を検証済み要求と整合させる。同一 tenant / SP / request ID に対する assertion は一度だけ発行する
        refs:
          - interfaces.SamlSingleSignOn
          - models.SamlResponse
      - id: SAML2Core-EncryptedAssertion
        section: "§2.3.4"
        strength: MAY
        adoption: excluded
        statement: encrypted assertion
        reason: 初期 IdP 範囲では暗号化 assertion を提供しない
  SAML2Bindings:
    title: Bindings for the OASIS Security Assertion Markup Language (SAML) V2.0
    version: "2.0"
    url: https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf
    roles: [IdentityProvider]
    scope: HTTP-Redirect / HTTP-POST binding
    requirements:
      - id: SAML2Bindings-RedirectPost
        section: "§3.4, §3.5"
        strength: MUST
        adoption: required
        statement: AuthnRequest は HTTP-Redirect または HTTP-POST binding で受理し、明示された response ProtocolBinding が HTTP-POST 以外なら拒否する。SAMLResponse と返信可能な protocol error は HTTP-POST で返す
        refs:
          - interfaces.SamlSingleSignOn
  SAML2WebBrowserSSO:
    title: Profiles for the OASIS Security Assertion Markup Language (SAML) V2.0
    version: "2.0"
    url: https://docs.oasis-open.org/security/saml/v2.0/saml-profiles-2.0-os.pdf
    roles: [IdentityProvider]
    scope: Web Browser SSO Profile
    requirements:
      - id: SAML2Profile-WebBrowserSSO
        section: "§4.1"
        strength: MUST
        adoption: required
        statement: SP-initiated / IdP-initiated Web Browser SSO を提供する。未対応の ACS index、NameID format、response binding は fail-closed に拒否し、IsPassive=true でログインが必要な場合は NoPassive protocol response を返す
        refs:
          - interfaces.SamlSingleSignOn
      - id: SAML2Profile-ECP
        section: "§4.2"
        strength: MAY
        adoption: excluded
        statement: Enhanced Client or Proxy profile
        reason: 初期 IdP 範囲ではブラウザ SSO のみを扱う
  SAML2Metadata:
    title: Metadata for the OASIS Security Assertion Markup Language (SAML) V2.0
    version: "2.0"
    url: https://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf
    roles: [IdentityProvider]
    scope: IdP metadata publication
    requirements:
      - id: SAML2Metadata-IDPSSODescriptor
        section: "§2.4.3"
        strength: MUST
        adoption: required
        statement: IdP metadata は SSO endpoint、SLO endpoint、署名証明書、NameID format を公開する
        refs:
          - interfaces.PublishSamlMetadata
      - id: SAML2Metadata-WantAuthnRequestsSigned
        section: "§2.4.3"
        strength: MAY
        adoption: optional
        statement: SP ごとの trust policy として AuthnRequest / LogoutRequest 署名検証を要求できる
        reason: IDPSSODescriptor@WantAuthnRequestsSigned は IdP-wide 属性のため metadata では false のままにし、SP ごとの trust 設定で強制する
glossary:
  Saml:
    definition: SAML 2.0 IdP protocol family。Web Browser SSO Profile に基づき、SP-initiated / IdP-initiated SSO、IdP metadata 公開、署名済み SAMLResponse の発行、Single Logout、SP ごとの AuthnRequest / LogoutRequest 署名検証を扱う。encrypted assertion、ECP、SAML SP / inbound federation は初期範囲外。XML 署名・canonicalization は実績ある library に委ね、自前実装しない。
    aliases:
      - SAML
      - SAML2
      - SAML 2.0
  EndUser:
    definition: SAML Web Browser SSO または Single Logout をブラウザで開始する利用者。
  SamlIdentityProviderProfile:
    definition: テナント内のSAML IdP entityID、エンドポイント、XML署名資格情報をまとめるtrust境界。shared profileは複数SPで共有でき、dedicated profileは最大1 SPだけに割り当てる。
    aliases:
      - SAML IdP profile
      - IdP profile
models:
  User:
    kind: entity
    description: IdManagement が publish する認可 principal の最小 stub。
    identity: id
    fields:
      id:
        type: String
      tenant_id:
        type: String
      status:
        type: String
      roles:
        type: "String[]"
  Agent:
    kind: entity
    description: ApiTokens が認証した management API client の認可判断用 stub。
    identity: id
    fields:
      id:
        type: String
      tenant_id:
        type: String
      status:
        type: String
  Tenant:
    kind: entity
    description: Tenancy が publish するテナント resource の最小 stub。
    identity: id
    fields:
      id:
        type: String
  InvalidRequestError:
    kind: error
    status: 400
    description: SAML request または管理入力が契約を満たさない。
  AccessDeniedError:
    kind: error
    status: 403
    description: 認証済み principal が対象テナントの管理権限を持たない。
  ApplicationOwnedProtocolError:
    kind: error
    status: 409
    description: SAML service provider が Application に所有されているため直接削除できない。HTTP 409 とし、Application 削除を利用する。
  IdPProfileInUseError:
    kind: error
    status: 409
    description: SAML IdP profileがSPから参照されているため削除できない。HTTP 409とする。
  DefaultIdPProfileError:
    kind: error
    status: 409
    description: テナントのdefault SAML IdP profileは変更または削除できない。
  ClaimMappingPolicy:
    kind: value_object
    description: ClaimMapping context が publish する trust ごとの claim 発行規則の最小 stub。
    fields:
      configuration:
        type: JSON
        optional: true
  SamlBinding:
    kind: enum
    description: SAML 2.0 message binding。SP-initiated の AuthnRequest 受信と SAMLResponse 返送に用いる。HTTP-Redirect は GET でクエリに deflate+base64 を載せ、HTTP-POST は base64 を自動 POST フォームで運ぶ。
    values:
      - urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect
      - urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
  SamlNameIDFormat:
    kind: enum
    description: 発行 assertion の NameID format。SP metadata と AuthnRequest の NameIDPolicy で要求しうる。AuthnRequest が unspecified 以外を指定した場合はそれを尊重し、未指定なら SP の claim policy に定めた format を用いる。
    values:
      - urn:oasis:names:tc:SAML:2.0:nameid-format:unspecified
      - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
      - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
      - urn:oasis:names:tc:SAML:2.0:nameid-format:transient
  SamlIdentityProviderProfileMode:
    kind: enum
    description: IdP profileを複数SPで共有できるかを表す。
    values:
      - shared
      - dedicated
  SamlIdentityProviderProfile:
    kind: entity
    description: テナント内のSAML IdP trust境界。default profileはテナント共通entityIDと既存SAMLエンドポイントを使う。追加profileはprofile IDを含む固有entityID・エンドポイント・XmlFederationSigning鍵scopeを持つ。
    identity:
      - tenant_id
      - profile_id
    constraints:
      - default_profile_count(tenant_id) == 1
      - profile_id == "default" iff is_default
      - is_default implies mode == "shared"
      - mode == "dedicated" implies bound_service_provider_count(tenant_id, profile_id) <= 1
    fields:
      tenant_id:
        type: String
        default: default
      profile_id:
        type: String
        constraints:
          - non_empty
      name:
        type: String
        constraints:
          - non_empty
      mode:
        type: SamlIdentityProviderProfileMode
      is_default:
        type: Boolean
        default: false
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
  SamlIdentityProviderProfileAdminResponse:
    kind: value_object
    description: 管理画面向けIdP profile表現。永続profileに加え、request tenantのcanonical issuerからserverが生成した設定値と現在のSP割当数を返す。
    fields:
      profile:
        type: SamlIdentityProviderProfile
      entity_id:
        type: String
      metadata_url:
        type: String
      sso_url:
        type: String
      slo_url:
        type: String
      signing_certificate_url:
        type: String
      signing_certificate_fingerprint_sha256:
        type: String
      service_provider_count:
        type: Integer
  SamlServiceProvider:
    kind: entity
    description: "SAML 2.0 Web Browser SSO の service provider (SP) 登録。entityID で識別し、許可する AssertionConsumerService URL の閉集合、audience、NameID format、署名方針、claim 発行 policy を束ねる。application_id が NULL の catalog 外 SP も許容し、非 NULL の場合は同一 tenant の saml Application を参照して Application 1件に最大1 SP だけが紐づく。"
    identity:
      - tenant_id
      - entity_id
    fields:
      tenant_id:
        type: String
        default: default
        description: 所属テナント ID。SP 登録と SAMLエンドポイントは realm ごとに分離する。
      idp_profile_id:
        type: String
        default: default
        constraints:
          - non_empty
        description: 同一テナント内でこのSPに割り当てられたSAML IdP profile。SSO/SLO要求はrouteのprofileと一致する場合だけ受理する。
      entity_id:
        type: String
        constraints:
          - non_empty
        description: SP の識別子 (SAML entityID)。AuthnRequest の Issuer と完全一致しなければならない。
      application_id:
        type: UUID
        optional: true
        description: 対応する Application の ID。通常 CRUD では変更せず、Application 一括作成・削除だけが関係を管理する。
      display_name:
        type: String
        optional: true
        description: 管理 UI 表示名。
      acs_urls:
        type: "String[]"
        constraints:
          - non_empty
        description: 許可する AssertionConsumerService URL の閉集合。AuthnRequest が ACS URL を指定する場合はこの集合との完全一致のみ受理し、ACS URL と index がともに省略された場合だけ先頭を既定の返信先とする。初期実装では index 解決は提供しない。
      slo_url:
        type: String
        optional: true
        description: SP の SingleLogoutService URL。Single Logout の返送先。
      audience:
        type: String
        optional: true
        description: 発行 assertion の AudienceRestriction。空なら entity_id を用いる。
      claim_policy:
        type: ClaimMappingPolicy
        description: この SP 向けの NameID と attribute (claim) 発行 policy。
      sign_assertion:
        type: Boolean
        default: true
        description: 発行する Assertion を enveloped 署名するか。既定で署名する。
      sign_response:
        type: Boolean
        default: false
        description: Response 全体を enveloped 署名するか。SP が "Sign Response" を要求する場合に有効化する。
      want_authn_requests_signed:
        type: Boolean
        default: false
        description: SP ごとの AuthnRequest / LogoutRequest 署名検証 policy。true の場合は authn_request_signing_certificate_pem で Redirect binding 署名または XML 署名を検証する。IdP metadata の WantAuthnRequestsSigned には反映しない。
      authn_request_signing_certificate_pem:
        type: String
        optional: true
        description: AuthnRequest / LogoutRequest 署名検証に使う SP の X.509 証明書 PEM。want_authn_requests_signed=true の場合は必須。
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
  SamlAuthnRequest:
    kind: value_object
    description: SP-initiated SSO で受信した <samlp:AuthnRequest> から検証対象を抽出した中間表現。HTTP-Redirect は deflate+base64、HTTP-POST は base64 を復号して解析する。復号後 XML には上限を課し、deflate 爆弾を防ぐ。Version は 2.0、IssueInstant は必須で現在時刻の許容 skew と最大年齢内でなければならない。
    fields:
      id:
        type: String
        constraints:
          - non_empty
        description: 要求 ID。SAMLResponse の InResponseTo と assertion の SubjectConfirmationData に往復させる。
      issuer:
        type: String
        constraints:
          - non_empty
        description: SP の entityID。登録済み SamlServiceProvider に解決する。
      version:
        type: String
        constraints:
          - non_empty
        description: AuthnRequest/@Version。"2.0" だけを受理する。
      issue_instant:
        type: DateTime
        description: AuthnRequest/@IssueInstant。未来の skew と最大年齢を超える要求は拒否する。
      acs_url:
        type: String
        optional: true
        description: 要求が指定する AssertionConsumerService URL。許可集合との完全一致のみ受理する。
      acs_index:
        type: Integer
        optional: true
        description: AssertionConsumerServiceIndex。ACS URL との併用は拒否し、初期実装では明示的な index 指定を解決しないため拒否する。
      protocol_binding:
        type: SamlBinding
        optional: true
        description: AuthnRequest/@ProtocolBinding。省略または HTTP-POST のみを受理する。
      destination:
        type: String
        optional: true
        description: 要求が宛てた IdP の SSO endpoint URL。
      name_id_format:
        type: SamlNameIDFormat
        optional: true
        description: NameIDPolicy/@Format。unspecified 以外なら発行 assertion の NameID format に反映する。
      force_authn:
        type: Boolean
        default: false
        description: 再認証の要求。true の場合、直近再認証済みでなければログインへ戻す。
      is_passive:
        type: Boolean
        default: false
        description: 対話を禁止する要求。true で既存セッションを使えない場合はログインへ遷移せず NoPassive response を返す。
  SamlResponse:
    kind: value_object
    description: SP へ返送する <samlp:Response>。Status Success、IdP entityID の Issuer、署名済み Assertion を含み、SP 設定により Response 全体も署名する。Destination は確定した ACS URL、InResponseTo は SP-initiated の AuthnRequest ID。HTTP-POST binding で base64 化し ACS へ自動 POST する。
    fields:
      id:
        type: String
        constraints:
          - non_empty
        description: Response ID。
      destination:
        type: String
        constraints:
          - non_empty
        description: 確定した ACS URL (許可集合内)。
      in_response_to:
        type: String
        optional: true
        description: SP-initiated の AuthnRequest ID。IdP-initiated では空。
      issue_instant:
        type: DateTime
      assertion:
        type: SamlAssertion
        description: 埋め込む署名済み assertion。
  SamlAssertion:
    kind: value_object
    description: SAMLResponse に埋め込む <saml:Assertion>。Subject (NameID と bearer SubjectConfirmation)、AudienceRestriction、AuthnStatement、AttributeStatement を持つ。bearer SubjectConfirmationData は Recipient (ACS)、NotOnOrAfter、SP-initiated では InResponseTo を含む。
    fields:
      id:
        type: String
        constraints:
          - non_empty
      issuer:
        type: String
        constraints:
          - non_empty
        description: IdP の entityID。
      audience:
        type: String
        constraints:
          - non_empty
        description: SP の audience (既定 entity_id)。
      recipient:
        type: String
        description: bearer SubjectConfirmationData の Recipient (ACS URL)。
      not_before:
        type: DateTime
      not_on_or_after:
        type: DateTime
      authn_instant:
        type: DateTime
      name_id_format:
        type: SamlNameIDFormat
      name_id_value:
        type: String
        constraints:
          - non_empty
  SamlSignInIssued:
    kind: event
    description: SAML SSO で署名済み SAMLResponse を SP へ発行した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
        description: 発行したテナント ID。
      entityId:
        type: String
        description: 発行先 SP の entityID。
      userId:
        type: String
        description: subject (NameID 由来の user)。
  SamlSignInRejected:
    kind: event
    description: "SAML SSO 要求を拒否した (未登録 entityID・許可外 ACS URL・未割当 subject・解析失敗など)。"
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
        description: 拒否したテナント ID。
      entityId:
        type: String
        optional: true
        description: 要求された SP entityID (判明していれば)。
      reason:
        type: String
        description: 拒否理由の要約。
  SamlLogout:
    kind: event
    description: SAML Single Logout でローカルセッションを破棄した。LogoutRequest がある場合は LogoutResponse を登録済み SLO URL へ返す。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
        description: logout したテナント ID。
      entityId:
        type: String
        optional: true
        description: logout を要求した SP の entityID (判明していれば)。
interfaces:
  SamlSingleSignOn:
    description: "SAML 2.0 Web Browser SSO の sign-in。SP-initiated は AuthnRequest を HTTP-Redirect / HTTP-POST binding で受信し、Version=2.0、IssueInstant の許容窓、Issuer、Destination、HTTP-POST response ProtocolBinding、ACS URL/index の排他と対応可否、NameIDPolicy format を検証してから service provider を解決する。routeのIdP profile、SPのprofile binding、Destinationが一致しなければfail-closedで拒否する。署名必須 SP では Redirect binding 署名または XML 署名を検証する。未対応または矛盾する要求は fail-closed に拒否し、返信可能な検証済み ACS がある場合だけ HTTP-POST の SAML protocol error を返す。ForceAuthn=true は直近再認証済みでなければログインへ誘導する。IsPassive=true で既存セッションを使えない場合はログインへ遷移せず NoPassive response を返す。IdP-initiated は entityID クエリで対象 SP を選ぶ。未認証はログインへ誘導し、認証往復をまたいで要求を保つ。認証済みなら application 割当ゲートを fail-closed で適用し、未割当 subject には発行しない。SP の claim policy で発行した NameID と attribute を bearer SAML assertion に載せ、割当profileのXML署名資格情報とSP設定に従って assertion / response を署名し、SAMLResponse を ACS へ HTTP-POST で自動送信する。tenant / SP / AuthnRequest ID は assertion 発行直前に TTL replay store へ原子的に一度だけ記録する。InResponseTo・AudienceRestriction・Recipient・Destination を整合させる。"
    input:
      saml_request:
        type: String
        optional: true
        description: SP-initiated の AuthnRequest (binding に応じ deflate+base64 / base64)。IdP-initiated では空。
      entity_id:
        type: String
        optional: true
        description: IdP-initiated で対象 SP を指定する entityID。
      relay_state:
        type: String
        optional: true
        description: SP が往復させる不透明コンテキスト。SAMLResponse に同値で返す。
      profile_id:
        type: String
        default: default
        description: request routeが選択したIdP profile ID。
    emits:
      - SamlSignInIssued
      - SamlSignInRejected
    requires:
      - input.saml_request == null || issuer_registered(input.saml_request, context.tenant_id)
      - input.saml_request == null || request_acs_allowed(input.saml_request, context.tenant_id)
      - input.saml_request == null || destination_matches_current_sso_endpoint(input.saml_request, context.tenant_id)
      - requested_profile_matches_service_provider_binding(input.profile_id, input.saml_request, input.entity_id, context.tenant_id)
      - input.saml_request == null || request_signature_satisfies_policy(input.saml_request, context.tenant_id)
      - input.saml_request == null || request_semantics_supported_and_fresh(input.saml_request, context.tenant_id)
    ensures:
      - relay_state_round_tripped(input.relay_state)
      - saml_response_matches_request(input.saml_request, context.tenant_id)
      - assertion_issued_at_most_once_per_tenant_sp_and_request_id(input.saml_request, context.tenant_id)
    access: public
    bindings:
      - kind: http
        method: GET
        path: /saml/sso
        request_form: query
        successful_status_codes:
          - "200"
          - "303"
      - kind: http
        method: GET
        path: "/saml/idp/{profile_id}/sso"
        request_form: query
        successful_status_codes:
          - "200"
          - "303"
      - kind: http
        method: POST
        path: "/saml/idp/{profile_id}/sso"
        request_form: form
        successful_status_codes:
          - "200"
          - "303"
      - kind: http
        method: POST
        path: /saml/sso
        request_form: form
        successful_status_codes:
          - "200"
          - "303"
  SamlSingleLogout:
    description: SAML Single Logout。LogoutRequest を HTTP-Redirect / HTTP-POST binding で受信し、Issuer で SP を解決し、routeのIdP profileとSPのprofile bindingを照合し、署名必須 SP では署名を検証する。Destination は選択profileの SLO endpoint、返送先は登録済み SingleLogoutService に限定する。ローカルセッションを破棄し、割当profileの鍵で署名した LogoutResponse を登録済み SLO URL へ返す。entityID / sp 指定のローカル logout も受理するが、判定不能・未登録の返送先へはリダイレクトしない (open redirect 防止)。
    input:
      entity_id:
        type: String
        optional: true
        description: logout を要求した SP の entityID。
      relay_state:
        type: String
        optional: true
      profile_id:
        type: String
        default: default
        description: request routeが選択したIdP profile ID。
    emits:
      - SamlLogout
    requires:
      - input.entity_id == null || issuer_registered(input.entity_id, context.tenant_id)
      - logout_destination_matches_current_slo_endpoint(context.tenant_id)
      - requested_profile_matches_service_provider_binding(input.profile_id, input.entity_id, context.tenant_id)
      - logout_signature_satisfies_policy(input.entity_id, context.tenant_id)
    ensures:
      - local_session_cleared
      - logout_response_destination_is_registered(input.entity_id, context.tenant_id)
      - no_unregistered_redirect
    access: public
    bindings:
      - kind: http
        method: GET
        path: /saml/slo
        request_form: query
        successful_status_codes:
          - "200"
          - "303"
      - kind: http
        method: POST
        path: /saml/slo
        request_form: form
        successful_status_codes:
          - "200"
          - "303"
      - kind: http
        method: GET
        path: "/saml/idp/{profile_id}/slo"
        request_form: query
        successful_status_codes:
          - "200"
          - "303"
      - kind: http
        method: POST
        path: "/saml/idp/{profile_id}/slo"
        request_form: form
        successful_status_codes:
          - "200"
          - "303"
  PublishSamlMetadata:
    description: SAML 2.0 IdP metadata の公開。default routeはrealmのdefault profile、profile routeは指定profileのentityID、SSO / SLO endpoint、対応 NameID format、profile scopeのXmlFederationSigning証明書を <EntityDescriptor><IDPSSODescriptor> として公開する。active 証明書に加え rotation grace 中の verifying 証明書も掲載する。
    read_only: true
    access: public
    bindings:
      - kind: http
        method: GET
        path: /saml/metadata
        successful_status_codes:
          - "200"
      - kind: http
        method: GET
        path: "/saml/idp/{profile_id}/metadata"
        successful_status_codes:
          - "200"
  DownloadSamlSigningCertificate:
    description: SAML SP への手動 trust 設定用に、request tenant の active XmlFederationSigning X.509 証明書を PEM で公開する。rotation overlap 中の verifying 証明書を含む trust 正本は PublishSamlMetadata とし、このエンドポイントは新規設定用 active 証明書だけを返す。秘密鍵は返さない。
    read_only: true
    access: public
    bindings:
      - kind: http
        method: GET
        path: /saml/signing-certificate.pem
        successful_status_codes:
          - "200"
      - kind: http
        method: GET
        path: "/saml/idp/{profile_id}/signing-certificate.pem"
        successful_status_codes:
          - "200"
  CreateSamlIdentityProviderProfile:
    description: テナント管理者が追加のsharedまたはdedicated SAML IdP profileを作成する。default profileはこの操作では作成できない。
    input:
      profile:
        type: SamlIdentityProviderProfile
    output:
      profile:
        type: SamlIdentityProviderProfileAdminResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    requires:
      - input.profile.tenant_id == context.tenant_id
      - input.profile.profile_id != "default"
      - not input.profile.is_default
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: /api/admin/saml/idp-profiles
        request_body: json
        successful_status_codes:
          - "201"
  ListSamlIdentityProviderProfiles:
    description: テナント内のSAML IdP profileをdefault先頭、name昇順で一覧する。
    output:
      profiles:
        type: "SamlIdentityProviderProfileAdminResponse[]"
    read_only: true
    errors:
      - AccessDeniedError
    access:
      policies: [TenantAdministrator, ManagementApiClientReadSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: /api/admin/saml/idp-profiles
        successful_status_codes:
          - "200"
  UpdateSamlIdentityProviderProfile:
    description: テナント管理者が追加IdP profileのnameまたはmodeを変更する。default profileは変更できず、dedicatedへの変更時に複数SPから参照されていれば拒否する。
    input:
      profile:
        type: SamlIdentityProviderProfile
    output:
      profile:
        type: SamlIdentityProviderProfileAdminResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
      - DefaultIdPProfileError
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: PUT
        path: "/api/admin/saml/idp-profiles/{profile_id}"
        request_body: json
        successful_status_codes:
          - "200"
  DeleteSamlIdentityProviderProfile:
    description: 参照されていない追加IdP profileを削除する。default profileとSPが参照中のprofileは拒否する。
    input:
      profile_id:
        type: String
    errors:
      - InvalidRequestError
      - AccessDeniedError
      - DefaultIdPProfileError
      - IdPProfileInUseError
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: DELETE
        path: "/api/admin/saml/idp-profiles/{profile_id}"
        successful_status_codes:
          - "204"
  RegisterSamlServiceProvider:
    description: SAML service provider の登録 / 更新 (upsert)。entityID、許可 ACS URL、NameID format、audience、署名方針、claim policy を受け取り、テナント境界に閉じて保存する。entityID と ACS URL の閉集合は必須。
    input:
      service_provider:
        type: SamlServiceProvider
    output:
      service_provider:
        type: SamlServiceProvider
    errors:
      - InvalidRequestError
      - AccessDeniedError
    requires:
      - input.service_provider.tenant_id == context.tenant_id
      - input.service_provider.acs_urls.size > 0
      - not input.service_provider.want_authn_requests_signed or input.service_provider.authn_request_signing_certificate_pem != null
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: /api/admin/saml/service-providers
        request_body: json
        successful_status_codes:
          - "200"
          - "201"
  ListSamlServiceProviders:
    description: テナント内の SAML service provider を entityID 昇順で一覧する。
    output:
      service_providers:
        type: "SamlServiceProvider[]"
    read_only: true
    errors:
      - AccessDeniedError
    ensures:
      - service_providers_belong_to_tenant(output.service_providers, context.tenant_id)
    access:
      policies: [TenantAdministrator, ManagementApiClientReadSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: /api/admin/saml/service-providers
        successful_status_codes:
          - "200"
  DeleteSamlServiceProvider:
    description: entityID に一致する catalog 外 SAML service provider を削除する (冪等)。application_id が非 NULL の SP は ApplicationOwnedProtocolError (HTTP 409) で拒否する。
    input:
      entity_id:
        type: String
        description: 削除対象 SP の entityID。
    errors:
      - InvalidRequestError
      - AccessDeniedError
      - ApplicationOwnedProtocolError
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSaml]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: DELETE
        path: /api/admin/saml/service-providers
        request_form: query
        successful_status_codes:
          - "204"
authorization:
  principals:
    TenantAdministrator:
      type: User
      matches:
        - context.authenticated
        - principal.status == "Active"
        - '"admin" in principal.roles || "system_admin" in principal.roles'
    ManagementApiClient:
      type: Agent
      matches:
        - context.authenticated
        - principal.status == "Active"
        - principal.tenant_id == context.tenant_id
  policies:
    TenantAdministrator:
      effect: permit
      principal: TenantAdministrator
      when: principal.tenant_id == resource.id
    ManagementApiClientReadSaml:
      effect: permit
      principal: ManagementApiClient
      when: '"saml:read" in context.token_scopes && principal.tenant_id == context.tenant_id'
    ManagementApiClientWriteSaml:
      effect: permit
      principal: ManagementApiClient
      when: '"saml:write" in context.token_scopes && principal.tenant_id == context.tenant_id'
scenarios:
  SPは署名証明書を取得できる:
    actor: EndUser
    given:
      - SP が IdMagic tenant の SAML metadata または証明書ダウンロード URL を参照できる
    main_success:
      - SP は active XmlFederationSigning 証明書を PEM で取得する
      - 取得した証明書は同時点の SAML metadata に公開される証明書と一致する
      - rotation overlap 中の全 trust 証明書は SAML metadata から取得する
    extensions:
      - at: 1
        condition: federation signing credential が利用不能である
        steps:
          - 証明書を返さずエラーを返す
  SPは割当IdP profileだけを利用できる:
    actor: EndUser
    given:
      - SPはprofile-aへ割り当てられている
      - profile-aとprofile-bは同一テナント内に存在する
    main_success:
      - profile-aのSSO endpointへSPのAuthnRequestを送る
      - Destination、SP Issuer、profile bindingが一体で検証される
      - profile-aのentityIDと署名資格情報でSAMLResponseが発行される
    extensions:
      - at: 1
        condition: 同じ要求をprofile-bのSSO endpointへ送る
        steps:
          - SAMLResponseを発行せずSamlSignInRejectedを発行する
      - at: 1
        condition: profile-aのSSO URLと異なるDestinationを指定する
        steps:
          - fail-closedで拒否する
  専用profileは固有metadataを公開する:
    actor: EndUser
    given:
      - テナントにdefault profileとdedicated profileが存在する
    main_success:
      - dedicated profileのmetadata URLを取得する
      - metadataはprofile固有entityID、SSO/SLO URL、署名証明書を公開する
      - default metadataとは異なる署名資格情報を公開する
    extensions:
      - at: 1
        condition: 存在しないまたは別テナントのprofile IDを指定する
        steps:
          - metadataと証明書を公開せずnot foundを返す
  管理者はSAML IdP profileを共有または専用で管理できる:
    actor: TenantAdministrator
    given:
      - テナントには変更不能なdefault shared profileが存在する
    main_success:
      - 管理者がread-onlyの連携エンドポイント画面から専用profile管理一覧とprofile詳細へ移動する
      - 管理者が専用作成画面でshared profileを作成して複数SPから選択する
      - 管理者がprofile詳細から専用編集画面へ移り、追加profileのnameまたはmodeを変更する
      - 管理者がdedicated profileを作成して1 SPへ割り当てる
      - 未使用の追加profileを削除する
    extensions:
      - at: 5
        condition: profileがSPから参照中またはdefaultである
        steps:
          - 削除をconflictで拒否する
      - at: 4
        condition: dedicated profileを別のSPへも割り当てる
        steps:
          - bindingをInvalidRequestErrorで拒否する
  management API clientはSAML scope内のservice providerだけを操作できる:
    actor: ManagementApiClient
    given:
      - client は対象 tenant の有効な API access token を提示している
    main_success:
      - saml:read scope で service provider を参照できる
      - saml:write scope で service provider を登録または削除できる
    extensions:
      - at: 1
        condition: saml:read だけで変更操作を要求する
        steps:
          - 操作は AccessDeniedError で拒否される
      - at: 1
        condition: token の tenant と request tenant が一致しない
        steps:
          - 操作は AccessDeniedError で拒否される
  SAML SP initiated SSO succeeds:
    actor: EndUser
    given:
      - subject は認証済みで対象 Application に割り当てられている
      - SP の entityID、ACS URL、Destination は登録済みである
    main_success:
      - 登録済み SP の AuthnRequest を受信する
      - Version / IssueInstant / Issuer / ACS / Destination / binding / NameIDPolicy / subject assignment を検証する
      - 署名済み SAMLResponse を ACS へ POST し RelayState を同値で返す
      - assertion と response の署名は request tenant の active XmlFederationSigning 鍵を使用する
    extensions:
      - at: 2
        condition: entityID、ACS、Destination、subject assignment のいずれかが不正である
        steps:
          - SAMLResponse を発行しない
          - SamlSignInRejected を発行して fail-closed で拒否する
      - at: 2
        condition: AuthnRequest の解析または署名検証に失敗する
        steps:
          - SamlSignInRejected を発行して protocol error を返す
      - at: 2
        condition: AuthnRequest の Version、IssueInstant、ProtocolBinding、ACS index、NameIDPolicy format が未対応または矛盾する
        steps:
          - assertion を発行しない
          - 検証済み ACS が確定済みの場合だけ HTTP-POST の SAML protocol error を返す
          - それ以外は SamlSignInRejected を発行して fail-closed で拒否する
      - at: 2
        condition: IsPassive=true かつ利用可能な既存セッションがない
        steps:
          - ログイン画面へ遷移しない
          - 検証済み ACS へ HTTP-POST の NoPassive SAML protocol response を返す
      - at: 3
        condition: 同じ tenant / SP / AuthnRequest ID に対する assertion がすでに発行済みである
        steps:
          - assertion を発行しない
          - SamlSignInRejected を発行して fail-closed で拒否する
  SAML rejects unregistered or mismatched request:
    actor: EndUser
    given:
      - AuthnRequest の entityID、ACS URL、Destination、subject assignment のいずれかが不正である
    main_success:
      - 不正な AuthnRequest を受信する
      - SAMLResponse を発行せず SamlSignInRejected を発行する
  SAML ForceAuthn redirects stale session:
    actor: EndUser
    given:
      - ForceAuthn=true かつ認証時刻が再認証猶予より古い
    main_success:
      - ForceAuthn=true の AuthnRequest を受信する
      - 古い認証コンテキストを検出する
      - ログインへリダイレクトする
flows:
  AdminSamlIdpProfiles:
    entry: IdPProfiles
    views:
      IdPProfiles:
        sees: SAML IdP profile一覧(default、shared、dedicated、割当数、metadata URL)
        does:
          - action: create
            does: 一覧から分離された専用作成画面を開く
            to: NewIdPProfile
          - action: view
            does: profileを選択してread-onlyの詳細画面を開く
            to: IdPProfile
      IdPProfile:
        sees: profileのname、mode、割当数、正規エンドポイントを表示するread-only詳細画面
        does:
          - action: edit
            does: 追加profileの専用編集画面を開く。default profileには表示しない
            to: EditIdPProfile
          - action: delete
            does: 影響を確認して未使用の追加profileを削除する
            interface: DeleteSamlIdentityProviderProfile
            to: IdPProfiles
      NewIdPProfile:
        sees: sharedまたはdedicated profileの専用作成フォーム
        does:
          - action: create
            does: profileを作成してread-only詳細画面へ移る
            interface: CreateSamlIdentityProviderProfile
            to: IdPProfile
          - action: cancel
            does: 変更せず一覧へ戻る
            to: IdPProfiles
      EditIdPProfile:
        sees: 追加profileのname、mode、割当数、正規エンドポイントを確認できる専用編集フォーム
        does:
          - action: update
            does: 追加profileのnameまたはmodeを更新してread-only詳細画面へ戻る
            interface: UpdateSamlIdentityProviderProfile
            to: IdPProfile
          - action: cancel
            does: 変更せずread-only詳細画面へ戻る
            to: IdPProfile
  SamlBrowserNavigation:
    entry: ServiceProvider
    views:
      ServiceProvider:
        sees: SP からの SAML リクエスト受信画面(SP-initiated AuthnRequest または IdP-initiated entityID 選択)
        does:
          - action: sign_in
            does: SP からの SAML 認証リクエストを受け取り、必要に応じてログインする
            interface: SamlSingleSignOn
            to: ServiceProvider
          - action: sign_out
            does: SP からの SAML ログアウトリクエストを受け取る
            interface: SamlSingleLogout
            to: ServiceProvider
