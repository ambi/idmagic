# idmagic Tenancy — SCL
# Migrated to SCL 3.0 by wi-209 (ADR-103).

system: idmagic
spec_version: "3.0"
context: Tenancy
glossary:
  Tenant:
    definition: 独立した認可境界。Client / User / Consent / 鍵 / ポリシーがこの境界に閉じる。URL 上は Realm という別名で表現される。
    aliases:
      - tenant
      - テナント
      - Realm
      - realm
    not_to_confuse_with:
      - term: Client
        reason: Tenant は境界、Client は境界内のアプリケーション。Tenant は人間/組織を表し、Client はそのテナント所属のアプリ。
  DefaultTenant:
    definition: "起動時に自動作成される `realm == \"default\"` のテナント。id は固定 UUID の代理キー。単一テナント運用時の互換と、未 prefix HTTP リクエストの解決先を兼ねる。"
    aliases:
      - default tenant
      - デフォルトテナント
  TenantDisablement:
    definition: "Tenant.disabled_at を設定してテナント単位で `/authorize` / `/token` / `/login` 等を停止する復活可能な操作。テナント物理削除とは独立。"
    aliases:
      - disable tenant
      - テナント無効化
  EntraFederation:
    definition: Microsoft Entra ID の検証済みドメインを WS-Federation / WS-Trust の federated IdP として接続する profile。
    aliases:
      - Microsoft365Federation
      - AzureADFederation
      - M365Federation
  Disabled:
    definition: 復活可能な無効化状態。Tenant と (慣例的に) User の disabled_at 経路で共有される。
    aliases:
      - disabled
  Disable:
    definition: "対象を Disabled に遷移させる。Tenant では `/api/admin/tenants/{id}/disable` から発火。"
    aliases:
      - disable
  Enable:
    definition: "Disabled の対象を Active に戻す。Tenant では `/api/admin/tenants/{id}/enable` から発火。"
    aliases:
      - enable
  System:
    definition: IdP プロセス自身。起動時に default テナントを自動作成する。
  OAuth2Client:
    definition: OIDC / OAuth2 プロトコルエンドポイントを呼び出す外部クライアントアプリケーション。
  EndUser:
    definition: テナントに所属する人間の利用者。通知メールの受信者であり、その locale 属性が通知の言語解決の第 1 段になる。IdManagement が所有する User の published language stub。
    aliases:
      - end user
      - 利用者
  HardQuota:
    definition: 超過するとリソース作成が同期的にエラーとなる厳格な上限。
  SoftQuota:
    definition: 超過しても作成は成功するが、警告が通知される遅延評価の上限。
  NotificationTemplate:
    definition: "利用者へ送る通知メール 1 通の文面定義。template_key と locale の組で一意に定まり、件名 / プレーンテキスト本文 / HTML 本文 / 差出人表示名を持つ。組込み既定 (システムが同梱する ja / en の文面) とテナント上書きの 2 段で解決する。"
    aliases:
      - 通知テンプレート
      - notification template
      - email template
    not_to_confuse_with:
      - term: TenantBranding
        reason: TenantBranding は hosted UI の見た目、NotificationTemplate は送信するメールの文面。両者は独立に設定する。
  NotificationTemplateKey:
    definition: 通知の用途を表す固定識別子。カタログに存在する key だけが送信・上書きの対象になり、テナントは key 自体を追加できない。
    aliases:
      - template key
      - テンプレートキー
  NotificationPlaceholder:
    definition: "テンプレート本文に `{{name}}` の形で書ける差し込み変数。template_key ごとに許可集合が決まっており、許可外の変数を含む上書きは保存時に拒否される。"
    aliases:
      - placeholder
      - 差し込み変数
  NotificationLocaleResolution:
    definition: "通知 1 通に使う locale を決める手順。受信者 User の locale 属性 → テナントの default_locale → システム既定 locale の順に、カタログが対応する最初の locale を採用する。"
    aliases:
      - locale 解決順序
      - locale resolution
  BuiltinNotificationTemplate:
    definition: システムが同梱する組込み既定テンプレート。テナント上書きが無い、または上書きが削除された場合に使われる。テナントは編集できず「既定に戻す」ことでこの文面へ復帰する。
    aliases:
      - 組込み既定テンプレート
      - builtin template
models:
  User:
    kind: entity
    description: IdManagement が publish する identity principal を、認可判断に必要な属性だけで表す published language stub。
    identity: id
    fields:
      id:
        type: String
      tenant_id:
        type: String
      status:
        type: String
      roles:
        type: "String[]"
  TenantQuota:
    kind: value_object
    description: テナント単位のリソース上限値 (Hard / Soft)。システム管理者がテナントごとに上書きできる。
    fields:
      users:
        type: Integer
      groups:
        type: Integer
      agents:
        type: Integer
      applications:
        type: Integer
      oauth2_clients:
        type: Integer
      active_sessions:
        type: Integer
      consents:
        type: Integer
      active_jobs:
        type: Integer
      audit_events_retained:
        type: Integer
      export_artifacts_bytes:
        type: Integer
  TenantUsage:
    kind: value_object
    description: テナント単位の現在のリソース利用量。
    fields:
      users:
        type: Integer
      groups:
        type: Integer
      agents:
        type: Integer
      applications:
        type: Integer
      oauth2_clients:
        type: Integer
      active_sessions:
        type: Integer
      consents:
        type: Integer
      active_jobs:
        type: Integer
      audit_events_retained:
        type: Integer
      export_artifacts_bytes:
        type: Integer
  TenantQuotaUpdateRequest:
    kind: value_object
    description: system_admin がテナントの Quota を上書きする JSON リクエスト。
    fields:
      users:
        type: Integer
        optional: true
      groups:
        type: Integer
        optional: true
      agents:
        type: Integer
        optional: true
      applications:
        type: Integer
        optional: true
      oauth2_clients:
        type: Integer
        optional: true
      active_sessions:
        type: Integer
        optional: true
      consents:
        type: Integer
        optional: true
      active_jobs:
        type: Integer
        optional: true
      audit_events_retained:
        type: Integer
        optional: true
      export_artifacts_bytes:
        type: Integer
        optional: true
  TenantStatus:
    kind: enum
    description: "テナント状態。Active は通常稼働、Disabled はテナント全体のプロトコル受付を停止 (`/authorize` `/token` 等が一律 invalid_request)。"
    values:
      - Active
      - Disabled
  TenantEndpointStyle:
    kind: enum
    description: "テナントの正規ロケーションの形。1 テナントは 1 つの正規ロケーションしか持たず、そこから issuer / cookie scope / WebAuthn RP ID が一意に決まる。Path は共有ホスト上の `{base}/realms/{realm}` で、ワイルドカード DNS も証明書も要らない既定。Subdomain はテナント固有ホスト `{realm}.{tenant_base_domain}` で、テナント固有 origin を必要とする機能 (`__Host-` cookie、テナント別 WebAuthn RP ID、テナント別ブランド origin) が成立する。tenant_base_domain が未設定の配備では Subdomain を選べない。"
    values:
      - Path
      - Subdomain
  AttributeType:
    kind: enum
    description: 属性値の sum type discriminator。OIDC 標準クレームの組み込み属性と tenant 定義 custom 属性の両方で共通。
    values:
      - String
      - Number
      - Boolean
      - Date
      - StringArray
  AttrVisibility:
    kind: enum
    description: 属性の開示範囲。ClaimExposed のみ UserInfo / ID Token に出せる。
    values:
      - Private
      - SelfReadable
      - AdminReadable
      - ClaimExposed
  Tenant:
    kind: entity
    description: "テナント (realm) 集約。Client / User / Consent / ポリシー / ブランディングはこの境界に閉じる。`default` テナントは起動時に自動作成され、削除・無効化とも不可。live aggregate は tenant_id で既存 Tenant を参照し、履歴・イベント用途の record は監査保持のため tenant 外部キーを持たない場合がある。"
    identity: id
    fields:
      id:
        type: String
        constraints:
          - non_empty
        description: "不変の UUID 代理キー。テナント生成時に採番し以後不変。全テーブルの tenant_id FK・spec.DefaultTenantID・内部のテナント参照はこの値を用いる。"
      realm:
        type: String
        constraints:
          - non_empty
          - max_length: 63
          - pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        description: "URL `/realms/{realm}/`・サブドメイン `{realm}.{base}`・OIDC issuer 等の公開語彙に現れる不変の一意識別子 (旧 id の slug)。endpoint_style が Subdomain のときホスト名の最左ラベルになるため、単一 DNS ラベルとして妥当でなければならない: hyphen で終わらず、IDNA A-label と紛れる xn-- で始まらない。予約語 admin / www / api / login / id / sso / mail / smtp / status / docs / app / static / cdn / auth / account は禁止。採番後は変更できない (rename 不可) — issuer と WebAuthn RP ID に現れるため、変更は既発行 token と既存 passkey を破壊する。制約の強化は新規作成時にのみ適用し、既存 realm は再検証しない。"
      display_name:
        type: String
        constraints:
          - non_empty
          - max_length: 200
        annotations:
          pii: true
      status:
        type: TenantStatus
        default: Active
      endpoint_style:
        type: TenantEndpointStyle
        default: Path
        description: このテナントの正規ロケーションの形。テナントは正規ロケーションからのみ到達でき、issuer / cookie scope / WebAuthn RP ID はすべてそこから導出される。変更は破壊的操作なので SetTenantEndpointStyle でのみ行う。
      password_policy_override:
        type: PasswordPolicyOverride
        optional: true
        description: Authentication context が所有する PasswordPolicy 標準値をこのテナントだけ上書きする値。指定された値のみ上書きされ、それ以外は global default を継承。
      default_locale:
        type: String
        optional: true
        constraints:
          - pattern: "^[a-z]{2}$"
        description: "テナントの既定 locale。受信者 User に locale 属性が無いときの通知の言語として使う (NotificationLocaleResolution の第 2 段)。未設定・空文字列はシステム既定 locale を意味する。サポート外の値は保存時に拒否する。"
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
        description: 作成時は created_at と同じ値を持ち、以後 mutable aggregate の管理操作ごとに更新する。
      disabled_at:
        type: DateTime
        optional: true
        description: テナント無効化時刻。non-null なら /authorize / /token / /login 等を一律拒否。
  PasswordPolicyOverride:
    kind: value_object
    description: "テナント固有のパスワードポリシー上書き値 (Phase 4)。Phase 0 で固定値とした\nAuthentication context の PasswordPolicy をテナント解決ポートで差し替えるためのスキーマ。\n省略フィールドは global default を継承し、change_password / reset_password の\n評価経路ではテナント値が global より厳しい方向にのみ働く想定。\n"
    fields:
      min_length:
        type: Integer
        optional: true
        description: 下限長 (≥ global default を推奨)
      max_length:
        type: Integer
        optional: true
        description: 上限長
      history_depth:
        type: Integer
        optional: true
        description: 履歴照合件数 (PasswordHistoryNoReuse)
  UserAttributeDef:
    kind: value_object
    description: 属性 1 件の定義。OIDC 組み込みカタログ (BuiltinUserAttributeDefs) と tenant 定義 (TenantUserAttributeSchema) の両方で使う。key は snake_case、英字始まり。
    fields:
      key:
        type: String
        constraints:
          - non_empty
          - pattern: "^[a-z][a-z0-9_]{0,62}$"
      label:
        type: String
        optional: true
        constraints:
          - max_length: 100
        description: 利用者向けの日本語表示名。未設定なら UI は key を表示する。
      type:
        type: AttributeType
      multi_valued:
        type: Boolean
        default: false
        description: type == StringArray のときのみ true。
      required:
        type: Boolean
        default: false
      editable_by_user:
        type: Boolean
        default: false
        description: self-service 経路で end-user が編集できるか。
      claim_name:
        type: String
        optional: true
        description: 露出時に UserInfo / ID Token に出す OIDC claim 名。
      oidc_scope:
        type: String
        optional: true
        description: 露出を解禁する OIDC scope (profile / phone / address 等)。
      visibility:
        type: AttrVisibility
        default: Private
      pii:
        type: Boolean
        default: true
        description: 省略時は PII 扱い (監査 hash 化) が安全側 default。
  TenantUserAttributeSchema:
    kind: entity
    description: tenant 単位の custom 属性定義集合。組み込み属性はコード (BuiltinUserAttributeDefs) が持ち、本集合は tenant 固有分のみ。tenant aggregate には埋め込まず独立 aggregate として持ち、tenant 削除時に cascade する。
    identity: tenant_id
    fields:
      tenant_id:
        type: String
        default: default
        description: 所属テナント ID。
      attributes:
        type: "UserAttributeDef[]"
        description: key が一意で組み込み属性と衝突しない定義の並び。
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
  PasswordPolicyDefaults:
    kind: value_object
    description: "Authentication context の PasswordPolicy の現行値。テナント設定 UI が「テナント上書きが\n無いときに実際に適用される値」をユーザに具体数字で示せるよう、API レスポンスに\n埋め込む。同時に override がこの値より弱い場合の reject 閾値でもある。\n"
    fields:
      min_length:
        type: Integer
        description: Authentication context の PasswordPolicy.min_length。
      max_length:
        type: Integer
        description: Authentication context の PasswordPolicy.max_length。
      history_depth:
        type: Integer
        description: Authentication context の PasswordPolicy.history_depth。
  AdminSettingsResponse:
    kind: value_object
    description: "`/api/admin/settings` の返り値。テナント本体ではなく管理 UI 向けの projection で、\ntenant_id (UUID) / realm (URL slug) / display_name / password_policy_override に加え、\nUI 表示と weaker policy gating に使う Authentication context の PasswordPolicy 標準値を併せて返す。\n"
    fields:
      tenant_id:
        type: String
        description: テナントの不変 UUID キー。
      realm:
        type: String
        description: URL `/realms/{realm}/` に現れる slug。SCIM エンドポイント URL 等の組み立てに使う。
      display_name:
        type: String
        annotations:
          pii: true
      password_policy_override:
        type: PasswordPolicyOverride
        optional: true
      password_policy_defaults:
        type: PasswordPolicyDefaults
      default_locale:
        type: String
        optional: true
        description: テナントの既定 locale。未設定ならシステム既定 locale を使う。
      supported_locales:
        type: "String[]"
        description: カタログが同梱翻訳を持つ locale の一覧。管理 UI が既定 locale と通知テンプレートの選択肢を組み立てるために返す。
      quota:
        type: TenantQuota
      usage:
        type: TenantUsage
  TenantUserAttributeSchemaResponse:
    kind: value_object
    description: "`/api/admin/tenant/user_attribute_schema` の返り値。tenant 固有の custom 属性定義\n(attributes) に加え、参照用にコードが持つ組み込みカタログ (builtin) を併せて返し、\nUI が key 衝突を避けつつ全属性を一覧できるようにする。\n"
    fields:
      tenant_id:
        type: String
      attributes:
        type: "UserAttributeDef[]"
        description: tenant が編集可能な custom 定義。
      builtin:
        type: "UserAttributeDef[]"
        description: コード提供の読み取り専用カタログ (BuiltinUserAttributeDefs)。
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
  TenantUserAttributeSchemaUpdateRequest:
    kind: value_object
    description: tenant の custom 属性定義を全置換する JSON リクエスト。組み込み属性との key 衝突・重複 key は use case 側で拒否する。
    fields:
      attributes:
        type: "UserAttributeDef[]"
        description: 新しい custom 定義一覧。空配列で全削除。
  TenantBrandingAssetKind:
    kind: enum
    description: TenantBranding が持つ画像アセットの種別。
    values:
      - Logo
      - Favicon
  TenantFooterLink:
    kind: value_object
    description: hosted UI footer に表示する、順序固定の安全な外部リンク。ラベルはプレーンテキストとして描画し、URL は HTTPS のみを許可する。存在する場合は label と url の両方が非空でなければならない (片側だけの指定を拒否する)。
    fields:
      label:
        type: String
        constraints:
          - non_empty
          - max_length: 80
        description: 利用者に表示するリンクテキスト。HTML / Markdown として解釈しない。
      url:
        type: String
        constraints:
          - non_empty
          - max_length: 2048
          - pattern: "^https://"
        description: 遷移先。https scheme のみ許可する allowlist。
  TenantBranding:
    kind: entity
    description: "テナント単位の hosted UI ブランディング設定 (wi-89, ADR-096)。Tenant 集約には埋め込まず、\nTenantUserAttributeSchema と同じ理由 (sparse な per-tenant config を Tenant 本体から分離する) で\n独立 entity として持つ。全フィールド optional で、行が存在しない、または全フィールドが未設定なら\n「branding 未設定」を意味し、GetTenantBranding はシステム既定にフォールバックする。\n色・リンク・テキストは限定トークンのみを受け付け、任意 CSS / HTML は構造的に受け付けない。\n"
    identity: tenant_id
    fields:
      tenant_id:
        type: String
        description: 所属テナント ID。
      product_name:
        type: String
        optional: true
        constraints:
          - max_length: 80
        description: sign-in 画面等に出す表示名。空文字列は未設定を意味し、システム既定 (IdMagic) を表示する。
      logo_object_key:
        type: String
        optional: true
        description: テナント境界内に保存されたロゴ画像 object の opaque key。管理者は直接入力せず UploadTenantBrandingAsset (kind=Logo) を経由する。
      logo_url:
        type: String
        optional: true
        description: IdP が保存済みロゴから生成する内部配信 URL。
      favicon_object_key:
        type: String
        optional: true
        description: テナント境界内に保存された favicon 画像 object の opaque key。UploadTenantBrandingAsset (kind=Favicon) を経由する。
      favicon_url:
        type: String
        optional: true
        description: IdP が保存済み favicon から生成する内部配信 URL。
      primary_color:
        type: String
        optional: true
        constraints:
          - pattern: "^#[0-9a-fA-F]{6}$"
        description: "ブランドカラー (プライマリ)。CSS custom property `--tenant-brand-primary` としてのみ注入する。`#rrggbb` 形式ならコントラスト比にかかわらず保存でき、空文字列は未設定へ正規化してシステム既定へ戻す。配色の可読性はテナントが判断する。"
      accent_color:
        type: String
        optional: true
        constraints:
          - pattern: "^#[0-9a-fA-F]{6}$"
        description: "ブランドカラー (アクセント)。CSS custom property `--tenant-brand-accent` としてのみ注入する。`#rrggbb` 形式ならコントラスト比にかかわらず保存でき、空文字列は未設定へ正規化してシステム既定へ戻す。配色の可読性はテナントが判断する。"
      footer_link_1:
        type: TenantFooterLink
        optional: true
        description: footer の先頭リンク。リンク順序は footer_link_1、footer_link_2 に固定する。
      footer_link_2:
        type: TenantFooterLink
        optional: true
        description: footer の二番目のリンク。リンク順序は footer_link_1、footer_link_2 に固定する。
      footer_text:
        type: String
        optional: true
        constraints:
          - max_length: 280
        description: footer に表示する補足テキスト (著作権表示等)。プレーンテキストとして描画側の既定エスケープでのみ表示する。
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
        description: 更新のたびに進む。公開レスポンスの version / ETag として使う。
  TenantBrandingResponse:
    kind: value_object
    description: "GetTenantBranding / UpdateTenantBranding / asset upload・削除が返す公開安全な projection。\n未設定フィールドはシステム既定を表す (クライアント側で `IdMagic` 等のデフォルトに解決する)。\n"
    fields:
      product_name:
        type: String
        optional: true
      logo_url:
        type: String
        optional: true
      favicon_url:
        type: String
        optional: true
      primary_color:
        type: String
        optional: true
      accent_color:
        type: String
        optional: true
      footer_link_1:
        type: TenantFooterLink
        optional: true
      footer_link_2:
        type: TenantFooterLink
        optional: true
      footer_text:
        type: String
        optional: true
      updated_at:
        type: DateTime
        optional: true
        description: branding が一度でも設定されていれば version / ETag として使う。未設定なら省略する。
  TenantBrandingUpdateRequest:
    kind: value_object
    description: 管理者が branding のテキスト / 色 / リンクを更新する JSON リクエスト。画像アセットは UploadTenantBrandingAsset / DeleteTenantBrandingAsset 経由で別途扱う。指定フィールドのみ変更し、null を渡すとそのフィールドを未設定に戻す。primary_color / accent_color は空文字列でも未設定に戻す。
    fields:
      product_name:
        type: String
        optional: true
      primary_color:
        type: String
        optional: true
      accent_color:
        type: String
        optional: true
      footer_link_1:
        type: TenantFooterLink
        optional: true
      footer_link_2:
        type: TenantFooterLink
        optional: true
      footer_text:
        type: String
        optional: true
  TenantBrandingUploadResponse:
    kind: value_object
    description: 画像アセットのアップロードまたは削除後の branding 表現。
    fields:
      branding:
        type: TenantBrandingResponse
  TenantBrandingUpdated:
    kind: event
    description: テナント内 admin が branding (テキスト / 色 / リンク / 画像アセット) を更新した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      actorUserId:
        type: String
      changedFields:
        type: "String[]"
  NotificationTemplateKey:
    kind: enum
    description: "通知の用途を表す固定識別子。カタログはこの全 key に対し ja / en の組込み既定テンプレートを持つ。テナントは key を追加できない。AccountSecurityAlert は現在どの経路からも送信されず、カタログと編集面だけが先に存在する。"
    values:
      - PasswordReset
      - EmailVerification
      - EmailChangeConfirmation
      - AccountSecurityAlert
      - LifecycleWorkflowNotification
  NotificationTemplate:
    kind: entity
    description: "テナントによる通知テンプレート上書き 1 件。(tenant_id, template_key, locale) で一意。行が存在しない組み合わせは組込み既定 (BuiltinNotificationTemplate) を使う。上書きできるのは件名 / プレーンテキスト本文 / HTML 本文 / 差出人表示名だけで、任意 HTML 文書や CSS の全面差し替えは受け付けない。本文が使える差し込み変数は template_key ごとの許可集合に限られる。"
    identity: tenant_id
    fields:
      tenant_id:
        type: String
        description: 所属テナント ID。
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
        constraints:
          - non_empty
          - pattern: "^[a-z]{2}$"
        description: この上書きが適用される locale。カタログが同梱翻訳を持つ locale のみ受け付ける。
      subject:
        type: String
        constraints:
          - non_empty
          - max_length: 200
        description: メール件名。改行を含められない単一行のテキストとして扱う。
      body_text:
        type: String
        constraints:
          - non_empty
          - max_length: 8000
        description: プレーンテキスト本文。HTML として解釈しない。
      body_html:
        type: String
        constraints:
          - non_empty
          - max_length: 20000
        description: "HTML 本文。`<body>` 内に入る fragment であり、doctype / `<head>` / 文字エンコーディング / 本文コンテナのスタイルはシステムが供給する外枠が持つ。差し込み値は必ずエスケープして展開する。テキスト本文と必ず対で保存し、片方だけの上書きは作れない。"
      from_display_name:
        type: String
        optional: true
        constraints:
          - max_length: 80
        description: 差出人の表示名。空文字列は未設定を意味し、システム既定の差出人表示になる。メールアドレス自体はサーバ設定であり上書きできない。
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
  NotificationTemplateSummary:
    kind: value_object
    description: テンプレート一覧の 1 行。key × locale の組ごとに、上書き済みかどうかと現在有効な件名を返す。
    fields:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
      customized:
        type: Boolean
        description: true ならテナント上書きが存在する。false なら組込み既定。
      subject:
        type: String
        description: 現在有効な件名 (上書きがあれば上書き、無ければ組込み既定)。
      updated_at:
        type: DateTime
        optional: true
        description: 上書きが存在する場合の最終更新時刻。組込み既定のみなら省略する。
  NotificationTemplateListResponse:
    kind: value_object
    description: テンプレート一覧。カタログの全 key × 全サポート locale を、上書きの有無にかかわらず返す。
    fields:
      templates:
        type: "NotificationTemplateSummary[]"
      supported_locales:
        type: "String[]"
  NotificationTemplateDetail:
    kind: value_object
    description: "テンプレート 1 件の編集用表現。現在有効な文面と、組込み既定の文面、および使用できる差し込み変数の許可集合を同時に返す。管理 UI は既定との差分提示と「既定に戻す」を追加の問い合わせなしに描ける。"
    fields:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
      customized:
        type: Boolean
      subject:
        type: String
      body_text:
        type: String
      body_html:
        type: String
      from_display_name:
        type: String
        optional: true
      default_subject:
        type: String
        description: 組込み既定の件名。
      default_body_text:
        type: String
      default_body_html:
        type: String
      placeholders:
        type: "String[]"
        description: この template_key で使える差し込み変数名の許可集合。
      updated_at:
        type: DateTime
        optional: true
  NotificationTemplateUpdateRequest:
    kind: value_object
    description: "テンプレート上書きの保存リクエスト。4 フィールドをまとめて置換する部分更新ではない全置換で、件名 / テキスト本文 / HTML 本文はいずれも必須。許可集合外の差し込み変数を含む場合は保存せず拒否する。"
    fields:
      subject:
        type: String
        constraints:
          - non_empty
          - max_length: 200
      body_text:
        type: String
        constraints:
          - non_empty
          - max_length: 8000
      body_html:
        type: String
        constraints:
          - non_empty
          - max_length: 20000
      from_display_name:
        type: String
        optional: true
        constraints:
          - max_length: 80
  NotificationTemplatePreviewRequest:
    kind: value_object
    description: 保存前の文面をサンプル値で描画するリクエスト。省略したフィールドは現在有効な文面を使う。
    fields:
      subject:
        type: String
        optional: true
      body_text:
        type: String
        optional: true
      body_html:
        type: String
        optional: true
      from_display_name:
        type: String
        optional: true
  NotificationTemplatePreviewResponse:
    kind: value_object
    description: サンプル値を展開した描画結果。実際のメール送信は起こらない。
    fields:
      subject:
        type: String
      body_text:
        type: String
      body_html:
        type: String
      from_display_name:
        type: String
        optional: true
  NotificationTemplateTestSendResponse:
    kind: value_object
    description: テスト送信の結果。宛先は操作した管理者本人の検証済みメールアドレスに固定され、リクエストでは指定できない。
    fields:
      delivered:
        type: Boolean
      to:
        type: String
        annotations:
          pii: true
        description: 実際に送信した宛先 (操作者本人のアドレス)。UI が「どこへ送ったか」を明示するために返す。
  NotificationTemplateUpdated:
    kind: event
    description: テナント内 admin が通知テンプレートの上書きを保存した。文面そのものは記録せず、対象の key と locale のみを記録する。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      actorUserId:
        type: String
      templateKey:
        type: String
      locale:
        type: String
  NotificationTemplateReset:
    kind: event
    description: テナント内 admin が通知テンプレートの上書きを削除し組込み既定へ戻した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      actorUserId:
        type: String
      templateKey:
        type: String
      locale:
        type: String
  EmailSent:
    kind: event
    description: "EmailSender port 経由でメールを送信した。Authentication context が定義する監査イベントの published language stub。テスト送信もこの経路で観測される。"
    payload:
      occurredAt:
        type: DateTime
      toHash:
        type: String
        description: 宛先 email の SHA-256 hex
      purpose:
        type: String
      delivered:
        type: Boolean
  TenantCreateRequest:
    kind: value_object
    description: "管理者が新規テナントを登録する JSON リクエスト。`realm` は URL-safe slug。UUID キー (id) はサーバが採番する。"
    fields:
      realm:
        type: String
        constraints:
          - non_empty
          - max_length: 63
          - pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      display_name:
        type: String
        constraints:
          - non_empty
          - max_length: 200
        annotations:
          pii: true
  TenantUpdateRequest:
    kind: value_object
    description: "管理者がテナントの表示名 / パスワードポリシー上書きを更新する JSON リクエスト。`id` と status は変更しない。status 変更は disable/enable 専用 endpoint を経由。"
    fields:
      display_name:
        type: String
        optional: true
        constraints:
          - non_empty
          - max_length: 200
        annotations:
          pii: true
      password_policy_override:
        type: PasswordPolicyOverride
        optional: true
        description: 省略時は既存値を維持。null を渡したい場合は明示する。
      default_locale:
        type: String
        optional: true
        description: テナント既定 locale。省略時は既存値を維持し、空文字列でシステム既定へ戻す。サポート外の locale は拒否する。
  TenantSummaryResponse:
    kind: value_object
    description: テナント表現。管理 UI の一覧と詳細で同じ表現を返す。
    fields:
      id:
        type: String
        description: テナントの不変 UUID キー。
      realm:
        type: String
        description: URL `/realms/{realm}/` に現れる slug 識別子。
      display_name:
        type: String
        annotations:
          pii: true
      status:
        type: TenantStatus
      password_policy_override:
        type: PasswordPolicyOverride
        optional: true
      default_locale:
        type: String
        optional: true
      quota:
        type: TenantQuota
      usage:
        type: TenantUsage
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
        optional: true
      disabled_at:
        type: DateTime
        optional: true
  TenantListResponse:
    kind: value_object
    description: 管理 API のテナント一覧。
    fields:
      tenants:
        type: "TenantSummaryResponse[]"
  TenantCreated:
    kind: event
    description: system_admin が新規テナントを作成した。
    payload:
      occurredAt:
        type: DateTime
      actorUserId:
        type: String
      tenantId:
        type: String
  TenantUpdated:
    kind: event
    description: system_admin がテナントの表示名を更新した。
    payload:
      occurredAt:
        type: DateTime
      actorUserId:
        type: String
      tenantId:
        type: String
      changedFields:
        type: "String[]"
  TenantQuotaUpdated:
    kind: event
    description: system_admin がテナントのリソースクォータを上書きした。
    payload:
      occurredAt:
        type: DateTime
      actorUserId:
        type: String
      tenantId:
        type: String
  TenantUserAttributeSchemaUpdated:
    kind: event
    description: テナント内 admin が custom 属性定義 (TenantUserAttributeSchema) を更新した。値は持たず、変更後の custom 属性 key 一覧のみを記録する。
    payload:
      occurredAt:
        type: DateTime
      actorUserId:
        type: String
      tenantId:
        type: String
      attributeKeys:
        type: "String[]"
  TenantDisabled:
    kind: event
    description: system_admin がテナントを無効化した。当該テナントのすべてのプロトコルルートは invalid_request で拒否される。
    payload:
      occurredAt:
        type: DateTime
      actorUserId:
        type: String
      tenantId:
        type: String
  TenantEnabled:
    kind: event
    description: system_admin が無効化済みテナントを再有効化した。
    payload:
      occurredAt:
        type: DateTime
      actorUserId:
        type: String
      tenantId:
        type: String
  InvalidRequestError:
    kind: error
    description: リクエストに必須パラメータの欠落・不正値・重複等がある (RFC 6749 §5.2 invalid_request)。OAuth2 context が定義する共通 error の published language stub。
    payload:
      reason:
        type: String
        optional: true
  AccessDeniedError:
    kind: error
    description: 認証済みだが認可条件を満たさない、またはサーバーポリシーが許可しなかった。OAuth2 context が定義する共通 error の published language stub。
  QuotaExceededError:
    kind: error
    description: テナントの Hard Quota を超過したため、リソース作成が拒否された。
    payload:
      resource_type:
        type: String
      limit:
        type: Integer
      usage:
        type: Integer
states:
  TenantLifecycle:
    description: テナント のライフサイクル。Active で通常稼働、Disable で全プロトコルルートを停止、Enable で復帰。物理削除は本フェーズ対象外。
    target: Tenant
    initial: Active
    terminal:
      []
    transitions:
      - from: Active
        event: TenantDisabled
        to: Disabled
      - from: Disabled
        event: TenantEnabled
        to: Active
interfaces:
  ResolveTenant:
    description: "HTTP リクエストの Host と path から所属テナントを解決する内部インターフェース。\n\n**不変条件: 1 テナント = 1 正規ロケーション = 1 issuer。** テナントは自分の\nendpoint_style が指す正規ロケーションからのみ到達でき、他方の経路では不在として扱う。\n同一テナントが 2 つの origin から到達できると issuer が多義になり、discovery 文書の\n`issuer` が取得元 URL と一致しなくなる (OpenID Connect Discovery 1.0 §4.3 /\nRFC 8414 §3.3 違反)。\n\n解決順序:\n1. tenant_base_domain が設定され Host が `{label}.{tenant_base_domain}` に一致するなら\n   label を realm として写像する。見つかったテナントの endpoint_style が Subdomain で\n   なければ不在として扱う。\n2. path が `/realms/{realm}/...` に一致するなら realm を写像する。見つかったテナントの\n   endpoint_style が Path でなければ不在として扱う。\n3. どちらにも一致しないリクエストは不在として扱う。任意の Host や prefix 無し path を\n   default テナントへ落とすことはしない (fail-closed)。テナント境界の破りを防ぐため、\n   既定は deny とする。\n\nissuer / URL prefix / cookie scope / WebAuthn RP ID は解決した正規ロケーションから\n組み立てる。Path なら issuer は `{base}/realms/{realm}`、Subdomain なら\n`{scheme}://{realm}.{tenant_base_domain}`。\n不在テナントは 404 tenant_not_found、disabled テナントは OAuth/OIDC の protocol route\nでは 400 invalid_request とし、いずれも存在や状態の詳細を漏らさない。\n"
    input:
      host:
        type: String
        description: HTTP リクエストの Host ヘッダ。port と trailing dot を除き lowercase に正規化して照合する。
      path:
        type: String
        description: HTTP リクエスト path
    output:
      tenant:
        type: Tenant
    errors:
      - InvalidRequestError
    access: internal
  ListTenants:
    description: "system_admin がテナント一覧を取得する。テナント横断操作のため system_admin\nロールでゲートし、システムコンソール (/system) から呼ぶ。default テナントに解決する\nbare path と control-plane path (/realms/default 配下、cookie session 整合) の両方から\n同じ handler に入る。"
    output:
      response:
        type: TenantListResponse
    errors:
      - AccessDeniedError
    read_only: true
    access:
      policies: [SystemAdministrator]
      resource:
        type: TenantDirectory
        id: '"tenant_directory"'
    bindings:
      - kind: http
        method: GET
        path: /api/admin/tenants
  GetTenant:
    description: system_admin が単一テナントを取得する。
    input:
      tenant_id:
        type: String
    output:
      tenant:
        type: TenantSummaryResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    read_only: true
    access:
      policies: [SystemAdministrator]
      resource:
        type: Tenant
        id: input.tenant_id
    bindings:
      - kind: http
        method: GET
        path: "/api/admin/tenants/{tenant_id}"
  CreateTenant:
    description: system_admin が新規テナントを作成する。
    input:
      request:
        type: TenantCreateRequest
    output:
      tenant:
        type: TenantSummaryResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantCreated
    access:
      policies: [SystemAdministrator]
      resource:
        type: TenantDirectory
        id: '"tenant_directory"'
    bindings:
      - kind: http
        method: POST
        path: /api/admin/tenants
        request_form: body
        successful_status_codes:
          - "201"
  UpdateTenant:
    description: system_admin がテナントの表示名を更新する。
    input:
      tenant_id:
        type: String
      request:
        type: TenantUpdateRequest
    output:
      tenant:
        type: TenantSummaryResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantUpdated
    access:
      policies: [SystemAdministrator]
      resource:
        type: Tenant
        id: input.tenant_id
    bindings:
      - kind: http
        method: PATCH
        path: "/api/admin/tenants/{tenant_id}"
        request_form: body
  DisableTenant:
    description: system_admin が default 以外のテナントを無効化する。/authorize / /token / /login 等は一律 invalid_request になる。
    input:
      tenant_id:
        type: String
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantDisabled
    access:
      policies: [SystemAdministrator]
      resource:
        type: Tenant
        id: input.tenant_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/tenants/{tenant_id}/disable"
        successful_status_codes:
          - "204"
  EnableTenant:
    description: system_admin が無効化済みテナントを再有効化する。
    input:
      tenant_id:
        type: String
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantEnabled
    access:
      policies: [SystemAdministrator]
      resource:
        type: Tenant
        id: input.tenant_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/tenants/{tenant_id}/enable"
        successful_status_codes:
          - "204"
  SetTenantEndpointStyle:
    description: "system_admin がテナントの正規ロケーションの形を切り替える。\n通常の属性更新 (UpdateTenant) から分離するのは、これがテナントの identity を\n作り替える破壊的操作だからである: issuer が変わるため既発行 token の `iss` 検証と\n全 RP の設定が壊れ、WebAuthn RP ID が変わるため既存 passkey がすべて無効になり、\ncookie scope が変わるため進行中のセッションが切れる。\nSubdomain は tenant_base_domain が設定された配備でのみ選択でき、未設定なら\nInvalidRequestError とする。realm は不変なので、切り替え後のホスト名は既存 realm から\n一意に決まる。\n"
    input:
      tenant_id:
        type: String
      endpoint_style:
        type: TenantEndpointStyle
    errors:
      - InvalidRequestError
      - AccessDeniedError
    access:
      policies: [SystemAdministrator]
      resource:
        type: Tenant
        id: input.tenant_id
    bindings:
      - kind: http
        method: PUT
        path: "/api/admin/tenants/{tenant_id}/endpoint_style"
        successful_status_codes:
          - "204"
  UpdateTenantQuota:
    description: system_admin が特定テナントの Quota を更新する。
    input:
      tenant_id:
        type: String
      request:
        type: TenantQuotaUpdateRequest
    output:
      tenant:
        type: TenantSummaryResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantQuotaUpdated
    access:
      policies: [SystemAdministrator]
      resource:
        type: Tenant
        id: input.tenant_id
    bindings:
      - kind: http
        method: PUT
        path: "/api/admin/tenants/{tenant_id}/quota"
        request_form: body
  GetAdminSettings:
    description: "テナント内 admin が自身のテナントの設定 (表示名 / 既定 locale / パスワードポリシー上書き) を取得する。\n対象テナントは context.tenant_id (解決済みテナント) に固定するため cross-tenant 読み出しは構造的に発生しない。\n`/api/admin/tenants` (system_admin 専用) とは別経路で、admin にも開放される。\nレスポンスには Authentication context の PasswordPolicy の現行値 (password_policy_defaults) と、\nカタログが同梱翻訳を持つ locale 一覧 (supported_locales) を含め、UI が「上書きしないときに\n実際に適用される値」と既定 locale の選択肢を具体的に示せるようにする。\n"
    output:
      settings:
        type: AdminSettingsResponse
    errors:
      - AccessDeniedError
    read_only: true
    access:
      policies: [TenantAdministrator]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: /api/admin/settings
  UpdateAdminSettings:
    description: "テナント内 admin が自身のテナントの設定を更新する。display_name、default_locale、\npassword_policy_override のいずれかを任意フィールドとして受け取り、\ncontext.tenant_id に固定した上で UpdateTenant のロジックを実行する。\npassword_policy_override が Authentication context の PasswordPolicy の標準値より弱い場合\n(min_length 下回り / max_length 上回り / history_depth 下回り) は use case\n側で拒否する。default_locale はカタログが同梱翻訳を持つ locale のみ受け付け、\n空文字列でシステム既定へ戻す。\n"
    input:
      request:
        type: TenantUpdateRequest
    output:
      settings:
        type: AdminSettingsResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantUpdated
    access:
      policies: [TenantAdministrator]
      resource:
        type: Tenant
        id: context.tenant_id
    bindings:
      - kind: http
        method: PATCH
        path: /api/admin/settings
        request_form: body
  GetTenantUserAttributeSchema:
    description: "テナント内 admin が自身のテナントの custom 属性定義を取得する。\n対象テナントは context.tenant_id に固定し cross-tenant 読み出しを構造的に排除する。\nレスポンスには tenant 固有の custom 定義に加えて組み込みカタログ (builtin) も\n含め、UI が全属性を一覧しつつ key 衝突を避けられるようにする。\n"
    output:
      schema:
        type: TenantUserAttributeSchemaResponse
    errors:
      - AccessDeniedError
    read_only: true
    access:
      policies: [TenantAdministrator]
      resource:
        type: TenantUserAttributeSchema
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: /api/admin/tenant/user_attribute_schema
  UpdateTenantUserAttributeSchema:
    description: "テナント内 admin が custom 属性定義を全置換する。context.tenant_id に\n固定した上で、各 UserAttributeDef を検証し、組み込み属性との key 衝突・重複 key を\n拒否する。DynamicGroupRule が参照中の key は削除または型変更できない。値そのものは保持せず定義のみを扱う。\n"
    input:
      request:
        type: TenantUserAttributeSchemaUpdateRequest
    output:
      schema:
        type: TenantUserAttributeSchemaResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantUserAttributeSchemaUpdated
    access:
      policies: [TenantAdministrator]
      resource:
        type: TenantUserAttributeSchema
        id: context.tenant_id
    bindings:
      - kind: http
        method: PUT
        path: /api/admin/tenant/user_attribute_schema
        request_form: body
  GetTenantBranding:
    description: "解決済みテナントの hosted UI ブランディングを取得する公開 interface。認証を要求しない\n(login / consent / device 画面が未認証のうちに読む)。branding 未設定・値不正・アセット欠損の\nいずれでもシステム既定にフォールバックし、常に成功する。対象テナントは realm 解決 (ResolveTenant)\nで既に確定しているため入力を取らない。\n"
    output:
      branding:
        type: TenantBrandingResponse
    ensures:
      - output.branding != null
    read_only: true
    access: public
    bindings:
      - kind: http
        method: GET
        path: /api/branding
  UpdateTenantBranding:
    description: "テナント内 admin が自身のテナントの branding (製品名 / 色 / 順序固定の footer リンク /\nフッターテキスト) を更新する。画像アセットは別 interface で扱う。色は `#rrggbb` 形式のみを\n検証し、コントラスト比を理由に拒否しない。各 footer link は label と https URL の組で、どちらか\n一方だけの指定は拒否する。\n"
    input:
      request:
        type: TenantBrandingUpdateRequest
    output:
      branding:
        type: TenantBrandingResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantBrandingUpdated
    access:
      policies: [TenantAdministrator]
      resource:
        type: TenantBranding
        id: context.tenant_id
    bindings:
      - kind: http
        method: PUT
        path: /api/admin/tenant/branding
        request_form: body
  UploadTenantBrandingAsset:
    description: 管理者が branding のロゴまたは favicon 画像を multipart でアップロードする。受理形式は PNG / JPEG / WebP / GIF、最大 256KiB とし、magic byte で検証する。
    input:
      kind:
        type: TenantBrandingAssetKind
      file:
        type: String
    output:
      response:
        type: TenantBrandingUploadResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantBrandingUpdated
    requires:
      - context.upload.content_type in ["image/png", "image/jpeg", "image/webp", "image/gif"]
      - context.upload.magic_byte_matches_content_type
      - size(input.file) <= 262144
    access:
      policies: [TenantAdministrator]
      resource:
        type: TenantBranding
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/tenant/branding/assets/{kind}"
        request_form: form
  DeleteTenantBrandingAsset:
    description: 管理者が branding の保存済みロゴまたは favicon を削除する。削除後は該当アセットの URL を返さない。
    input:
      kind:
        type: TenantBrandingAssetKind
    output:
      response:
        type: TenantBrandingUploadResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - TenantBrandingUpdated
    access:
      policies: [TenantAdministrator]
      resource:
        type: TenantBranding
        id: context.tenant_id
    bindings:
      - kind: http
        method: DELETE
        path: "/api/admin/tenant/branding/assets/{kind}"
  ListNotificationTemplates:
    description: "テナント内 admin が通知テンプレートの一覧を取得する。カタログの全 template_key × 全サポート locale を、上書きの有無 (customized) と現在有効な件名つきで返す。対象テナントは context.tenant_id に固定するため cross-tenant 読み出しは構造的に発生しない。\n"
    output:
      response:
        type: NotificationTemplateListResponse
    errors:
      - AccessDeniedError
    read_only: true
    access:
      policies: [TenantAdministrator]
      resource:
        type: NotificationTemplate
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: /api/admin/tenant/notification_templates
  GetNotificationTemplate:
    description: "テナント内 admin がテンプレート 1 件を編集用に取得する。現在有効な文面、組込み既定の文面、および使用できる差し込み変数の許可集合を同時に返す。カタログに無い template_key / locale は InvalidRequestError で拒否する。\n"
    input:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
    output:
      template:
        type: NotificationTemplateDetail
    errors:
      - InvalidRequestError
      - AccessDeniedError
    read_only: true
    access:
      policies: [TenantAdministrator]
      resource:
        type: NotificationTemplate
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: "/api/admin/tenant/notification_templates/{template_key}/{locale}"
  UpdateNotificationTemplate:
    description: "テナント内 admin がテンプレート上書きを保存する。件名 / テキスト本文 / HTML 本文を必須の組として全置換し、テキストだけ・HTML だけの上書きは作れない。本文と件名に含まれる差し込み変数が template_key の許可集合に収まらない場合は、実行時に空文字列へ潰れる前に保存時点で拒否する (fail-closed)。差出人メールアドレスはサーバ設定であり上書きできず、表示名だけを上書きできる。\n"
    input:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
      request:
        type: NotificationTemplateUpdateRequest
    output:
      template:
        type: NotificationTemplateDetail
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - NotificationTemplateUpdated
    requires:
      - placeholdersWithin(input.request.subject, allowedPlaceholders(input.template_key))
      - placeholdersWithin(input.request.body_text, allowedPlaceholders(input.template_key))
      - placeholdersWithin(input.request.body_html, allowedPlaceholders(input.template_key))
    ensures:
      - output.template.customized
    access:
      policies: [TenantAdministrator]
      resource:
        type: NotificationTemplate
        id: context.tenant_id
    bindings:
      - kind: http
        method: PUT
        path: "/api/admin/tenant/notification_templates/{template_key}/{locale}"
        request_form: body
  ResetNotificationTemplate:
    description: "テナント内 admin がテンプレート上書きを削除し組込み既定へ戻す。上書きが無いテンプレートに対しても成功する冪等操作。版管理は持たないため、戻り先は直前の上書きではなく常に組込み既定である。\n"
    input:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
    output:
      template:
        type: NotificationTemplateDetail
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - NotificationTemplateReset
    ensures:
      - "!output.template.customized"
    access:
      policies: [TenantAdministrator]
      resource:
        type: NotificationTemplate
        id: context.tenant_id
    bindings:
      - kind: http
        method: DELETE
        path: "/api/admin/tenant/notification_templates/{template_key}/{locale}"
  PreviewNotificationTemplate:
    description: "テナント内 admin が保存前の文面をサンプル値で描画する。省略したフィールドは現在有効な文面を使う。HTML 側の差し込み値は必ずエスケープして展開し、リンク URL はサンプルの発行元 URL から組み立てる。メールは送信せず、上書きも保存しない。\n"
    input:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
      request:
        type: NotificationTemplatePreviewRequest
    output:
      preview:
        type: NotificationTemplatePreviewResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    read_only: true
    access:
      policies: [TenantAdministrator]
      resource:
        type: NotificationTemplate
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/tenant/notification_templates/{template_key}/{locale}/preview"
        request_form: body
  SendTestNotification:
    description: "テナント内 admin が現在有効な文面のテストメールを受け取る。宛先は操作した管理者本人の検証済みメールアドレスに固定し、リクエストでは指定できない。任意宛先を許すと管理者権限がメール送信の踏み台になるため、この固定は仕様である。操作者に検証済みアドレスが無い場合は InvalidRequestError で拒否する。\n"
    input:
      template_key:
        type: NotificationTemplateKey
      locale:
        type: String
    output:
      result:
        type: NotificationTemplateTestSendResponse
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - EmailSent
    ensures:
      - output.result.to == context.actor.email
    access:
      policies: [TenantAdministrator]
      resource:
        type: NotificationTemplate
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/tenant/notification_templates/{template_key}/{locale}/test"
        successful_status_codes:
          - "200"
  GetTenantBrandingAsset:
    description: "保存済み branding アセット (ロゴ / favicon) を配信する公開 interface。アップロード後に返す URL は、\n解決済み realm prefix を含むこの interface へ同一 origin で到達可能であり、管理画面プレビューと\nhosted UI はその URL を画像として取得・描画できる。Content-Type は検証済み形式に固定し、\nX-Content-Type-Options: nosniff を付ける。別テナントまたは削除済み object は未存在として扱う。\n"
    input:
      kind:
        type: TenantBrandingAssetKind
      object_key:
        type: String
    output:
      file:
        type: String
    errors:
      - InvalidRequestError
    ensures:
      - response.headers["Content-Type"] in ["image/png", "image/jpeg", "image/webp", "image/gif"]
      - response.headers["X-Content-Type-Options"] == "nosniff"
    read_only: true
    access: public
    bindings:
      - kind: http
        method: GET
        path: "/tenant-branding-assets/{kind}/{object_key}"
authorization:
  resources:
    TenantDirectory:
      description: 全テナントを横断する一覧・作成対象を表す singleton resource。
  principals:
    SystemAdministrator:
      type: User
      matches:
        - context.authenticated
        - principal.status == "Active"
        - '"system_admin" in principal.roles'
        - principal.tenant_id == "default"
    TenantAdministrator:
      type: User
      matches:
        - context.authenticated
        - principal.status == "Active"
        - '"admin" in principal.roles || "system_admin" in principal.roles'
  policies:
    SystemAdministrator:
      effect: permit
      principal: SystemAdministrator
    TenantAdministrator:
      effect: permit
      principal: TenantAdministrator
      when: principal.tenant_id == resource.id
scenarios:
  管理者はテナント固有のユーザー属性スキーマを定義できる:
    actor: TenantAdministrator
    given:
      - "admin ロールを持つ \"operator\" が認証済みである"
    main_success:
      - "\"operator\" が editable_by_user=true の custom_attribute を追加する"
      - 更新後のスキーマに追加した属性が含まれる
  default テナントは起動時に自動作成され削除も無効化もできない:
    actor: System
    main_success:
      - IdP を起動する
      - "テナント \"default\" が status=Active で存在する"
    extensions:
      - at: 2
        condition: default テナントの削除を試みる
        steps:
          - default テナントを削除する API は提供されない
      - at: 2
        condition: default テナントの無効化を試みる
        steps:
          - default テナントの disable は InvalidRequestError で拒否される
  管理者はテナントのロゴと配色をカスタマイズでき利用者のログイン画面に反映される:
    actor: TenantAdministrator
    given:
      - "admin ロールを持つ \"operator\" が認証済みである"
    main_success:
      - "\"operator\" が PNG ロゴをアップロードする"
      - アップロード応答の logo_url を GET すると、同じ realm の検証済み PNG が返る
      - 管理画面のロゴプレビューにアップロードした PNG が表示される
      - "\"operator\" が primary_color / accent_color / footer_link_1={label: \"ヘルプ\", url: \"https://help.example.test\"} / footer_text を設定する"
      - 管理画面は各設定済み色に現在値と「既定に戻す」操作を表示する
      - 管理者がプライマリカラーを既定に戻して保存すると、UpdateTenantBranding には primary_color の空文字列が送られる
      - 未認証の利用者が login 画面を開く
      - login / consent / account portal に設定したロゴが表示され、login 画面にはプライマリカラーのシステム既定・設定済みアクセントカラー・指定ラベルの footer リンク・フッターテキストも表示される
    extensions:
      - at: 2
        condition: 別テナントの object_key で同じ kind のアセット取得を試みる
        steps:
          - アセットは存在しないものとして扱われ InvalidRequestError で拒否される
      - at: 8
        condition: realm 配下の logo_url が gateway で backend に転送されない
        steps:
          - 画像取得は成功せず、管理者は設定の成功応答だけでは表示可能と判断しない
  不正な branding 入力は拒否されシステム既定にフォールバックする:
    actor: TenantAdministrator
    given:
      - "admin ロールを持つ \"operator\" が認証済みである"
    main_success:
      - "\"operator\" が branding を一度も設定していないテナントで login 画面を開く"
      - login 画面はシステム既定 (IdMagic) のブランディングを表示する
    extensions:
      - at: 1
        condition: "\"operator\" が footer_link_1.url に javascript: スキームを指定して保存を試みる"
        steps:
          - InvalidRequestError で拒否され保存されない
      - at: 1
        condition: "\"operator\" が footer_link_1 に label だけを指定して保存を試みる"
        steps:
          - InvalidRequestError で拒否され保存されない
      - at: 1
        condition: "\"operator\" が低コントラストの `#eeeeee` を primary_color に指定して保存を試みる"
        steps:
          - 保存に成功し、取得した branding と login 画面に `#eeeeee` が反映される
      - at: 1
        condition: 管理者が SVG ファイルをロゴとしてアップロードしようとする
        steps:
          - InvalidRequestError で拒否され保存されない
  path style のテナントは realm prefix から解決される:
    actor: OAuth2Client
    given:
      - "テナント \"default\" の endpoint_style は Path である"
    main_success:
      - "\"/realms/default/authorize\" にリクエストを送る"
      - "解決されたテナントは \"default\""
      - iss claim は base URL + /realms/default
    extensions:
      - at: 1
        condition: 対象テナントが無効化されている
        steps:
          - " tenant_id \"acme\" を作成して無効化する"
          - " 無効化済みテナントの \"/realms/acme/authorize\" にリクエストを送る"
          - " テナントの存在を漏らさずエラー \"InvalidRequestError\""
      - at: 1
        condition: realm prefix を持たない "/authorize" にリクエストを送る
        steps:
          - テナントは解決されず 404 tenant_not_found になる
          - 任意のリクエストが default テナントへ落ちることはない
  subdomain style のテナントは Host から解決される:
    actor: EndUser
    given:
      - tenant_base_domain が設定されている
      - "テナント \"acme\" の endpoint_style は Subdomain である"
    main_success:
      - "Host \"acme.{tenant_base_domain}\" の \"/authorize\" にリクエストを送る"
      - "解決されたテナントは \"acme\" で、その branding のログイン画面が表示される"
      - "session cookie は __Host- prefix と Path=/ を持ち Domain 属性を持たない"
      - "WebAuthn RP ID は \"acme.{tenant_base_domain}\" である"
  未知のサブドメインは default テナントに解決されない:
    actor: OAuth2Client
    given:
      - tenant_base_domain が設定されている
      - "realm \"unknown\" のテナントは存在しない"
    main_success:
      - "Host \"unknown.{tenant_base_domain}\" の \"/authorize\" にリクエストを送る"
      - 404 tenant_not_found になり、default テナントにも他のどのテナントにも到達しない
  テナントは自分の正規ロケーション以外からは到達できない:
    actor: OAuth2Client
    given:
      - tenant_base_domain が設定されている
      - "テナント \"acme\" の endpoint_style は Subdomain である"
      - "テナント \"beta\" の endpoint_style は Path である"
    main_success:
      - "\"/realms/acme/authorize\" にリクエストを送る"
      - "acme は Subdomain なので path prefix 経路では不在として扱われ 404 になる"
    extensions:
      - at: 1
        condition: "Host \"beta.{tenant_base_domain}\" の \"/authorize\" にリクエストを送る"
        steps:
          - beta は Path なのでサブドメイン経路では不在として扱われ 404 になる
      - at: 1
        condition: "Host \"acme.{tenant_base_domain}\" の \"/realms/beta/authorize\" にリクエストを送る"
        steps:
          - acme の origin から beta へ到達することはできず 404 になる
  discovery の issuer は取得元 URL と一致する:
    actor: OAuth2Client
    given:
      - tenant_base_domain が設定されている
      - "テナント \"default\" の endpoint_style は Path、テナント \"acme\" の endpoint_style は Subdomain である"
    main_success:
      - "\"{base}/realms/default/.well-known/openid-configuration\" を取得する"
      - "issuer は \"{base}/realms/default\" であり、取得元 URL の prefix と一致する"
      - "\"https://acme.{tenant_base_domain}/.well-known/openid-configuration\" を取得する"
      - "issuer は \"https://acme.{tenant_base_domain}\" であり、取得元 URL の prefix と一致する"
      - どちらの応答も endpoint URL を自分の正規ロケーション配下だけで組み立てる
  System管理者はテナントの正規ロケーションを切り替えられる:
    actor: SystemAdministrator
    given:
      - "system_admin ロールを持つ \"sysadmin\" が認証済みである"
      - tenant_base_domain が設定されている
      - "テナント \"acme\" の endpoint_style は Path である"
    main_success:
      - "\"sysadmin\" が SetTenantEndpointStyle で acme を Subdomain に切り替える"
      - "acme は \"acme.{tenant_base_domain}\" からのみ到達できるようになる"
      - "\"{base}/realms/acme/...\" は 404 になる"
      - issuer と WebAuthn RP ID が新しい正規ロケーション由来の値に変わる
    extensions:
      - at: 1
        condition: tenant_base_domain が設定されていない配備で Subdomain を指定する
        steps:
          - InvalidRequestError で拒否され endpoint_style は変わらない
  System管理者はテナントのクォータ上限を調整できる:
    actor: SystemAdministrator
    given:
      - "system_admin ロールを持つ \"sysadmin\" が認証済みである"
    main_success:
      - "\"sysadmin\" が UpdateTenantQuota を呼び出し users 上限を 20000 に増やす"
      - 対象テナントの quota.users が 20000 になる
  Hard Quota を超過したリソース作成は拒否される:
    actor: TenantAdministrator
    given:
      - "対象テナントの groups 上限が 1000、利用量が 1000 である"
    main_success:
      - "テナント内管理者が新しい Group を作成しようとする"
      - "QuotaExceededError で拒否され作成されない"
  通常のテナント管理者はシステムコンソールのテナント一覧にアクセスできない:
    actor: TenantAdministrator
    given:
      - "\"operator\" は admin ロールのみを持ち system_admin ロールを持たない"
    main_success:
      - "\"operator\" が ListTenants を呼び出す"
      - AccessDeniedError で拒否される
  日本語ロケールのユーザーには日本語のパスワードリセットメールが届く:
    actor: EndUser
    given:
      - "利用者 \"hanako\" は locale 属性が \"ja\"、検証済みメールアドレスを持つ"
      - テナントは通知テンプレートを一度も上書きしていない
    main_success:
      - "\"hanako\" が RequestPasswordReset を実行する"
      - "件名と本文が組込み既定の ja テンプレートで描画されたメールが届く"
      - メールはプレーンテキストと HTML の両方を含む
      - 本文のリセットリンクはリクエストの発行元 URL から組み立てられており、開くとパスワード再設定画面に到達する
    extensions:
      - at: 1
        condition: "\"hanako\" の locale 属性が未設定で、テナントの default_locale が \"ja\" である"
        steps:
          - "テナント既定の \"ja\" が採用され、日本語のメールが届く"
      - at: 1
        condition: "\"hanako\" の locale 属性が未設定で、テナントの default_locale も未設定である"
        steps:
          - システム既定 locale が採用され、その locale のメールが届く
      - at: 1
        condition: "\"hanako\" の locale 属性がカタログに同梱翻訳の無い locale である"
        steps:
          - 未対応 locale は飛ばして次の段が採用され、空の本文は送られない
  テナントの通知テンプレート上書きは組込み既定より優先される:
    actor: TenantAdministrator
    given:
      - "admin ロールを持つ \"operator\" が認証済みである"
    main_success:
      - "\"operator\" が ListNotificationTemplates を呼び出す"
      - "全 template_key × 全サポート locale が customized=false で一覧される"
      - "\"operator\" が PasswordReset / ja の件名と本文を上書きして UpdateNotificationTemplate を実行する"
      - NotificationTemplateUpdated が発行され、当該テンプレートは customized=true になる
      - "以後 ja の利用者に届くパスワードリセットメールは上書きした件名と本文で送られる"
      - "\"operator\" が ResetNotificationTemplate を実行する"
      - NotificationTemplateReset が発行され、当該テンプレートは組込み既定に戻る
    extensions:
      - at: 5
        condition: 上書きしていない en の利用者にメールが送られる
        steps:
          - en は組込み既定のまま描画され、ja の上書きは影響しない
      - at: 7
        condition: 上書きが存在しないテンプレートに ResetNotificationTemplate を実行する
        steps:
          - 冪等に成功し、組込み既定のままとなる
  許可されていない差し込み変数を含むテンプレート上書きは保存時に拒否される:
    actor: TenantAdministrator
    given:
      - "admin ロールを持つ \"operator\" が認証済みである"
    main_success:
      - "\"operator\" が PasswordReset の本文に許可集合外の変数 `{{password}}` を書いて保存を試みる"
      - InvalidRequestError で拒否され、上書きは保存されない
      - 以後も利用者には組込み既定のリセットメールが届き、リンクが欠けたメールは配られない
    extensions:
      - at: 1
        condition: "\"operator\" が HTML 本文を空にしてテキスト本文だけを保存しようとする"
        steps:
          - InvalidRequestError で拒否され、片方だけの上書きは作られない
      - at: 1
        condition: "\"operator\" がカタログに無い locale を指定して保存を試みる"
        steps:
          - InvalidRequestError で拒否される
      - at: 1
        condition: "\"operator\" が差出人メールアドレスの上書きを試みる"
        steps:
          - アドレスを上書きする入力は受け付けず、上書きできるのは表示名だけである
  プレビューは実送信せずテスト送信は操作者本人にしか届かない:
    actor: TenantAdministrator
    given:
      - "admin ロールを持つ \"operator\" が検証済みメールアドレスを持ち認証済みである"
    main_success:
      - "\"operator\" が保存前の文面で PreviewNotificationTemplate を呼び出す"
      - サンプル値を展開した件名・テキスト本文・HTML 本文が返る
      - メールは送信されず、上書きも保存されない
      - "\"operator\" が SendTestNotification を呼び出す"
      - "宛先は \"operator\" 自身のアドレスに固定され、EmailSent が発行される"
    extensions:
      - at: 2
        condition: 文面に利用者名などの差し込み値が含まれる
        steps:
          - HTML 側の差し込み値はエスケープされて描画され、タグとして解釈されない
      - at: 4
        condition: リクエストで別の宛先を指定しようとする
        steps:
          - 宛先の指定手段は提供されず、常に操作者本人へ送られる
      - at: 4
        condition: 操作者が検証済みメールアドレスを持たない
        steps:
          - InvalidRequestError で拒否され、メールは送信されない
  管理者はパスワードポリシー設定を参照・更新できる:
    actor: TenantAdministrator
    given:
      - "roles=[\"admin\"] のユーザー \"operator\" が管理画面の設定を開いている"
    main_success:
      - "管理者 \"operator\" がパスワードの最小長を更新する"
      - 更新後の設定に新しい最小長が反映される
flows:
  SystemTenantManagement:
    entry: SystemTenants
    views:
      SystemTenants:
        sees: システムテナント一覧画面(realm、表示名、ステータス、作成日時)
        does:
          - action: create
            does: 作成モーダルを開き、realm と表示名を入力して作成する
            interface: CreateTenant
            to: SystemTenants
          - action: update
            does: 編集モーダルを開き、表示名またはパスワードポリシー上書きを変更して更新する
            interface: UpdateTenant
            to: SystemTenants
          - action: disable
            does: 無効化ボタンをクリックする
            interface: DisableTenant
            to: SystemTenants
          - action: enable
            does: 有効化ボタンをクリックする
            interface: EnableTenant
            to: SystemTenants
          - action: update_quota
            does: クォータ変更モーダルを開き、上限値を更新する
            interface: UpdateTenantQuota
            to: SystemTenants
  TenantAttributeManagement:
    entry: TenantAttributes
    views:
      TenantAttributes:
        sees: テナント属性設定画面(カスタム属性定義一覧の編集フォーム、組み込み属性カタログの参照表示)
        does:
          - action: update
            does: カスタム属性定義をすべて編集して保存する
            interface: UpdateTenantUserAttributeSchema
            to: TenantAttributes
  TenantSettingsManagement:
    entry: TenantSettings
    views:
      TenantSettings:
        sees: テナント設定画面(表示名・既定 locale・パスワードポリシー上書きフォーム、ブランディング(製品名・色・フッターリンク・フッターテキスト)フォーム、利用量とクォータ上限の表示、通知メールタブへの入口)
        does:
          - action: update_settings
            does: 表示名、既定 locale、またはパスワードポリシー上書きを変更して保存する
            interface: UpdateAdminSettings
            to: TenantSettings
          - action: update_branding
            does: 製品名・色・フッターリンク・フッターテキストを変更して保存する
            interface: UpdateTenantBranding
            to: TenantSettings
          - action: open_notification_templates
            does: 通知メールタブを開く
            interface: ListNotificationTemplates
            to: NotificationTemplates
      NotificationTemplates:
        sees: 通知メールテンプレート一覧(template_key × locale の行、上書き済みかどうか、現在有効な件名、テスト送信の宛先が操作者本人に固定される旨の注記)
        does:
          - action: edit
            does: 一覧から 1 件を選び、件名・テキスト本文・HTML 本文・差出人表示名の編集フォームと使用できる差し込み変数の一覧を開く
            interface: GetNotificationTemplate
            to: NotificationTemplateEditor
          - action: back
            does: テナント設定画面に戻る
            to: TenantSettings
      NotificationTemplateEditor:
        sees: 通知メールテンプレート編集画面(件名・テキスト本文・HTML 本文・差出人表示名のフォーム、使用できる差し込み変数の一覧、組込み既定との比較、プレビュー結果、テスト送信ボタンと固定宛先の説明)
        does:
          - action: preview
            does: 編集中の文面をサンプル値で描画して確認する
            interface: PreviewNotificationTemplate
            to: NotificationTemplateEditor
          - action: save
            does: 件名・テキスト本文・HTML 本文・差出人表示名を保存する
            interface: UpdateNotificationTemplate
            to: NotificationTemplateEditor
          - action: reset
            does: 上書きを削除して組込み既定に戻す
            interface: ResetNotificationTemplate
            to: NotificationTemplateEditor
          - action: send_test
            does: 現在有効な文面のテストメールを自分宛に送信する
            interface: SendTestNotification
            to: NotificationTemplateEditor
          - action: back
            does: 一覧に戻る
            to: NotificationTemplates
objectives:
  QuotaEnforcement:
    description: リソース作成時の Quota チェックは DB アクセスを伴うが、作成 API の全体 latency 予算内に収まること。
    indicator: measurement.latency < duration("500ms")
    target: 0.99
    window: 30d
    budgeting: occurrences
  QuotaFailClosed:
    description: "Quota サービスや DB が一時的に利用不能な場合、Hard Quota 対象リソースの新規作成は fail-closed となり、一時的な作成不可を選択すること (上限を超えて作らせない)。"
    indicator: measurement.error_rate < 0.001
    target: 0.999
    window: 30d
    budgeting: occurrences
  UsageCounterConsistency:
    description: "並行するリソース作成・削除・Retain 処理において、Usage カウンタと実際のレコード数との乖離を防ぐ。万一乖離が発生しても、バックグラウンドの Reconciliation ジョブによって eventual consistency が保たれること。"
    indicator: measurement.error_rate < 0.001
    target: 0.999
    window: 30d
    budgeting: occurrences
  QuotaAudit:
    description: Hard Quota 超過時の作成拒否、および Soft Quota 超過時の警告は必ず Audit イベントとして発火されること。
    indicator: measurement.error_rate < 0.001
    target: 0.999
    window: 30d
    budgeting: occurrences
