system: idmagic
spec_version: "3.0"
context: SharedSignals

standards:
  RFC8417:
    title: Security Event Token (SET)
    version: RFC 8417
    url: https://www.rfc-editor.org/rfc/rfc8417.html
    roles: [Transmitter, Receiver]
    scope: CAEP/SSF イベントを表現する署名済み JWT の構造と検証。
    requirements:
      - id: RFC8417-SET-SIGNED
        section: §2
        strength: MUST
        adoption: required
        statement: SET は jti/iat/iss/aud/events を含む署名済み JWT として発行する。
      - id: RFC8417-SET-VERIFY
        section: §3
        strength: MUST
        adoption: required
        statement: 受信側は署名検証を通過した SET のみ反映し、検証失敗・鍵不明・改竄検知は反映せず拒否・監査する (fail-closed)。

glossary:
  SSF:
    definition: OpenID Shared Signals Framework。Security Event Token (SET) を transport にセキュリティイベントを push/受信する標準。idmagic は transmitter と receiver の双方として振る舞う ([[ADR-057]])。
  CAEP:
    definition: OpenID Continuous Access Evaluation Profile。SSF 上で session-revoked / token-claims-change / credential-change / assurance-level-change を表現するイベント種別の規約。
  RevocationEpoch:
    definition: Agent ごとに保持する単調増加のタイムスタンプ。これより前に発行された access token / session は無効とみなす (fail-closed)。KillAgent・DisableAgent・UnbindAgentCredential・所有者 (owner_user_id) の Disable/Delete・受理した inbound SecurityEvent のいずれでも前進する。所有者オフボードは配下の全 Agent の epoch を一括で前進させる。
  LocalRevocation:
    definition: idmagic 自身の Introspect / 保護 API が revocation epoch と access token の issued_at を比較して行う、当該 IdP 内で完結する失効判定。CAEP/SSF イベント配送より常に先行して確定させる ([[ADR-057]] 決定 5)。
  EcosystemPropagation:
    definition: LocalRevocation で確定した失効を、SSF stream 経由で外部 receiver (別 IdP・resource server・ガバナンス基盤) へ CAEP イベントとして伝える層。receiver 障害・遅延は LocalRevocation を遅らせない ([[ADR-057]] 決定 5)。
  FailClosed:
    definition: SET の署名検証失敗・鍵不明・改竄検知・issuer 未登録・重複 (replay) 検知・revocation epoch 判定不能のいずれかに該当する場合、常に「反映しない/無効とみなす」側へ倒す方針 ([[ADR-057]])。
  System:
    definition: SharedSignals の revocation 反映・SET 送受信 usecase そのものを指す、人間の操作者を伴わない技術的な主体。KillAgent 等のドメインイベントを起点に revocation epoch を前進させ、CAEP イベントを生成する。

models:
  # --- published language stubs ---
  Agent:
    kind: entity
    description: IdManagement が publish する Agent principal の最小 stub。
    identity: id
    fields:
      id:
        type: String
      tenant_id:
        type: String
      owner_user_id:
        type: String
      status:
        type: String
  User:
    kind: entity
    description: IdManagement が publish する User principal の最小 stub。
    identity: id
    fields:
      id:
        type: String
      tenant_id:
        type: String

  # --- errors ---
  InvalidRequestError:
    kind: error
    description: リクエストに必須パラメータの欠落・不正値がある、または対象が別テナントに属し未存在として扱われる。OAuth2 context が定義する共通 error の published language stub。
    payload:
      reason:
        type: String
  AccessDeniedError:
    kind: error
    description: principal が対象操作の policy を満たさない。Authentication context が定義する共通 error の published language stub。
  SecurityEventRejectedError:
    kind: error
    description: 受信した SET の検証が fail-closed で失敗した (未登録 issuer・署名不正・期限切れ・audience 不一致・jti 重複・subject 未解決)。
    payload:
      reason:
        type: String
  QuotaExceededError:
    kind: error
    description: テナントのリソース作成上限 (Quota) に達している。Tenancy context が定義する共通 error の published language stub。

  # --- enums ---
  SsfStreamDirection:
    kind: enum
    description: idmagic からみた stream の向き。Transmit は idmagic が外部 receiver へ CAEP イベントを push する、Receive は idmagic が外部 transmitter からのイベントを受理する。
    values:
      - Transmit
      - Receive
  SsfStreamStatus:
    kind: enum
    description: stream の稼働状態。
    values:
      - enabled
      - disabled
  CaepEventType:
    kind: enum
    description: 実装する CAEP イベント種別 ([[ADR-057]] 決定 2)。
    values:
      - session-revoked
      - token-claims-change
      - credential-change
      - assurance-level-change
  RevocationReason:
    kind: enum
    description: revocation epoch を前進させた起点。
    values:
      - AgentKilled
      - AgentDisabled
      - AgentCredentialUnbound
      - OwnerDisabled
      - OwnerDeleted
      - ManualAdmin
      - InboundSecurityEvent
  SecurityEventDeliveryStatus:
    kind: enum
    description: outbound SET 配送の状態。
    values:
      - pending
      - delivered
      - failed
      - dead_letter
  SecurityEventVerificationResult:
    kind: enum
    description: inbound SET の検証結果。
    values:
      - accepted
      - rejected_signature
      - rejected_unknown_issuer
      - rejected_replay
      - rejected_audience
      - rejected_subject_unresolved

  # --- value objects ---
  SsfSubject:
    kind: value_object
    description: CAEP イベントが指す対象。idmagic 自身が発行する access token の subject 表現 (tenant_id + principal_id) とそのまま対応させ、WorkloadIdentity のような別テーブルでの subject mapping を新設しない。
    fields:
      subject_type:
        type: String
        description: "\"Agent\" または \"User\"。"
      tenant_id:
        type: String
      principal_id:
        type: String

  CaepEvent:
    kind: value_object
    description: SET へ署名して包む前の、CAEP イベントの意味内容。
    fields:
      event_type:
        type: CaepEventType
      subject:
        type: SsfSubject
      reason:
        type: RevocationReason
        optional: true
      event_timestamp:
        type: DateTime
      initiating_entity:
        type: String
        description: "\"policy\" | \"admin\" | \"user\" のいずれか。"

  SecurityEventToken:
    kind: value_object
    description: RFC 8417 の Security Event Token。署名済み compact JWT と、そのデコード済み標準クレーム。
    fields:
      jti:
        type: String
      iss:
        type: URI
      aud:
        type: String
      iat:
        type: DateTime
      event:
        type: CaepEvent
      compact:
        type: String
        description: 署名済み JWT の compact serialization。

  SsfTransmitterStreamRegisterRequest:
    kind: value_object
    description: 管理者が direction=Transmit の SsfStream を登録する JSON リクエスト。
    fields:
      event_types:
        type: "CaepEventType[]"
        constraints:
          - non_empty
      delivery_endpoint:
        type: URI
      audience:
        type: String
      delivery_authorization:
        type: String
        optional: true
        annotations:
          sensitive: true
      max_delivery_attempts:
        type: Integer
        optional: true

  SsfReceiverStreamRegisterRequest:
    kind: value_object
    description: 管理者が direction=Receive の SsfStream を登録する JSON リクエスト。
    fields:
      event_types:
        type: "CaepEventType[]"
        constraints:
          - non_empty
      trusted_issuer:
        type: URI
      jwks_uri:
        type: URI
        optional: true
      jwks:
        type: JSON
        optional: true
      accepted_audiences:
        type: "String[]"
        constraints:
          - non_empty

  SsfStreamUpdateRequest:
    kind: value_object
    description: 管理者が SsfStream の event_types を更新する JSON リクエスト。省略フィールドは現状維持。
    fields:
      event_types:
        type: "CaepEventType[]"
        optional: true
        constraints:
          - non_empty

  RevocationEpochResponse:
    kind: value_object
    fields:
      epoch:
        type: DateTime
        optional: true
        description: 前進済みの epoch。未失効の Agent には存在しない。

  # --- entities ---
  AgentRevocationEpoch:
    kind: entity
    constraints:
      - epoch_advances_monotonically(agent_id)
    description: Agent ごとの revocation epoch を保持する 1 対 1 の付随レコード。epoch 以前に issued_at を持つ access token / session は無効とみなす (fail-closed)。KillAgent・DisableAgent・UnbindAgentCredential・所有者 (owner_user_id) の Disable/Delete・受理済み inbound SecurityEvent のいずれかで前進する。行が存在しない Agent は未失効を意味する。
    identity: agent_id
    fields:
      agent_id:
        type: String
      tenant_id:
        type: String
      epoch:
        type: DateTime
      reason:
        type: RevocationReason
      advanced_at:
        type: DateTime
      source_event_id:
        type: String
        optional: true
        description: epoch を前進させた domain event / inbound SET の jti など追跡用の参照。

  SsfStream:
    kind: entity
    constraints:
      - stream_references_are_tenant_local(tenant_id)
    description: tenant が登録する SSF stream の共通メタデータ。direction ごとに SsfTransmitterConfig または SsfReceiverConfig が 1 対 1 で付随する。
    identity: id
    fields:
      id:
        type: UUID
      tenant_id:
        type: String
      direction:
        type: SsfStreamDirection
      event_types:
        type: "CaepEventType[]"
        description: この stream が送受信対象とするイベント種別の部分集合。
      status:
        type: SsfStreamStatus
        default: enabled
      created_at:
        type: DateTime
      updated_at:
        type: DateTime
        optional: true

  SsfTransmitterConfig:
    kind: entity
    description: direction=Transmit の SsfStream に 1 対 1 で付随する配送先設定。
    identity: stream_id
    fields:
      stream_id:
        type: UUID
      delivery_endpoint:
        type: URI
        description: 外部 receiver の push 受理 endpoint。https 必須。
      audience:
        type: String
        description: 発行する SET の aud claim。
      delivery_authorization:
        type: String
        optional: true
        annotations:
          sensitive: true
        description: receiver への push 時に Authorization header で提示する任意の bearer secret。
      max_delivery_attempts:
        type: Integer
        default: 8

  SsfReceiverConfig:
    kind: entity
    description: direction=Receive の SsfStream に 1 対 1 で付随する、外部 transmitter の信頼設定。WorkloadTrustBundle ([[ADR-053]]) と同型の登録済み issuer 検証を再利用する。jwks_uri と jwks (inline) は少なくとも一方が必須。
    identity: stream_id
    constraints:
      - "jwks_uri != null || jwks != null"
      - "accepted_audiences.length > 0"
    fields:
      stream_id:
        type: UUID
      trusted_issuer:
        type: URI
        description: 外部 transmitter の SET iss claim と一致しなければならない発行者 URL。
      jwks_uri:
        type: URI
        optional: true
      jwks:
        type: JSON
        optional: true
        annotations:
          sensitive: true
      accepted_audiences:
        type: "String[]"

  SecurityEventDelivery:
    kind: entity
    description: outbound SET の配送状態。RevocationEpochAdvanced から projector が生成し、at-least-once で配送・再試行する。
    identity: id
    fields:
      id:
        type: UUID
      tenant_id:
        type: String
      stream_id:
        type: UUID
      set_jti:
        type: String
      set:
        type: SecurityEventToken
      status:
        type: SecurityEventDeliveryStatus
        default: pending
      attempt_count:
        type: Integer
        default: 0
      next_attempt_at:
        type: DateTime
        optional: true
      last_error:
        type: String
        optional: true
      created_at:
        type: DateTime
      delivered_at:
        type: DateTime
        optional: true

  ReceivedSecurityEvent:
    kind: entity
    constraints:
      - jti_unique_per_stream(stream_id, set_jti)
    description: inbound SET の受理記録。set_jti は stream 内で一意とし、重複 (replay) を検知して拒否する。
    identity: id
    fields:
      id:
        type: UUID
      tenant_id:
        type: String
      stream_id:
        type: UUID
      set_jti:
        type: String
      event_type:
        type: CaepEventType
      subject:
        type: SsfSubject
      verification_result:
        type: SecurityEventVerificationResult
      received_at:
        type: DateTime
      reflected_at:
        type: DateTime
        optional: true
        description: 検証を通過し、ローカル revocation epoch へ反映した時刻。

  # --- events ---
  RevocationEpochAdvanced:
    kind: event
    description: Agent の revocation epoch が前進した (LocalRevocation の確定)。transmitter projector がこのイベントを起点に CaepEvent/SecurityEventDelivery を生成する。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      agentId:
        type: String
      reason:
        type: RevocationReason
      epoch:
        type: DateTime
  AgentAccessRevoked:
    kind: event
    description: kill-switch / 所有者オフボードを起点に Agent のアクセスが即時失効したことを表す、監査・ガバナンス向けの要約イベント ([[wi-59-agent-governance-guardrails-audit-inventory]] が読む)。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      agentId:
        type: String
      reason:
        type: RevocationReason
  SsfStreamRegistered:
    kind: event
    description: 管理者が SsfStream を新規登録した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
      direction:
        type: SsfStreamDirection
  SsfStreamUpdated:
    kind: event
    description: 管理者が SsfStream のメタデータを更新した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
  SsfStreamDisabled:
    kind: event
    description: 管理者が SsfStream を無効化した。以後配送/受理を行わない。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
  SsfStreamEnabled:
    kind: event
    description: 管理者が無効化済みの SsfStream を再有効化した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
  SsfStreamDeleted:
    kind: event
    description: 管理者が SsfStream を削除した。付随する Transmitter/ReceiverConfig は cascade で削除する。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
  SecurityEventTransmitted:
    kind: event
    description: SecurityEventDelivery が配送に成功した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
      setJti:
        type: String
  SecurityEventDeliveryFailed:
    kind: event
    description: SecurityEventDelivery が配送に失敗し再試行をスケジュールした。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
      setJti:
        type: String
      attemptCount:
        type: Integer
  SecurityEventDeliveryRetried:
    kind: event
    description: failed 状態の SecurityEventDelivery を再試行のため pending へ戻した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
      setJti:
        type: String
      attemptCount:
        type: Integer
  SecurityEventDeliveryDeadLettered:
    kind: event
    description: SecurityEventDelivery が max_delivery_attempts を使い切り dead_letter へ遷移した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
      setJti:
        type: String
  SecurityEventReceived:
    kind: event
    description: inbound SET を検証し、ローカル revocation として反映した。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
      setJti:
        type: String
      eventType:
        type: CaepEventType
  SecurityEventRejected:
    kind: event
    description: inbound SET の検証が fail-closed で失敗し反映しなかった。
    payload:
      occurredAt:
        type: DateTime
      tenantId:
        type: String
      streamId:
        type: UUID
        optional: true
        description: issuer 解決前に拒否した場合は stream を特定できないことがある。
      verificationResult:
        type: SecurityEventVerificationResult

states:
  SsfStreamLifecycle:
    description: 登録時に enabled として作成される。無効化で disabled に遷移し、以後配送/受理を行わない (fail-closed)。再有効化で enabled に戻せる。削除は状態遷移ではなく行そのものを取り除く終端操作で、付随する Transmitter/ReceiverConfig を cascade で削除する。
    target: SsfStream
    initial: enabled
    transitions:
      - from: enabled
        event: SsfStreamDisabled
        to: disabled
      - from: disabled
        event: SsfStreamEnabled
        to: enabled
  SecurityEventDeliveryLifecycle:
    description: 生成時に pending として作成される。配送成功で delivered (終端) へ、失敗で failed へ遷移し再試行をスケジュールする。failed からは再試行成功で pending に戻り、max_delivery_attempts を使い切ると dead_letter (終端) へ遷移する。
    target: SecurityEventDelivery
    initial: pending
    terminal:
      - delivered
      - dead_letter
    transitions:
      - from: pending
        event: SecurityEventTransmitted
        to: delivered
      - from: pending
        event: SecurityEventDeliveryFailed
        to: failed
      - from: failed
        event: SecurityEventDeliveryRetried
        to: pending
      - from: failed
        event: SecurityEventDeliveryDeadLettered
        to: dead_letter

interfaces:
  # --- internal, published for OAuth2 ---
  CheckRevocationEpoch:
    description: 指定した Agent の revocation epoch を返す。OAuth2 の Introspect / 保護 API が access token の issued_at と比較し、epoch 以前に発行された token を fail-closed で無効と判定するために呼ぶ。
    input:
      tenant_id:
        type: String
      agent_id:
        type: String
    output:
      response:
        type: RevocationEpochResponse
    access: internal

  AdvanceRevocationEpoch:
    description: KillAgent・DisableAgent・UnbindAgentCredential・所有者 (owner_user_id) の Disable/Delete・受理済み inbound SecurityEvent のいずれかを起点に、対象 Agent 群の revocation epoch を前進させる。所有者オフボードは対象テナント内で owner_user_id が一致する全 Agent を一括で前進させる。epoch は既存値より後退しない。
    input:
      tenant_id:
        type: String
      agent_ids:
        type: "String[]"
      reason:
        type: RevocationReason
      source_event_id:
        type: String
        optional: true
    ensures:
      - epoch_advances_monotonically_for_all(input.agent_ids)
    emits:
      - RevocationEpochAdvanced
      - AgentAccessRevoked
    access: internal

  # --- admin: stream management ---
  ListSsfStreams:
    description: 管理者が所属テナントの SsfStream を一覧する。
    output:
      response:
        type: "SsfStream[]"
    errors:
      - AccessDeniedError
    access:
      policies: [TenantAdministrator, ManagementApiClientReadSharedSignals]
      resource:
        type: SsfStreamDirectory
        id: context.tenant_id
    bindings:
      - kind: http
        method: GET
        path: /api/admin/shared-signals/streams

  GetSsfStream:
    description: 管理者が個々の SsfStream を参照する。
    input:
      stream_id:
        type: UUID
    output:
      response:
        type: SsfStream
    errors:
      - InvalidRequestError
      - AccessDeniedError
    access:
      policies: [TenantAdministrator, ManagementApiClientReadSharedSignals]
      resource:
        type: SsfStream
        id: input.stream_id
    bindings:
      - kind: http
        method: GET
        path: "/api/admin/shared-signals/streams/{stream_id}"

  RegisterSsfTransmitterStream:
    description: 管理者が direction=Transmit の SsfStream と配送先 (SsfTransmitterConfig) を登録する。
    input:
      request:
        type: SsfTransmitterStreamRegisterRequest
    output:
      response:
        type: SsfStream
    errors:
      - InvalidRequestError
      - AccessDeniedError
      - QuotaExceededError
    emits:
      - SsfStreamRegistered
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSharedSignals]
      resource:
        type: SsfStreamDirectory
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: /api/admin/shared-signals/streams/transmitter
        request_form: body
        successful_status_codes:
          - "201"

  RegisterSsfReceiverStream:
    description: 管理者が direction=Receive の SsfStream と外部 transmitter の信頼設定 (SsfReceiverConfig) を登録する。
    input:
      request:
        type: SsfReceiverStreamRegisterRequest
    output:
      response:
        type: SsfStream
    errors:
      - InvalidRequestError
      - AccessDeniedError
      - QuotaExceededError
    emits:
      - SsfStreamRegistered
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSharedSignals]
      resource:
        type: SsfStreamDirectory
        id: context.tenant_id
    bindings:
      - kind: http
        method: POST
        path: /api/admin/shared-signals/streams/receiver
        request_form: body
        successful_status_codes:
          - "201"

  UpdateSsfStream:
    description: 管理者が SsfStream の event_types 等のメタデータを更新する。
    input:
      stream_id:
        type: UUID
      request:
        type: SsfStreamUpdateRequest
    output:
      response:
        type: SsfStream
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - SsfStreamUpdated
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSharedSignals]
      resource:
        type: SsfStream
        id: input.stream_id
    bindings:
      - kind: http
        method: PATCH
        path: "/api/admin/shared-signals/streams/{stream_id}"
        request_form: body

  DisableSsfStream:
    description: 管理者が SsfStream を無効化する。以後配送/受理を行わない。
    input:
      stream_id:
        type: UUID
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - SsfStreamDisabled
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSharedSignals]
      resource:
        type: SsfStream
        id: input.stream_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/shared-signals/streams/{stream_id}/disable"
        successful_status_codes:
          - "204"

  EnableSsfStream:
    description: 管理者が無効化済みの SsfStream を再有効化する。
    input:
      stream_id:
        type: UUID
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - SsfStreamEnabled
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSharedSignals]
      resource:
        type: SsfStream
        id: input.stream_id
    bindings:
      - kind: http
        method: POST
        path: "/api/admin/shared-signals/streams/{stream_id}/enable"
        successful_status_codes:
          - "204"

  DeleteSsfStream:
    description: 管理者が SsfStream を削除する。付随する Transmitter/ReceiverConfig は cascade で削除する。
    input:
      stream_id:
        type: UUID
    errors:
      - InvalidRequestError
      - AccessDeniedError
    emits:
      - SsfStreamDeleted
    access:
      policies: [TenantAdministrator, ManagementApiClientWriteSharedSignals]
      resource:
        type: SsfStream
        id: input.stream_id
    bindings:
      - kind: http
        method: DELETE
        path: "/api/admin/shared-signals/streams/{stream_id}"
        successful_status_codes:
          - "204"

  ListSecurityEventDeliveries:
    description: 管理者が direction=Transmit の SsfStream の配送状況 (pending/delivered/failed/dead_letter) を一覧する。運用の delivery health 確認に使う。
    input:
      stream_id:
        type: UUID
    output:
      response:
        type: "SecurityEventDelivery[]"
    errors:
      - InvalidRequestError
      - AccessDeniedError
    access:
      policies: [TenantAdministrator, ManagementApiClientReadSharedSignals]
      resource:
        type: SsfStream
        id: input.stream_id
    bindings:
      - kind: http
        method: GET
        path: "/api/admin/shared-signals/streams/{stream_id}/deliveries"

  # --- receiver: inbound push ---
  ReceiveSecurityEvent:
    description: 外部 transmitter からの SET を受理する。署名検証・登録済み issuer 照合・jti 重複検知・subject 解決のいずれかに失敗した場合は反映せず拒否する (fail-closed)。検証を通過したイベントはローカル revocation (AdvanceRevocationEpoch) として反映する。
    input:
      stream_id:
        type: UUID
      token:
        type: String
        description: 受理した SET の compact serialization。
    errors:
      - SecurityEventRejectedError
    requires:
      - ssf_receiver_stream_enabled(context.tenant_id, input.stream_id)
      - security_event_signature_and_claims_valid(context.tenant_id, input.stream_id, input.token)
      - "!security_event_replayed(context.tenant_id, input.stream_id, input.token)"
      - security_event_subject_resolves_to_tenant_local_principal(context.tenant_id, input.token)
    emits:
      - SecurityEventReceived
      - SecurityEventRejected
    access: public
    bindings:
      - kind: http
        method: POST
        path: "/ssf/streams/{stream_id}/events"
        request_form: body
        successful_status_codes:
          - "202"

authorization:
  resources:
    SsfStreamDirectory:
      description: テナント内の SsfStream 一覧・登録対象を表す singleton resource。
    SsfStream:
      description: 個々の SsfStream。
  principals:
    TenantAdministrator:
      type: User
      matches:
        - context.authenticated
        - principal.status == "Active"
        - '"tenant_admin" in principal.roles'
        - principal.tenant_id == context.tenant_id
    ManagementApiClient:
      type: Agent
      matches:
        - context.authenticated
        - principal.tenant_id == context.tenant_id
  policies:
    TenantAdministrator:
      effect: permit
      principal: TenantAdministrator
      when: principal.tenant_id == context.tenant_id
    ManagementApiClientReadSharedSignals:
      effect: permit
      principal: ManagementApiClient
      when: '"shared-signals:read" in context.token_scopes && principal.tenant_id == context.tenant_id'
    ManagementApiClientWriteSharedSignals:
      effect: permit
      principal: ManagementApiClient
      when: '"shared-signals:write" in context.token_scopes && principal.tenant_id == context.tenant_id'

objectives:
  RevocationPropagationLatency:
    description: "AgentAccessRevoked (LocalRevocation, kill-switch/所有者オフボード/inbound SET のいずれが\n起点でも) から、購読中の SsfStream 向け SecurityEventDelivery が delivered になるまでの遅延の\n99% 以上を 30 秒未満に収める。LocalRevocation 自体はこの目標を待たずに即時完了し\n(ADR-057 決定6)、この目標は EcosystemPropagation (外部 receiver への SET 配送) だけを対象とする。\n"
    indicator: measurement.revocation_to_delivery_latency < duration("30s")
    target: 0.99
    window: 30d
    budgeting: occurrences

scenarios:
  kill-switchは既発行トークンをintrospectionで即時無効化する:
    actor: TenantAdministrator
    given:
      - Active な Agent "A1" に紐づく access token "AT1" が発行済みである
    main_success:
      - 管理者が KillAgent で "A1" を kill する
      - "\"A1\" の AgentRevocationEpoch が現在時刻へ前進する"
      - "\"RevocationEpochAdvanced\" と \"AgentAccessRevoked\" が発行される"
      - "\"AT1\" の introspection は active=false を返す"
    extensions:
      - at: 3
        condition: "\"AT1\" の issued_at が新しい epoch より後 (kill 後に再発行された token) である"
        steps:
          - introspection は active=true を返す (kill 前の token だけが対象)

  所有者のオフボードは配下エージェント群を一括失効する:
    actor: TenantAdministrator
    given:
      - User "owner1" が Agent "A1"・"A2" を所有している
    main_success:
      - 管理者が "owner1" を DisableAdminUser する
      - "\"A1\" と \"A2\" の AgentRevocationEpoch が同一エポックへ前進する"
      - 両 Agent それぞれについて "AgentAccessRevoked" が発行される

  署名不正のSETは反映されず拒否される:
    actor: System
    given:
      - direction=Receive の SsfStream "S1" が trusted_issuer "https://issuer.example" で登録されている
    main_success:
      - 署名が不正な SET を "S1" へ POST する
      - 要求は SecurityEventRejectedError で拒否される
      - "\"SecurityEventRejected\" が verification_result=rejected_signature で発行される"
      - AgentRevocationEpoch は変化しない

  重複jtiのSETは一度だけ反映される:
    actor: System
    given:
      - direction=Receive の SsfStream "S1" に有効な SET (jti="J1") を送信済みである
    main_success:
      - 同一 jti "J1" の SET を再度 "S1" へ POST する
      - 要求は SecurityEventRejectedError で拒否される
      - "\"SecurityEventRejected\" が verification_result=rejected_replay で発行される"

  他テナントのstreamはissuer一致でも受理されない:
    actor: System
    given:
      - "tenant \"T1\" が direction=Receive の SsfStream \"S1\" を登録している"
      - "tenant \"T2\" の Agent を subject とする SET を保持している"
    main_success:
      - "SET を \"S1\" へ POST する"
      - 要求は SecurityEventRejectedError で拒否される
      - "\"SecurityEventRejected\" が verification_result=rejected_subject_unresolved で発行される"

  配送失敗は再試行され上限超過でdead_letterへ遷移する:
    actor: System
    given:
      - direction=Transmit の SsfStream "S1" に対する SecurityEventDelivery "D1" が pending である
      - "\"S1\" の max_delivery_attempts は 3 である"
    main_success:
      - "receiver endpoint への配送が 3 回連続で失敗する"
      - "\"D1\" は 2 回まで failed→pending の再試行を経て、3 回目の失敗で dead_letter へ遷移する"
      - "各失敗で \"SecurityEventDeliveryFailed\" が、最終失敗で \"SecurityEventDeliveryDeadLettered\" が発行される"
    extensions:
      - at: 1
        condition: 3 回目までに配送が成功する
        steps:
          - "\"D1\" は delivered へ遷移し \"SecurityEventTransmitted\" が発行される"

  receiver障害はローカル失効を遅らせない:
    actor: TenantAdministrator
    given:
      - direction=Transmit の SsfStream "S1" の receiver endpoint が到達不能である
    main_success:
      - 管理者が Agent "A1" を kill する
      - "\"A1\" の AgentRevocationEpoch は即座に前進し introspection へ反映される"
      - "\"S1\" 向けの SecurityEventDelivery は pending のまま再試行対象になる (LocalRevocation は EcosystemPropagation の成否を待たない)"

  無効化したstreamは配送も受理も行わない:
    actor: TenantAdministrator
    given:
      - SsfStream "S1" が enabled である
    main_success:
      - 管理者が "S1" を DisableSsfStream する
      - "\"S1\" が direction=Receive なら以後の SET は ssf_receiver_stream_enabled により拒否される"
      - "\"S1\" が direction=Transmit なら以後の RevocationEpochAdvanced から新規 SecurityEventDelivery を生成しない"
