# idmagic ClaimMapping — SCL
# SCL 3.0 context specification.

system: idmagic
spec_version: "3.0"
context: ClaimMapping
glossary:
  ClaimMappingPolicy:
    definition: identity principal の属性を外部 application / relying party / service provider / client へ出すための属性解決と出力許可の規則。
    aliases:
      - ClaimMappingPolicy
      - attribute release
      - claim mapping
models:
  ClaimMappingSource:
    kind: enum
    description: claim 値の供給元。user_attribute は identity principal の属性、fixed は静的な固定値、 nameid は NameIdConfiguration が解決した NameID 値を claim にも反映する場合に使う。
    values:
      - user_attribute
      - fixed
      - nameid
  ClaimMappingRule:
    kind: value_object
    description: 1 つの出力 claim の宣言的 mapping。出力 claim 型 (URI) を source から組み立てる。
    fields:
      claim_type:
        type: String
        constraints:
          - non_empty
        description: "出力する claim 型 URI (例: http://schemas.xmlsoap.org/claims/UPN)。"
      source:
        type: ClaimMappingSource
        description: claim 値の供給元。
      source_key:
        type: String
        optional: true
        description: source=user_attribute のとき参照する属性名。
      fixed_value:
        type: String
        optional: true
        description: source=fixed のとき出力する固定値。
      required:
        type: Boolean
        default: false
        description: true のとき source が解決できなければ発行を拒否する (fail-closed)。
  NameIdConfiguration:
    kind: value_object
    description: 発行 assertion の NameID (subject 識別子) の format と供給元。
    fields:
      format:
        type: String
        constraints:
          - non_empty
        description: "NameID format URI (例: urn:oasis:names:tc:SAML:2.0:nameid-format:persistent)。"
      source_attribute:
        type: String
        constraints:
          - non_empty
        description: NameID 値を供給する identity 属性名。
  ClaimMappingPolicy:
    kind: value_object
    description: RP/SP trust ごとの claim 発行規則一式。NameID と claim 規則集合を束ねる。
    fields:
      name_id:
        type: NameIdConfiguration
        description: NameID の構成。
      rules:
        type: "ClaimMappingRule[]"
        optional: true
        description: 出力 claim 規則の集合 (空なら NameID のみ)。
  IssuedClaim:
    kind: value_object
    description: claim 発行エンジンの出力。1 つの claim 型と、その値群。
    fields:
      claim_type:
        type: String
        constraints:
          - non_empty
        description: claim 型 URI。
      values:
        type: "String[]"
        constraints:
          - non_empty
        description: claim の値群 (多値属性は複数値になる)。
  AttrVisibility:
    kind: enum
    description: Tenancy context が publish する属性開示範囲の published language stub。Private だけが claim 発行の fail-closed floor で常に除外される。
    values:
      - Private
      - SelfReadable
      - AdminReadable
      - ClaimExposed
  UserAttributeDef:
    kind: value_object
    description: Tenancy context が publish する属性定義の published language stub。claim 発行時の属性可視性判定にのみ使う。
    fields:
      key:
        type: String
        constraints:
          - non_empty
      visibility:
        type: AttrVisibility
        default: Private
  ClaimReleaseDeniedError:
    kind: error
    status: 422
    description: "claim 解決が fail-closed で拒否された。required source が解決できない、\nvisibility=Private の属性を rule / NameID の source に指定している、または reserved claim type\n(iss/sub/aud/exp/iat/nbf/jti/azp/nonce/at_hash/c_hash/acr/amr/sid) を claim_type に指定している\nのいずれか。\n"
    payload:
      reason:
        type: String
interfaces:
  ResolveEffectiveClaims:
    description: "tenant の属性可視性 (visibility != Private) と reserved claim type の固定集合を\nfail-closed floor として強制し、ClaimMappingPolicy と解決済み属性から NameID と IssuedClaim[] を\n組み立てる。WS-Fed / SAML / OIDC の各 issuer が共有する唯一の claim 解決経路。\nUser の core field (user_id / email / name / given_name / family_name / preferred_username /\nemail_verified / roles) は UserAttributeDef に現れないため常に解決対象にする。user_id は User 集約の\n識別子を指す protocol-neutral な内部属性キーであり、OIDC ID Token/UserInfo が実際に発行する wire\nclaim \"sub\" (RFC 7519 / OIDC Core が定める語彙) とは別物。custom attribute で\nattribute_defs に無い key、または visibility=Private の key を source に持つ rule は floor で拒否する。\n"
    input:
      policy:
        type: ClaimMappingPolicy
      attributes:
        type: "Map<String, String[]>"
        description: 解決済みの identity 属性値 (多値)。
      attribute_defs:
        type: "UserAttributeDef[]"
        description: tenant の属性定義 (builtin + custom)。可視性判定に使う。
    output:
      name_id_format:
        type: String
      name_id_value:
        type: String
      claims:
        type: "IssuedClaim[]"
    errors:
      - ClaimReleaseDeniedError
    read_only: true
    stability: internal
    access: internal
