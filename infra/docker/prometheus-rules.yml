# Minimal recording/alert rules built only on the metric catalog exposed by
# GET /metrics (system.yaml MetricsExposition; see README "Metrics" section).
# wi-11 (Kubernetes/monitoring assets) turns these into the cluster
# PrometheusRule/ServiceMonitor/Grafana provisioning; this file is its input,
# not a production deployment artifact.
#
# `route` carries the Echo route template. Because the same handler is
# reachable both unprefixed (default tenant) and under
# /realms/:tenant_id/..., matching both forms uses a suffix regex rather than
# an exact match — it never matches on a resolved tenant_id value.
groups:
  - name: idmagic-http-red
    rules:
      - record: idmagic:http_request_error_ratio:ratio_rate5m
        expr: |
          sum by (route) (rate(http_requests_total{status_code=~"5.."}[5m]))
          / sum by (route) (rate(http_requests_total[5m]))
      - record: idmagic:http_request_duration_seconds:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (route, le) (rate(http_request_duration_seconds_bucket[5m])))

  - name: idmagic-authentication-golden-signals
    rules:
      - record: idmagic:login_failure_ratio:ratio_rate5m
        expr: |
          sum(rate(authn_login_attempts_total{outcome="failure"}[5m]))
          / sum(rate(authn_login_attempts_total[5m]))
      - record: idmagic:login_throttle_hit_ratio:ratio_rate5m
        expr: |
          sum(rate(authn_login_throttle_total{outcome="throttled"}[5m]))
          / sum(rate(authn_login_throttle_total[5m]))

  # wi-261 T006: lane is always a bounded execution-lane label
  # (latency_sensitive/default/bulk), never tenant_id/job_id.
  - name: idmagic-jobs-golden-signals
    rules:
      - record: idmagic:jobs_failure_ratio:ratio_rate5m
        expr: |
          sum by (lane) (rate(jobs_outcome_total{outcome="failed"}[5m]))
          / sum by (lane) (rate(jobs_outcome_total[5m]))
      - record: idmagic:jobs_claim_latency_seconds:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (lane, le) (rate(jobs_claim_latency_seconds_bucket[5m])))
      - record: idmagic:jobs_retry_ratio:ratio_rate5m
        expr: |
          sum by (lane) (rate(jobs_retry_total[5m]))
          / (sum by (lane) (rate(jobs_outcome_total[5m])) + sum by (lane) (rate(jobs_retry_total[5m])))

  # wi-396: class is always a bounded support.PriorityClass
  # (interactive_auth/management/management_bulk/infrastructure/unclassified),
  # never a resolved path or tenant value.
  - name: idmagic-admission-control
    rules:
      - record: idmagic:http_admission_shed_ratio:ratio_rate5m
        expr: |
          sum by (class) (rate(http_admission_decisions_total{outcome="shed"}[5m]))
          / sum by (class) (rate(http_admission_decisions_total[5m]))

  # `family` は要求の用途による種別であり、`route` の正規表現から導く。上の優先度クラス
  # とは別の分類である。優先度クラスは飽和時に何を先に捨てるかを決め、種別は
  # docs/design/performance/capacity.md の「管理と連携」のどの行に対応するかを決める。
  # 同じ経路が両者で別の値を取ることがある (`/register` は種別 authentication、
  # 優先度クラス management)。
  #
  # 分類の実体はこの 6 本の正規表現である。ここから漏れた経路は集計から消えるだけで、
  # 系列も警告も出ない。backend/shared/http/server_http/request_family_test.go が、
  # 組み立て済みの経路がちょうど 1 つの種別に当たること、同じ種別の 3 本が同じ正規表現を
  # 使うこと、この節と infra/k8s/monitoring/prometheus-rule.yaml が一致することを見る。
  #
  # `route` は登録済みのルートパターンなので、デフォルトテナントの裸の経路と
  # /realms/:tenant_id 配下の同じ操作は同じ種別へ入る。
  - name: idmagic-request-families
    rules:
      - record: idmagic:http_requests_by_family_status:rate5m
        labels: { family: authentication }
        expr: |
          sum by (status_code) (rate(http_requests_total{route=~"(/realms/[^/]+)?(/\\.well-known/.*|/authorize(/.*)?|/token|/introspect|/revoke|/userinfo|/par|/bc-authorize|/device_authorization|/end_session|/register|/jwks|/session/check|/saml(/.*)?|/wsfed|/federationmetadata/.*|/trust/.*|/api/auth/.*|/api/branding(/.*)?|/tenant-branding-assets/.*|/application-icons/.*)"}[5m]))
      - record: idmagic:http_request_duration_seconds_by_family:histogram_rate5m
        labels: { family: authentication }
        expr: |
          sum by (le) (rate(http_request_duration_seconds_bucket{route=~"(/realms/[^/]+)?(/\\.well-known/.*|/authorize(/.*)?|/token|/introspect|/revoke|/userinfo|/par|/bc-authorize|/device_authorization|/end_session|/register|/jwks|/session/check|/saml(/.*)?|/wsfed|/federationmetadata/.*|/trust/.*|/api/auth/.*|/api/branding(/.*)?|/tenant-branding-assets/.*|/application-icons/.*)"}[5m]))
      - record: idmagic:http_requests_in_flight_by_family:sum
        labels: { family: authentication }
        expr: |
          sum(http_requests_in_flight{route=~"(/realms/[^/]+)?(/\\.well-known/.*|/authorize(/.*)?|/token|/introspect|/revoke|/userinfo|/par|/bc-authorize|/device_authorization|/end_session|/register|/jwks|/session/check|/saml(/.*)?|/wsfed|/federationmetadata/.*|/trust/.*|/api/auth/.*|/api/branding(/.*)?|/tenant-branding-assets/.*|/application-icons/.*)"})

      - record: idmagic:http_requests_by_family_status:rate5m
        labels: { family: portal }
        expr: |
          sum by (status_code) (rate(http_requests_total{route=~"(/realms/[^/]+)?/api/account/v1/.*"}[5m]))
      - record: idmagic:http_request_duration_seconds_by_family:histogram_rate5m
        labels: { family: portal }
        expr: |
          sum by (le) (rate(http_request_duration_seconds_bucket{route=~"(/realms/[^/]+)?/api/account/v1/.*"}[5m]))
      - record: idmagic:http_requests_in_flight_by_family:sum
        labels: { family: portal }
        expr: |
          sum(http_requests_in_flight{route=~"(/realms/[^/]+)?/api/account/v1/.*"})

      - record: idmagic:http_requests_by_family_status:rate5m
        labels: { family: management }
        expr: |
          sum by (status_code) (rate(http_requests_total{route=~"(/realms/[^/]+)?/api/admin/v1/.*"}[5m]))
      - record: idmagic:http_request_duration_seconds_by_family:histogram_rate5m
        labels: { family: management }
        expr: |
          sum by (le) (rate(http_request_duration_seconds_bucket{route=~"(/realms/[^/]+)?/api/admin/v1/.*"}[5m]))
      - record: idmagic:http_requests_in_flight_by_family:sum
        labels: { family: management }
        expr: |
          sum(http_requests_in_flight{route=~"(/realms/[^/]+)?/api/admin/v1/.*"})

      - record: idmagic:http_requests_by_family_status:rate5m
        labels: { family: scim }
        expr: |
          sum by (status_code) (rate(http_requests_total{route=~"(/realms/[^/]+)?/scim/v2/.*"}[5m]))
      - record: idmagic:http_request_duration_seconds_by_family:histogram_rate5m
        labels: { family: scim }
        expr: |
          sum by (le) (rate(http_request_duration_seconds_bucket{route=~"(/realms/[^/]+)?/scim/v2/.*"}[5m]))
      - record: idmagic:http_requests_in_flight_by_family:sum
        labels: { family: scim }
        expr: |
          sum(http_requests_in_flight{route=~"(/realms/[^/]+)?/scim/v2/.*"})

      - record: idmagic:http_requests_by_family_status:rate5m
        labels: { family: shared_signals }
        expr: |
          sum by (status_code) (rate(http_requests_total{route=~"(/realms/[^/]+)?/ssf/.*"}[5m]))
      - record: idmagic:http_request_duration_seconds_by_family:histogram_rate5m
        labels: { family: shared_signals }
        expr: |
          sum by (le) (rate(http_request_duration_seconds_bucket{route=~"(/realms/[^/]+)?/ssf/.*"}[5m]))
      - record: idmagic:http_requests_in_flight_by_family:sum
        labels: { family: shared_signals }
        expr: |
          sum(http_requests_in_flight{route=~"(/realms/[^/]+)?/ssf/.*"})

      - record: idmagic:http_requests_by_family_status:rate5m
        labels: { family: operations }
        expr: |
          sum by (status_code) (rate(http_requests_total{route=~"/livez|/readyz|/startupz|/health|/metrics"}[5m]))
      - record: idmagic:http_request_duration_seconds_by_family:histogram_rate5m
        labels: { family: operations }
        expr: |
          sum by (le) (rate(http_request_duration_seconds_bucket{route=~"/livez|/readyz|/startupz|/health|/metrics"}[5m]))
      - record: idmagic:http_requests_in_flight_by_family:sum
        labels: { family: operations }
        expr: |
          sum(http_requests_in_flight{route=~"/livez|/readyz|/startupz|/health|/metrics"})

      # 以下の 4 本は種別を知らない。上が付けた `family` ラベルを集計するだけなので、
      # 種別を足しても書き換えない。Prometheus はグループ内の規則を順に評価するので、
      # 同じグループの後ろに置けば上の系列を読める。
      - record: idmagic:http_requests_by_family:rate5m
        expr: |
          sum by (family) (idmagic:http_requests_by_family_status:rate5m)
      - record: idmagic:http_request_success_ratio_by_family:ratio_rate5m
        expr: |
          sum by (family) (idmagic:http_requests_by_family_status:rate5m{status_code!~"5.."})
          / sum by (family) (idmagic:http_requests_by_family_status:rate5m)
      - record: idmagic:http_request_duration_seconds_by_family:p50_5m
        expr: |
          histogram_quantile(0.5, idmagic:http_request_duration_seconds_by_family:histogram_rate5m)
      - record: idmagic:http_request_duration_seconds_by_family:p99_5m
        expr: |
          histogram_quantile(0.99, idmagic:http_request_duration_seconds_by_family:histogram_rate5m)

  # Each alert below names the service level objective whose error budget it
  # watches. The objectives are defined in docs/requirements/quality.md and evaluated over
  # a rolling 30d window; these alerts evaluate a 5m burn-rate window, so the
  # numbers coinciding today is a design choice, not a constraint.
  - name: idmagic-slo-alerts
    rules:
      - alert: TokenErrorRateBudgetBurn
        expr: idmagic:http_request_error_ratio:ratio_rate5m{route=~".*/token"} > 0.001
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "/token is burning the error budget of SLO-PRIMARY-ERRORS"
          runbook_url: "docs/runbooks/token-endpoint-error-rate.md"
      - alert: TokenLatencyBudgetBurn
        expr: idmagic:http_request_duration_seconds:p99_5m{route=~".*/token"} > 0.3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "/token is burning the error budget of SLO-TOKEN-LATENCY"
          runbook_url: "docs/runbooks/token-endpoint-latency.md"
      - alert: LoginErrorRateBudgetBurn
        expr: idmagic:http_request_error_ratio:ratio_rate5m{route=~".*/api/auth/login"} > 0.001
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "/api/auth/login is burning the error budget of SLO-PRIMARY-ERRORS"
          runbook_url: "docs/runbooks/login-error-rate.md"
      - alert: LoginLatencyBudgetBurn
        expr: idmagic:http_request_duration_seconds:p99_5m{route=~".*/api/auth/login"} > 0.3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "/api/auth/login is burning the error budget of SLO-LOGIN-LATENCY"
          runbook_url: "docs/runbooks/login-latency.md"
      - alert: LoginThrottleHitRatioHigh
        expr: idmagic:login_throttle_hit_ratio:ratio_rate5m > 0.2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "sustained high login-throttle hit ratio; possible credential stuffing"
          runbook_url: "docs/runbooks/login-throttle-hit-ratio.md"
      - alert: JobsLatencySensitiveClaimLatencyHigh
        expr: idmagic:jobs_claim_latency_seconds:p99_5m{lane="latency_sensitive"} > 5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "latency_sensitive lane p99 claim latency exceeds 5s despite lane isolation; check that lane's worker deployment for crashes or undersized concurrency"
          runbook_url: "docs/runbooks/async-jobs.md"
      - alert: JobsFailureRatioBudgetBurn
        expr: idmagic:jobs_failure_ratio:ratio_rate5m > 0.05
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "sustained >5% dead-letter rate on lane {{ $labels.lane }}"
          runbook_url: "docs/runbooks/async-jobs.md"
      - alert: JobsLatencySensitiveQueueDepthHigh
        expr: jobs_queue_depth{status="queued", lane="latency_sensitive"} > 100
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "latency_sensitive lane queued depth sustained above 100; its dedicated worker may be undersized or down"
          runbook_url: "docs/runbooks/async-jobs.md"
      - alert: ApiAdmissionSheddingInteractiveAuth
        expr: sum(rate(http_admission_decisions_total{class="interactive_auth", outcome="shed"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "admission control is refusing interactive authentication; the last degradation stage before SLO-PRIMARY-ERRORS and SLO-OAUTH2-AVAILABILITY are lost"
          runbook_url: "docs/runbooks/admission-control.md"
      - alert: ApiAdmissionShedding
        expr: idmagic:http_admission_shed_ratio:ratio_rate5m{class=~"management|management_bulk"} > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "admission control has been shedding class {{ $labels.class }} for 10m; either the process is undersized or the thresholds are too low"
          runbook_url: "docs/runbooks/admission-control.md"
      - alert: ApiAdmissionUnclassifiedRoute
        expr: sum(rate(http_admission_decisions_total{class="unclassified"}[5m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "a route with no declared priority class is being served; load shedding cannot order it"
          runbook_url: "docs/runbooks/admission-control.md"
