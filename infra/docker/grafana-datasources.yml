# Provisions the Prometheus and Loki datasources Grafana needs so that the
# existing dashboard (grafana-dashboard.json) and the Loki Explore view work
# without any manual setup (wi-304).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
