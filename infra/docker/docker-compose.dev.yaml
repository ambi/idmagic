services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: idmagic
      POSTGRES_USER: idmagic
      POSTGRES_PASSWORD: idmagic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idmagic"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["5432:5432"]

  schema:
    image: sqldef/psqldef:3.11.18
    environment:
      PGPASSWORD: idmagic
    volumes:
      - ../schema:/schema:ro
    command: ["-U", "idmagic", "-h", "postgres", "-p", "5432", "idmagic", "--apply", "--file", "/schema/postgres.sql"]
    depends_on:
      postgres: { condition: service_healthy }



  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4318:4318"]

  # MetricsExposition の /metrics を pull-scrape する最小例。recording/alert
  # rule と dashboard は wi-11 (Kubernetes/monitoring 資産) が所有する。
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]
    depends_on:
      idp: { condition: service_started }

  # wi-304: application log aggregation (JSON Lines -> Loki).
  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports: ["3100:3100"]

  # Reads every container's logs via the Docker Engine API (docker_sd_configs
  # in promtail-config.yaml), so only the socket is mounted, not a host log
  # directory.
  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki: { condition: service_started }

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/idmagic-golden-signals.json:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }

  idp:
    image: idmagic:dev
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      ADDR: :8081
      ISSUER: http://localhost:8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGINS: http://localhost:8080
      WEBAUTHN_RP_DISPLAY_NAME: IdMagic Local
      PERSISTENCE: postgres
      DATABASE_URL: postgres://idmagic:idmagic@postgres:5432/idmagic?sslmode=disable
      OBSERVABILITY: otel
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      SEED_ENVIRONMENT: development
      SEED_PROFILE: development
      DEMO_CLIENT_SECRET: demo-client-secret
      DEMO_USER_PASSWORD: demo-password-1234
    depends_on:
      postgres: { condition: service_healthy }
      schema: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_LOGIN_ENABLED: "true"
    environment:
      BACKEND_ADDRESS: http://idp:8081
    depends_on:
      idp: { condition: service_started }
    ports: ["8080:8080"]



  worker:
    image: idmagic:dev
    entrypoint: ["/app/idmagic-worker"]
    # JOB_WORKER_LANES is intentionally unset: compat mode, a single
    # process claims every lane. Production splits this into one Deployment
    # per lane (infra/k8s/base/worker.yaml) so latency_sensitive gets a
    # reserved execution slot independent of the bulk backlog.
    environment:
      PERSISTENCE: postgres
      DATABASE_URL: postgres://idmagic:idmagic@postgres:5432/idmagic?sslmode=disable
      OBSERVABILITY: otel
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: idmagic-worker
    depends_on:
      postgres: { condition: service_healthy }
      schema: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
