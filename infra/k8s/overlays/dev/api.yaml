apiVersion: apps/v1
kind: Deployment
metadata: { name: idmagic-api }
spec:
  template:
    spec:
      containers:
        - name: api
          envFrom:
            - configMapRef: { name: idmagic-runtime }
            - secretRef: { name: idmagic-dev-runtime-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
# The dev overlay is a single-node sandbox, not a capacity target: it keeps the
# autoscaler wired (so the object is exercised the same way prod's is) but with
# a floor of one replica.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: idmagic-api }
spec:
  minReplicas: 1
  maxReplicas: 2
