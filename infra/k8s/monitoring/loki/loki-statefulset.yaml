apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: idmagic-loki
  labels:
    app.kubernetes.io/name: idmagic
    app.kubernetes.io/component: loki
    app.kubernetes.io/part-of: idmagic
spec:
  serviceName: idmagic-loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idmagic
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idmagic
        app.kubernetes.io/component: loki
        app.kubernetes.io/part-of: idmagic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: idmagic-loki }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: idmagic
          app.kubernetes.io/component: loki
          app.kubernetes.io/part-of: idmagic
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: idmagic-loki
  labels:
    app.kubernetes.io/name: idmagic
    app.kubernetes.io/component: loki
    app.kubernetes.io/part-of: idmagic
spec:
  selector:
    app.kubernetes.io/name: idmagic
    app.kubernetes.io/component: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
