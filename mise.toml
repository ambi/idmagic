[tools]
go = "1.26.5"
bun = "1.3.14"
"aqua:golangci/golangci-lint" = "2.13.1"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:sqldef/sqldef/psqldef" = "3.11.18"

[env]
GOLANGCI_LINT_CACHE = "/tmp/idmagic-golangci-cache"

[tasks.setup]
description = "Install repository dependencies and link agent skills"
depends = ["setup-tools", "install-ui"]

[tasks.setup-tools]
description = "Install embedded tooling dependencies and link agent skills"
run = [
  "cd tools && bun install",
  "ln -sfn tools/node_modules node_modules",
  "mkdir -p .agents/skills .claude",
  "ln -sfn ../.agents/skills .claude/skills",
]

[tasks.tool-versions]
description = "Show the development tool versions selected by mise"
run = ["go version", "bun --version", "golangci-lint version", "sqlc version", "psqldef --version"]

[tasks.setup-cli-tools]
description = "Install host CLI tools used by repository instructions"
run = '''
#!/usr/bin/env sh
set -eu
if ! command -v brew >/dev/null 2>&1; then
  echo "Homebrew not found. Install manually: jq yq ripgrep fd gh ast-grep sd" >&2
  exit 1
fi
brew install jq yq ripgrep fd gh ast-grep sd
'''

[tasks.compile-spec]
description = "Compile TypeSpec and emit OpenAPI"
dir = "tools"
run = "bunx tsp compile ../spec/main.tsp --config ../spec/tspconfig.yaml"

[tasks.generate-contract]
description = "Generate runtime route metadata from compiled OpenAPI"
dir = "tools"
run = "bun run generate-contract/src/main.ts"

[tasks.check-generated-contract]
description = "Check runtime route metadata against TypeSpec"
dir = "tools"
run = "bun run generate-contract/src/main.ts --check"

[tasks.install-ui]
description = "Install UI dependencies"
dir = "frontend"
run = "bun install --frozen-lockfile"

[tasks.verify]
description = "Run the standard verification suite in parallel"
depends = ["check", "check-api-compat", "test-tools", "typecheck-tools", "lint-go", "test-go", "format-check-ui", "lint-ui", "test-ui-unit", "build-ui"]

[tasks.verify-serial]
description = "Run the standard verification suite serially"
run = [
  "mise run check",
  "mise run check-api-compat",
  "mise run test-tools",
  "mise run typecheck-tools",
  "mise run lint-go",
  "mise run test-go-race",
  "mise run format-check-ui",
  "mise run lint-ui",
  "mise run test-ui-unit",
  "mise run build-ui",
]

[tasks.verify-spec]
description = "Validate specifications and embedded tooling"
depends = ["check", "test-tools", "typecheck-tools"]

[tasks.test-tools]
description = "Run embedded repository tooling tests"
dir = "tools"
run = "bun test"

[tasks.typecheck-tools]
description = "Type-check embedded repository tooling"
dir = "tools"
run = "bun run typecheck"

[tasks.format-tools]
description = "Format embedded repository tooling"
dir = "tools"
run = "bun run format"

[tasks.lint-tools]
description = "Lint embedded repository tooling"
dir = "tools"
run = "bun run lint"

[tasks.verify-go]
description = "Verify Go with lint and race-enabled tests"
depends = ["lint-go", "test-go-race"]

[tasks.lint-go]
description = "Run Go lint"
run = "golangci-lint run ./..."

[tasks.clean-lint-cache]
description = "Clear the golangci-lint cache"
run = "rm -rf /tmp/idmagic-golangci-cache"

[tasks.format-go]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.test-go]
description = "Run Go tests"
run = "go test ./..."

[tasks.test-go-package]
description = "Run Go tests for one package"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-go-package -- <package>" >&2; exit 2; }
go test "$1"
'''

[tasks.benchmark-go-package]
description = "Benchmark one Go package"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 2 || { echo "usage: mise run benchmark-go-package -- <package> <benchmark> [count]" >&2; exit 2; }
go test "$1" -run '^$' -bench "$2" -benchmem -count "${3:-5}"
'''

[tasks.seed]
description = "Plan or apply an explicit environment seed"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 2 || { echo "usage: mise run seed -- <environment> <profile> [mode] [manifest] [count]" >&2; exit 2; }
go run ./backend/cmd/idmagic-seed --environment "$1" --profile "$2" --mode "${3:-dry_run}" --manifest "${4:-}" --count "${5:-0}"
'''

[tasks.seed-throughput]
description = "Measure seeding throughput; writes real data"
run = '''
#!/usr/bin/env sh
set -eu
go run ./backend/cmd/idmagic-seed --environment "${1:-development}" --profile performance --mode apply --count "${2:-10000}" --batch-size "${3:-250}"
'''

[tasks.batch]
description = "Run one externally scheduled operational batch"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run batch -- <task> [args...]" >&2; exit 2; }
go run ./backend/cmd/idmagic-batch "$@"
'''

[tasks.go-mod-tidy]
description = "Synchronize Go module requirements and checksums"
run = "go mod tidy"

[tasks.test-go-race]
description = "Run race-enabled Go tests"
run = "go test -race ./..."

[tasks.test-go-cover]
description = "Run Go tests with coverage"
run = ["go test -coverprofile=coverage.out -covermode=atomic ./...", "go tool cover -func=coverage.out"]

[tasks.test-go-fuzz]
description = "Run Go fuzz targets for a package"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-go-fuzz -- <package> [fuzztime]" >&2; exit 2; }
go test -run=Fuzz -fuzz=Fuzz -fuzztime="${2:-30s}" "$1"
'''

[tasks.build-go]
description = "Build all Go packages with version metadata"
run = '''
#!/usr/bin/env sh
set -eu
git_commit=$(git rev-parse HEAD 2>/dev/null || echo unknown)
build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo unknown)
version=${VERSION:-0.0.0-dev}
go build -ldflags "-X github.com/ambi/idmagic/backend/shared/version.Version=$version -X github.com/ambi/idmagic/backend/shared/version.GitCommit=$git_commit -X github.com/ambi/idmagic/backend/shared/version.BuildDate=$build_date" ./...
'''

[tasks.sqlc-generate]
description = "Regenerate sqlc PostgreSQL query code"
run = "sqlc generate"

[tasks.verify-ui]
description = "Verify UI format, lint, tests, and build"
depends = ["format-check-ui", "lint-ui", "test-ui-unit", "build-ui"]

[tasks.format-check-ui]
description = "Check UI formatting"
dir = "frontend"
run = "bun run format:check"

[tasks.format-ui]
description = "Format UI"
dir = "frontend"
run = "bun run format"

[tasks.lint-ui]
description = "Lint UI"
dir = "frontend"
run = "bun run lint"

[tasks.typecheck-ui]
description = "Type-check UI"
dir = "frontend"
run = "bun run typecheck"

[tasks.generate-routes]
description = "Regenerate the TanStack route tree"
dir = "frontend"
run = "bun run generate:routes"

[tasks.test-ui-unit]
description = "Run UI unit tests"
dir = "frontend"
run = "bun run test:unit"

[tasks.test-ui-unit-file]
description = "Run one UI unit-test file"
dir = "frontend"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-ui-unit-file -- <file>" >&2; exit 2; }
bun test "$1"
'''

[tasks.test-ui-cover]
description = "Run UI unit tests with coverage"
dir = "frontend"
run = "bun run test:unit:coverage"

[tasks.build-ui]
description = "Build UI"
dir = "frontend"
run = "bun run build"

[tasks.test-ui-e2e]
description = "Run UI end-to-end tests"
dir = "frontend"
run = "bun run test:e2e"

[tasks.check]
description = "Validate specifications, records, dependencies, and command map"
depends = ["check-spec", "check-work-items", "check-ids", "check-boundaries", "check-command-map", "check-config-reference", "check-admin-scopes", "check-security-controls"]

[tasks.check-security-controls]
description = "Reject guards that cannot refuse and declared refusals no test names"
dir = "tools"
run = "bun run check/src/check-security-controls.ts"

[tasks.report-security-test-gaps]
description = "List refused state changes no test proves were left untouched"
dir = "tools"
run = "bun run check/src/report-security-test-gaps.ts"

[tasks.report-refusal-debt]
description = "Split declared refusals that no test names into missing annotation and missing test"
dir = "tools"
run = "bun run check/src/report-refusal-debt.ts"

[tasks.check-admin-scopes]
description = "Check admin API scope declarations"
depends = ["compile-spec"]
dir = "tools"
run = "bun run check/src/check-admin-scopes.ts"

[tasks.check-command-map]
description = "Check workflow calls against mise tasks"
dir = "tools"
run = "bun run check/src/check-command-map.ts"

[tasks.check-spec]
description = "Compile TypeSpec and validate canonical specification documents"
depends = ["compile-spec"]
run = [
  "mise run check-generated-contract",
  "cd tools && bun run workspace/src/check-workspace.ts --documents",
  "cd tools && bun run render-spec-docs/src/main.ts --check",
]

[tasks.check-work-items]
description = "Validate work-item records"
dir = "tools"
run = "bun run workspace/src/check-workspace.ts --work-items"

[tasks.check-ids]
description = "Detect duplicate or mismatched change-record IDs"
dir = "tools"
run = "bun run workspace/src/check-workspace.ts --ids"

[tasks.check-boundaries]
description = "Reject forbidden source dependencies"
dir = "tools"
run = "bun run check/src/check-boundaries.ts"

[tasks.generate-config-reference]
description = "Generate the operator configuration reference"
run = "go run ./backend/cmd/idmagic-config-reference --output CONFIGURATION.md"

[tasks.check-config-reference]
description = "Check the operator configuration reference"
run = "go run ./backend/cmd/idmagic-config-reference --check --output CONFIGURATION.md"

[tasks.check-api-compat]
description = "Detect OpenAPI breaking changes against the release baseline"
depends = ["compile-spec"]
dir = "tools"
run = "bun run check-api-compat/src/main.ts"

[tasks.update-api-baseline]
description = "Freeze generated OpenAPI as the release baseline"
run = ["mise run spec-render", "cp spec/generated/openapi/idmagic.openapi.json spec/idmagic.openapi.baseline.json"]

[tasks.spec-where]
description = "Locate a term across specification, code, and work items"
run = '''
#!/usr/bin/env sh
set -u
test "$#" -ge 1 || { echo "usage: mise run spec-where -- <term>" >&2; exit 2; }
echo "── specification ──"
rg -n --no-heading --glob '!generated' "$1" spec || true
echo "── code and tests ──"
rg -n --no-heading --glob '!spec/**' --glob '!work-items/**' --glob '!**/generated/**' "$1" . || true
echo "── work items ──"
rg -l "$1" work-items || true
'''

[tasks.spec-diff]
description = "Show normative specification changes against a git ref"
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
bun run check/src/spec-diff.ts "${1:-main}"
'''

[tasks.render-spec-docs]
description = "Render browsable specification and API documentation"
dir = "tools"
run = "bun run render-spec-docs/src/main.ts"

[tasks.spec-render]
description = "Regenerate TypeSpec-derived artifacts"
run = ["mise run compile-spec", "mise run generate-contract", "mise run render-spec-docs"]

[tasks.dev]
description = "Start the local API and UI stack"
raw = true
run = "./dev.sh"

[tasks.dev-memory]
description = "Start the lightweight API and UI stack"
raw = true
run = "./dev.sh memory"

[tasks.dev-api]
description = "Start the Go API for local UI development"
raw = true
run = '''
ADDR=:8081 ISSUER=http://localhost:5173 WEBAUTHN_RP_ID="${WEBAUTHN_RP_ID:-localhost}" WEBAUTHN_RP_ORIGINS="${WEBAUTHN_RP_ORIGINS:-http://localhost:5173}" WEBAUTHN_RP_DISPLAY_NAME="${WEBAUTHN_RP_DISPLAY_NAME:-IdMagic Local}" go run ./backend/cmd/idmagic
'''

[tasks.dev-ui]
description = "Start the React UI development server"
dir = "frontend"
raw = true
run = "bun run dev"

[tasks.dev-compose]
description = "Start the Docker Compose development stack"
run = "docker compose -f infra/docker/docker-compose.dev.yaml up --build -d"

[tasks.logs-compose]
description = "Follow Docker Compose development logs"
raw = true
run = "docker compose -f infra/docker/docker-compose.dev.yaml logs -f"

[tasks.down-compose]
description = "Stop the Docker Compose development stack"
run = "docker compose -f infra/docker/docker-compose.dev.yaml down"

[tasks.schema-compose]
description = "Reapply the PostgreSQL schema in Docker Compose"
run = "docker compose -f infra/docker/docker-compose.dev.yaml run --rm schema"

[tasks.check-compose]
description = "Validate Docker Compose configuration"
run = "docker compose -f infra/docker/docker-compose.dev.yaml config --quiet"

[tasks.check-schema]
description = "Verify PostgreSQL schema convergence"
run = "./infra/schema/check-convergence.sh"

[tasks.backup-postgres]
description = "Create a pg_dump backup and checksum"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run backup-postgres -- <output-dir>" >&2; exit 2; }
./infra/backup/backup-postgres.sh "$1"
'''

[tasks.restore-postgres]
description = "Restore a pg_dump backup into an empty database"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 2 || { echo "usage: mise run restore-postgres -- <backup-file> <database>" >&2; exit 2; }
./infra/backup/restore-postgres.sh "$1" --yes-restore-into-this-database "$2"
'''

[tasks.restore-drill]
description = "Run the local backup and restore drill"
run = "./infra/backup/restore-drill.sh"

[tasks.check-k8s]
description = "Render and schema-validate a Kubernetes overlay"
run = '''
#!/usr/bin/env sh
set -eu
overlay=${1:-dev}
docker run --rm -v "$PWD:/workspace:ro" -w /workspace registry.k8s.io/kustomize/kustomize:v5.6.0 build "infra/k8s/overlays/$overlay" | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary
'''

[tasks.deploy-k8s]
description = "Apply a Kubernetes overlay"
run = '''
#!/usr/bin/env sh
set -eu
kubectl apply -k "infra/k8s/overlays/${1:-dev}"
'''

[tasks.rollback-k8s]
description = "Roll back a Kubernetes deployment"
run = '''
#!/usr/bin/env sh
set -eu
kubectl rollout undo "deployment/${1:-idmagic-api}"
'''

[tasks.check-monitoring]
description = "Validate Prometheus rules and Grafana/Kubernetes assets"
run = [
  "docker run --rm --entrypoint promtool -v \"$PWD:/workspace:ro\" prom/prometheus:v2.55.1 check rules /workspace/infra/docker/prometheus-rules.yml",
  "jq empty infra/docker/grafana-dashboard.json",
  "docker run --rm -v \"$PWD:/workspace:ro\" -w /workspace registry.k8s.io/kustomize/kustomize:v5.6.0 build infra/k8s/monitoring > /dev/null",
  "docker run --rm -v \"$PWD:/workspace:ro\" -w /workspace registry.k8s.io/kustomize/kustomize:v5.6.0 build infra/k8s/monitoring/operator > /dev/null",
  "docker run --rm -v \"$PWD:/workspace:ro\" -w /workspace registry.k8s.io/kustomize/kustomize:v5.6.0 build infra/k8s/monitoring/loki > /dev/null",
]

[tasks.deploy-monitoring]
description = "Apply monitoring assets"
run = "kubectl apply -k infra/k8s/monitoring"

[tasks.deploy-monitoring-operator]
description = "Apply Prometheus Operator monitoring assets"
run = "kubectl apply -k infra/k8s/monitoring/operator"

[tasks.k6-smoke]
description = "Execute the tenant-local OAuth smoke test"
run = '''
#!/usr/bin/env sh
set -eu
base_url=${1:-http://host.docker.internal:8080/realms/default}
browser_origin=${2:-http://localhost:8080}
docker run --rm -e IDMAGIC_BASE_URL="$base_url" -e IDMAGIC_BROWSER_ORIGIN="$browser_origin" -v "$PWD/load/k6:/scripts:ro" grafana/k6:0.54.0 run /scripts/oauth-smoke.js
'''

[tasks.check-k6]
description = "Parse and inspect the k6 module"
run = "docker run --rm -v \"$PWD/load/k6:/scripts:ro\" grafana/k6:0.54.0 inspect /scripts/oauth-smoke.js"

[tasks.demo]
description = "Run the OAuth2/OIDC demo"
raw = true
run = "./demo.sh"

[tasks.demo-ciba]
description = "Run the interactive CIBA approval demo"
raw = true
run = '''
BASE="${1:-http://localhost:5173/realms/default}" ./ciba-demo.sh
'''
