[tasks.check-k6]
description = "Parse and inspect the k6 module"
run = "docker run --rm -v \"$PWD/load/k6:/scripts:ro\" grafana/k6:0.54.0 inspect /scripts/oauth-smoke.js"

[tasks.demo]
description = "Run the OAuth2/OIDC demo"
raw = true
run = "./demo.sh"

[tasks.demo-ciba]
description = "Run the interactive CIBA approval demo"
raw = true
run = '''
BASE="${1:-http://localhost:5173/realms/default}" ./ciba-demo.sh
'''
