[tasks.update-ui-dependencies]
description = "Update UI dependency declarations to the latest releases"
dir = "frontend"
run = "bun update --latest"

[tasks.add-ui-component]
description = "Add shadcn components with the version pinned in devDependencies"
dir = "frontend"
