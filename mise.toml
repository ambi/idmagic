run = "bun run test:unit:coverage"

[tasks.build-ui]
description = "Build UI"
dir = "frontend"
run = "bun run build"

[tasks.test-ui-e2e]
description = "Run UI end-to-end tests"
dir = "frontend"
run = "bun run test:e2e"

[tasks.test-ui-e2e-file]
description = "Run one UI end-to-end spec file"
dir = "frontend"
# --config は test:e2e と同じものを渡す。既定の bunfig は単体テスト用の DOM 登録を
# preload するだけで、スタックを起動する tests/e2e/setup.ts を読まない。渡し忘れると
# 全テストが待ち続けてタイムアウトし、失敗はスタックの不在ではなく被験コードのせいに見える。
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-ui-e2e-file -- <spec> [test name]" >&2; exit 2; }
if [ "$#" -ge 2 ]; then
  bun test --config=tests/e2e/bunfig.toml "$1" -t "$2"
else
  bun test --config=tests/e2e/bunfig.toml "$1"
fi
'''

[tasks.check]
description = "Validate specifications, records, dependencies, commands, and agent guidance"
depends = ["compile-spec"]
run = '''
mise run -c \
  check-generated-contract ::: \
  check-rendered-spec ::: \
  check-repository ::: \
  check-config-reference ::: \
  check-route-reference
'''

[tasks.check-repository]
description = "Run every registered TypeScript repository check in one process"
dir = "tools"
run = "bun run check/src/runner.ts all --base-revision \"${1:-main}\""

[tasks.check-rendered-spec]
description = "Check the rendered specification site"
dir = "tools"
run = "bun run render-spec-docs/src/main.ts --check"

[tasks.check-links]
description = "Check repository-local Markdown links and anchors"
dir = "tools"
run = "bun run check/src/runner.ts links"

[tasks.check-security-controls]
description = "Reject guards that cannot refuse and declared refusals no test names"
dir = "tools"
run = "bun run check/src/runner.ts security-controls"

[tasks.report-security-test-gaps]
description = "List refused state changes no test proves were left untouched"
dir = "tools"
run = "bun run security-test-gap-report/src/main.ts"

[tasks.report-coverage-debt]
description = "Order the normative ids no test names, weighted by the refusals the contract promises"
dir = "tools"
run = "bun run coverage-debt-report/src/main.ts"

[tasks.spec-route]
description = "Show where one normative id would be observed: rule, candidate operations, tests already naming it"
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run spec-route -- <EX-CONTEXT-NNN-MM | REQ-CONTEXT-NNN>" >&2; exit 2; }
bun run spec-route/src/main.ts "$1"
'''

[tasks.check-admin-scopes]
description = "Check admin API scope declarations"
depends = ["compile-spec"]
dir = "tools"
run = "bun run check/src/runner.ts admin-scopes"

[tasks.check-contract-drift]
description = "Check TypeSpec request and response bodies against what the Go handlers decode and write"
depends = ["compile-spec"]
dir = "tools"
run = "bun run check/src/runner.ts contract-drift"

[tasks.check-status-drift]
description = "Check the status codes TypeSpec declares against the ones the Go handlers write"
depends = ["compile-spec"]
dir = "tools"
run = "bun run check/src/runner.ts status-drift"

[tasks.check-event-contract]
description = "Check the published domain event payload vocabulary against the code that reads it"
dir = "tools"
run = "bun run check/src/runner.ts event-contract"

[tasks.check-slo-references]
description = "Check that monitoring assets name declared service level objectives"
dir = "tools"
run = "bun run check/src/runner.ts slo-references"

[tasks.check-command-map]
description = "Check workflow calls against mise tasks"
dir = "tools"
run = "bun run check/src/runner.ts command-map"

[tasks.check-agent-guidance]
description = "Check repository-local agent guidance against the current workflow"
dir = "tools"
run = "bun run check/src/runner.ts agent-guidance"

[tasks.check-spec]
description = "Compile TypeSpec and validate canonical specification documents"
depends = ["compile-spec"]
run = [
  "mise run check-generated-contract",
  "cd tools && bun run check/src/runner.ts documents",
  "mise run check-rendered-spec",
]

[tasks.check-coverage-debt-ratchet]
description = "Reject coverage debt IDs added beyond a Git revision"
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -le 1 || { echo "usage: mise run check-coverage-debt-ratchet -- [base-revision]" >&2; exit 2; }
bun run check/src/runner.ts coverage-debt-ratchet --base-revision "${1:-main}"
'''

[tasks.check-work-items]
description = "Validate work-item records"
dir = "tools"
# 成功した対象の列挙は既定では出さない。全件を見たいときは `-- --verbose` を渡す。
run = "bun run check/src/runner.ts work-items \"$@\""

[tasks.check-boundaries]
description = "Reject forbidden source dependencies"
dir = "tools"
run = "bun run check/src/runner.ts boundaries"

[tasks.generate-config-reference]
description = "Generate the operator configuration reference"
run = "go run ./backend/cmd/idmagic-config-reference --output CONFIGURATION.md"

[tasks.check-config-reference]
description = "Check the operator configuration reference"
run = "go run ./backend/cmd/idmagic-config-reference --check --output CONFIGURATION.md"

[tasks.generate-route-reference]
description = "Generate the route priority reference"
run = "go run ./backend/cmd/idmagic-route-reference --output ROUTE_PRIORITY.md"

[tasks.check-route-reference]
description = "Check the route priority reference"
run = "go run ./backend/cmd/idmagic-route-reference --check --output ROUTE_PRIORITY.md"

[tasks.check-api-compat]
description = "Detect OpenAPI breaking changes against the release baseline"
depends = ["compile-spec"]
dir = "tools"
run = "bun run check/src/runner.ts api-compat"

[tasks.update-api-baseline]
description = "Freeze generated OpenAPI as the release baseline"
run = [
  "mise run spec-render",
  "cp spec/generated/openapi/idmagic.openapi.json spec/idmagic.openapi.baseline.json",
]

[tasks.brief]
description = "Show what one work item should be read from"
# 規範 ID から仕様本文、TypeSpec の宣言位置、その ID を名指す既存のテストと実装、先行する
# work item まで一度にたどる。任意の語を探す spec-where とは入力も出力も別なので分けてある。
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run brief -- <work-item>" >&2; exit 2; }
bun run brief/src/main.ts "$1"
'''

[tasks.spec-where]
description = "Locate a term across specification, code, and work items"
run = '''
#!/usr/bin/env sh
set -u
test "$#" -ge 1 || { echo "usage: mise run spec-where -- <term>" >&2; exit 2; }
echo "── specification ──"
rg -n --no-heading --glob '!generated' "$1" docs spec || true
echo "── code and tests ──"
rg -n --no-heading --glob '!docs/**' --glob '!spec/**' --glob '!work-items/**' --glob '!**/generated/**' "$1" . || true
echo "── work items ──"
rg -l "$1" work-items || true
'''

[tasks.spec-diff]
description = "Show normative specification changes against a git ref"
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
bun run spec-diff/src/main.ts "${1:-main}"
'''

[tasks.render-spec-docs]
description = "Render browsable specification and API documentation"
dir = "tools"
run = "bun run render-spec-docs/src/main.ts"

[tasks.spec-render]
description = "Regenerate TypeSpec-derived artifacts"
run = [
  "mise run compile-spec",
  "mise run generate-contract",
  "mise run render-spec-docs",
]

