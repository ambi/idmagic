#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run add-ui-component -- <component...>" >&2; exit 2; }
bun run add:component "$@"
'''

[tasks.format-check-ui]
description = "Check UI formatting"
dir = "frontend"
run = "bun run format:check"

[tasks.format-ui]
description = "Format UI"
dir = "frontend"
run = "bun run format"

[tasks.lint-ui]
description = "Lint UI"
dir = "frontend"
run = "bun run lint"

[tasks.typecheck-ui]
description = "Type-check UI"
dir = "frontend"
run = "bun run typecheck"

[tasks.generate-routes]
description = "Regenerate the TanStack route tree"
dir = "frontend"
run = "bun run generate:routes"

[tasks.test-ui-unit]
description = "Run UI unit tests"
dir = "frontend"
run = "bun run test:unit"

[tasks.test-ui-unit-file]
description = "Run one UI unit-test file"
dir = "frontend"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-ui-unit-file -- <file>" >&2; exit 2; }
bun test "$1"
'''

[tasks.test-ui-cover]
description = "Run UI unit tests with coverage"
