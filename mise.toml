[tasks.lint-repo]
description = "Lint shell scripts, audit workflows, and scan for secrets"
# 3 つとも合わせて 500ms 程度なので分けない。分けた数だけ `mise tasks` が読みにくくなる。
# 最初の失敗で止めず、落ちたものを全部並べて終わる。
# ここに無い検査は、置いている理由を言えなかったので外した。判断は wi-434 が持つ。
# 規則の正本: .github/zizmor.yml と .betterleaks.toml。
run = '''
#!/usr/bin/env sh
set -u
failed=""
check() {
  name="$1"
  shift
  if ! "$@"; then
    failed="$failed $name"
  fi
}
# SC2030 / SC2031 だけを外す。部分シェルに閉じた意図した export を誤検出し、抑制コメントを書かせるだけだった。
# 深刻度そのものを warning に上げる形は採らない。SC2086 (変数の引用漏れ) が情報レベルにあり、
# それは本物のバグ種別だからである。
run_shellcheck() { git ls-files -z '*.sh' | xargs -0 shellcheck -e SC2030,SC2031; }

check shellcheck run_shellcheck
check zizmor zizmor --no-progress .github/workflows
check betterleaks betterleaks dir . --redact --no-banner

if [ -n "$failed" ]; then
  echo "failed:$failed" >&2
  exit 1
fi
'''

[tasks.audit-dependencies]
description = "Scan Go and Bun dependencies for known vulnerabilities"
# 対象は列挙する。--recursive にすると、後から増えた依存定義ファイルが所有者と抑止方針の
# 決まらないうちにゲートへ入り、CI の意味が黙って変わる。
# 呼び出し解析は切る。OSV-Scanner は go/types を自分のバイナリに焼き込むので、go.mod が
# 宣言する言語版を配布バイナリのビルド Go が下回った瞬間に解析が壊れ、しかもそれが検出結果に
# 現れない。到達性は audit-go-reachability が持つ。--call-analysis=none は「none という言語」
# として一般エラーになるだけで、無効化にはならない。
# 出力引数は透過する。CI は同じ対象定義のまま --format=sarif を足して呼ぶ。
run = '''
#!/usr/bin/env sh
set -eu
exec osv-scanner scan source \
  --config=osv-scanner.toml \
  --no-call-analysis=go \
  --lockfile=go.mod \
  --lockfile=frontend/bun.lock \
  --lockfile=tools/bun.lock \
  "$@"
'''

