[tasks.setup-cli-tools]
description = "Install host CLI tools used by repository instructions"
run = '''
#!/usr/bin/env sh
set -eu
if ! command -v brew >/dev/null 2>&1; then
  echo "Homebrew not found. Install manually: jq yq ripgrep fd gh ast-grep sd" >&2
  exit 1
fi
brew install jq yq ripgrep fd gh ast-grep sd
'''

