min_version = "2026.8.0"

[tools]
go = "1.27.0"
bun = "1.4.0"
"aqua:golangci/golangci-lint" = "2.13.1"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:sqldef/sqldef/psqldef" = "3.11.20"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.29.0"
"aqua:betterleaks/betterleaks" = "1.8.1"
"aqua:google/osv-scanner" = "2.5.1"
# govulncheck は配布バイナリではなく go: バックエンドで固定する。到達性の判定は go.mod が
# 宣言する言語版でビルドされていないと成立せず、配布バイナリはリリース時点の Go で焼き固め
# られるためである。詳細は wi-291。
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
# 変異テストは局所的に走らせる道具で、ゲートには入っていない。それでも版を固定するのは、
# 生成される変異の集合が版で変わり、work item に残した一覧が再現できなくなるためである。
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"

[tasks.setup]
description = "Install repository dependencies and link agent skills"
depends = ["setup-tools", "install-ui"]

[tasks.setup-tools]
description = "Install embedded tooling dependencies and link agent skills"
run = [
  "cd tools && bun install --frozen-lockfile",
  "ln -sfn tools/node_modules node_modules",
  "mkdir -p .agents/skills .claude",
  "ln -sfn ../.agents/skills .claude/skills",
]

[tasks.update-tools-lockfile]
description = "Resolve declared embedded tooling dependencies and update the lockfile"
dir = "tools"
run = "bun install"

[tasks.tool-versions]
description = "Show the development tool versions selected by mise"
run = [
  "go version",
  "bun --version",
  "golangci-lint version",
  "sqlc version",
  "psqldef --version",
  "shellcheck --version",
  "zizmor --version",
  "betterleaks version",
  "osv-scanner --version",
  "govulncheck -version",
  # gremlins は版をリリース時の ldflags で埋めるため、`go install` したものは `--version` に
  # `dev` としか答えない。mise が選んだ版は導入先の path にしか現れない。
  "mise which gremlins",
]

[tasks.setup-cli-tools]
description = "Install host CLI tools used by repository instructions"
run = '''
#!/usr/bin/env sh
set -eu
if ! command -v brew >/dev/null 2>&1; then
  echo "Homebrew not found. Install manually: jq yq ripgrep fd gh ast-grep sd" >&2
  exit 1
fi
brew install jq yq ripgrep fd gh ast-grep sd
'''

[tasks.compile-spec]
description = "Compile TypeSpec and emit OpenAPI"
dir = "tools"
run = "bunx tsp compile ../spec/main.tsp --config ../spec/tspconfig.yaml"

[tasks.generate-contract]
description = "Generate runtime route metadata from compiled OpenAPI"
dir = "tools"
run = "bun run generate-contract/src/main.ts"

[tasks.check-generated-contract]
description = "Check runtime route metadata against TypeSpec"
dir = "tools"
run = "bun run generate-contract/src/main.ts --check"

[tasks.install-ui]
description = "Install UI dependencies"
dir = "frontend"
run = "bun install --frozen-lockfile"

[tasks.verify]
description = "Run the standard verification suite in parallel, reporting every gate that failed"
# 集約ゲートは 1 回の実行で落ちたものを全部並べて終わる。最初の失敗で残りを打ち切ると、
# 1 回の実行で受け取れる失敗が 1 種類だけになり、直しては数分かけて次を掘り出す往復になる。
run = '''
mise run -c \
  check ::: \
  test-tools ::: \
  typecheck-tools ::: \
  lint-tools ::: \
  lint-repo ::: \
  lint-go ::: \
  test-go-race ::: \
  check-ui-dependencies ::: \
  format-check-ui ::: \
  lint-ui ::: \
  typecheck-ui ::: \
  test-ui-unit ::: \
  build-ui
'''

[tasks.verify-full]
description = "Run the standard verification suite and the browser end-to-end tests"
# ブラウザー統合だけが要求するスタック起動 (Go のビルド、API、Vite 開発サーバー、初期データ)
# を、静的検査と単体テストのたびに毎回組み合わせる理由はない。通常のゲートからは外し、
# ここと CI の独立した job が後退検出を持つ。
run = "mise run -c verify ::: test-ui-e2e"

[tasks.verify-serial]
description = "Run the standard verification suite serially, reporting every gate that failed"
# 逐次実行でも規律は同じで、落ちたものを全部並べて終わる。
# 呼び出しは `mise run <task>` の形をそのまま書く。タスク名を変数に畳むと短くなるが、
# 並列版と同じ一式を並べているかを機械的に読めなくなり、drift は人が気付くまで残る。
run = '''
#!/usr/bin/env sh
set -u
failed=""
gate() {
  # 走らせたタスク名は `gate mise run <task>` の 3 番目の引数である。
  if ! "$@"; then
    failed="$failed $3"
  fi
}
gate mise run check
gate mise run test-tools
gate mise run typecheck-tools
gate mise run lint-tools
gate mise run lint-repo
gate mise run lint-go
gate mise run test-go-race
gate mise run check-ui-dependencies
gate mise run format-check-ui
gate mise run lint-ui
gate mise run typecheck-ui
gate mise run test-ui-unit
gate mise run build-ui

if [ -n "$failed" ]; then
  echo "failed:$failed" >&2
  exit 1
fi
'''

[tasks.time-verify]
description = "Time every gate of a verification suite serially"
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
bun run task-timing/src/main.ts "${1:-verify}"
'''

[tasks.verify-spec]
description = "Validate specifications and embedded tooling, reporting every gate that failed"
run = '''
mise run -c \
  check ::: \
  test-tools ::: \
  typecheck-tools ::: \
  lint-tools
'''

[tasks.test-tools]
description = "Run embedded repository tooling tests"
dir = "tools"
run = "bun test"

[tasks.test-tools-file]
description = "Run one embedded repository tooling test file"
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-tools-file -- <path relative to tools/>" >&2; exit 2; }
bun test "$@"
'''

[tasks.typecheck-tools]
description = "Type-check embedded repository tooling"
dir = "tools"
run = "bun run typecheck"

[tasks.format-tools]
description = "Format embedded repository tooling"
dir = "tools"
run = "bun run format"

[tasks.lint-tools]
description = "Lint embedded repository tooling"
dir = "tools"
run = "bun run lint"

[tasks.list-outdated-tools-dependencies]
description = "List embedded tooling dependencies that have a newer release"
dir = "tools"
run = "bun outdated"

[tasks.update-tools-dependencies]
description = "Update embedded tooling dependency declarations to the latest releases"
dir = "tools"
run = "bun update --latest"

[tasks.lint-repo]
description = "Lint shell scripts, audit workflows, and scan for secrets"
# 3 つとも合わせて 500ms 程度なので分けない。分けた数だけ `mise tasks` が読みにくくなる。
# 最初の失敗で止めず、落ちたものを全部並べて終わる。
# ここに無い検査は、置いている理由を言えなかったので外した。判断は wi-434 が持つ。
# 規則の正本: .github/zizmor.yml と .betterleaks.toml。
run = '''
#!/usr/bin/env sh
set -u
failed=""
check() {
  name="$1"
  shift
  if ! "$@"; then
    failed="$failed $name"
  fi
}
# SC2030 / SC2031 だけを外す。部分シェルに閉じた意図した export を誤検出し、抑制コメントを書かせるだけだった。
# 深刻度そのものを warning に上げる形は採らない。SC2086 (変数の引用漏れ) が情報レベルにあり、
# それは本物のバグ種別だからである。
run_shellcheck() { git ls-files -z '*.sh' | xargs -0 shellcheck -e SC2030,SC2031; }

check shellcheck run_shellcheck
check zizmor zizmor --no-progress .github/workflows
check betterleaks betterleaks dir . --redact --no-banner

if [ -n "$failed" ]; then
  echo "failed:$failed" >&2
  exit 1
fi
'''

[tasks.audit-dependencies]
description = "Scan Go and Bun dependencies for known vulnerabilities"
# 対象は列挙する。--recursive にすると、後から増えた依存定義ファイルが所有者と抑止方針の
# 決まらないうちにゲートへ入り、CI の意味が黙って変わる。
# 呼び出し解析は切る。OSV-Scanner は go/types を自分のバイナリに焼き込むので、go.mod が
# 宣言する言語版を配布バイナリのビルド Go が下回った瞬間に解析が壊れ、しかもそれが検出結果に
# 現れない。到達性は audit-go-reachability が持つ。--call-analysis=none は「none という言語」
# として一般エラーになるだけで、無効化にはならない。
# 出力引数は透過する。CI は同じ対象定義のまま --format=sarif を足して呼ぶ。
run = '''
#!/usr/bin/env sh
set -eu
exec osv-scanner scan source \
  --config=osv-scanner.toml \
  --no-call-analysis=go \
  --lockfile=go.mod \
  --lockfile=frontend/bun.lock \
  --lockfile=tools/bun.lock \
  "$@"
'''

[tasks.audit-go-reachability]
description = "Report Go vulnerabilities the code actually reaches"
run = "govulncheck ./..."

[tasks.check-vulnerability-suppressions]
description = "Require a reason and an unexpired deadline on every vulnerability suppression"
dir = "tools"
run = "bun run check/src/runner.ts vulnerability-suppressions"

[tasks.audit-secrets-history]
description = "Scan the whole Git history for secrets"
# 履歴の走査だけは lint-repo に混ぜない。毎回のゲートに入れるには重く、監査として明示的に呼ぶものである。
run = "betterleaks git . --redact --no-banner"

[tasks.verify-go]
description = "Verify Go with lint and race-enabled tests"
depends = ["lint-go", "test-go-race"]

[tasks.lint-go]
description = "Run Go lint"
run = "golangci-lint run ./..."

[tasks.lint-go-fix]
description = "Run Go lint and apply the fixes it can make"
run = "golangci-lint run --fix ./..."

[tasks.clean-go-test-cache]
description = "Clear the Go test result cache"
# 前後比較のための計測は、キャッシュから返った項目を含めると意味を失う。
run = "go clean -testcache"

[tasks.time-lint-go]
description = "Break the Go lint gate down by analyzer, on a cleared cache"
# `time-verify` はどのゲートが重いかを言う。それが lint-go だったときに、260 個の
# アナライザーのどれが重いかを言うのがこれである。golangci-lint はその内訳を
# パッケージ × アナライザーの 11 万行のデバッグ出力としてしか出さない。
dir = "tools"
run = '''
#!/usr/bin/env sh
set -eu
bun run task-timing/src/lint-main.ts "${1:-15}"
'''

[tasks.clean-lint-cache]
description = "Clear the golangci-lint cache"
run = "golangci-lint cache clean"

[tasks.format-go]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.test-go]
description = "Run Go tests"
run = "go test ./..."

[tasks.test-go-package]
description = "Run race-enabled Go tests for one package"
# 最後のゲート (test-go-race) と同じビルド構成にする。Go のテストキャッシュ項目は -race の
# 有無で共有されないので、狭い段を -race なしで回すと、その結果は最後のゲートに 1 件も
# 引き継がれない。1 パッケージなら -race でも数秒であり、そのぶん最後が短くなる。
#
# -count 1 は結果キャッシュの読み出しだけを止める。書き込みは残るので、最後のゲートへ
# 引き継がれる分は変わらない。止める理由は故障注入である。製品側へ故障を入れて同じ
# パッケージを回したとき、キャッシュが効くと `ok (cached)` が返り、検出できなかったのか
# 走っていないのかを見分けられない。wi-565 の作業中に実際に 1 度誤読した。
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-go-package -- <package>" >&2; exit 2; }
go test -race -count 1 "$1"
'''

[tasks.test-go-changed]
description = "Run race-enabled Go tests for the changed packages and their reverse dependencies"
# どこが関係するかを見極めるより回してしまった方が楽、という判断は正しい。だから見極めを
# 人ではなく go list の依存グラフにやらせる。省いた分は最後のゲートが拾う。
run = '''
#!/usr/bin/env sh
set -eu
packages=$(bun run tools/changed-packages/src/main.ts "$@")
if [ -z "$packages" ]; then
  echo "no changed Go packages" >&2
  exit 0
fi
echo "$packages" | tr '\n' ' ' | xargs go test -race
'''

[tasks.test-go-test]
description = "Run one Go test by name in one package"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 2 || { echo "usage: mise run test-go-test -- <package> <test>" >&2; exit 2; }
go test "$1" -run "^$2\$" -count 1
'''

[tasks.benchmark-go-package]
description = "Benchmark one Go package"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 2 || { echo "usage: mise run benchmark-go-package -- <package> <benchmark> [count]" >&2; exit 2; }
go test "$1" -run '^$' -bench "$2" -benchmem -count "${3:-5}"
'''

[tasks.seed]
description = "Plan or apply an explicit environment seed"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 2 || { echo "usage: mise run seed -- <environment> <profile> [mode] [manifest] [count]" >&2; exit 2; }
go run ./backend/cmd/idmagic-seed --environment "$1" --profile "$2" --mode "${3:-dry_run}" --manifest "${4:-}" --count "${5:-0}"
'''

[tasks.seed-throughput]
description = "Measure seeding throughput; writes real data"
run = '''
#!/usr/bin/env sh
set -eu
go run ./backend/cmd/idmagic-seed --environment "${1:-development}" --profile performance --mode apply --count "${2:-10000}" --batch-size "${3:-250}"
'''

[tasks.batch]
description = "Run one externally scheduled operational batch"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run batch -- <task> [args...]" >&2; exit 2; }
go run ./backend/cmd/idmagic-batch "$@"
'''

[tasks.go-mod-tidy]
description = "Synchronize Go module requirements and checksums"
run = "go mod tidy"

[tasks.update-go-dependencies]
description = "Update Go module requirements to the latest minor and patch releases"
run = ["go get -u -t ./...", "go mod tidy"]

[tasks.test-go-race]
description = "Run race-enabled Go tests"
run = "go test -race ./..."

[tasks.test-go-cover]
description = "Run Go tests with coverage"
run = [
  "go test -coverprofile=coverage.out -covermode=atomic ./...",
  "go tool cover -func=coverage.out",
]

[tasks.test-go-fuzz]
description = "Run one Go fuzz target"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-go-fuzz -- <package> [target] [fuzztime]" >&2; exit 2; }
package="$1"
target="${2:-}"
if [ -z "$target" ]; then
  # go test refuses to fuzz when the pattern matches more than one target, so resolve it here.
  targets=$(go test -list 'Fuzz.*' "$package" | grep '^Fuzz' || true)
  count=$(printf '%s' "$targets" | grep -c '^Fuzz' || true)
  if [ "$count" -ne 1 ]; then
    echo "$package has $count fuzz targets; name one:" >&2
    printf '%s\n' "$targets" >&2
    exit 2
  fi
  target="$targets"
fi
go test -run='^$' -fuzz="^${target}\$" -fuzztime="${3:-30s}" "$package"
'''

[tasks.test-go-fuzz-all]
description = "Run every Go fuzz target for a time budget each"
run = '''
#!/usr/bin/env sh
set -eu
fuzztime="${1:-20s}"
failures="$(mktemp)"
trap 'rm -f "$failures"' EXIT
for package in $(go list ./...); do
  for target in $(go test -list 'Fuzz.*' "$package" 2>/dev/null | grep '^Fuzz' || true); do
    echo "== $package $target"
    if ! go test -run='^$' -fuzz="^${target}\$" -fuzztime="$fuzztime" "$package"; then
      echo "$package $target" >> "$failures"
    fi
  done
done
if [ -s "$failures" ]; then
  echo "failing fuzz targets:" >&2
  cat "$failures" >&2
  exit 1
fi
'''

[tasks.test-go-mutation]
description = "Mutate one Go package and report the mutants its tests do not kill"
run = '''
#!/usr/bin/env sh
set -eu
test "$#" -ge 1 || { echo "usage: mise run test-go-mutation -- <package-directory> [workers] [timeout-coefficient]" >&2; exit 2; }
directory="$1"
test -d "$directory" || { echo "$directory is not a directory; name the package directory, not an import path" >&2; exit 2; }
# Gremlins の対象範囲は引数の path ではなく、呼び出したディレクトリで決まる。リポジトリ root から
# 呼ぶとカバレッジ取得が `go test ./...` に広がり、embedded-postgres を起動するパッケージまで
# 巻き込んで戻ってこない。
cd "$directory"
# worker ごとにモジュール root 全体を一時ディレクトリへ複製するため、並列度を上げるほど遅くなる。
# 実測では 8 (論理 CPU 数、既定) で 3 分 18 秒、2 で 1 分 6 秒、結果は同一だった。
#
# timeout 係数を明示するのは、既定の 3 が「カバレッジ取得にかかった時間 × 3」を変異ごとの制限に
# するためである。カバレッジ取得が 1 秒未満で終わるパッケージでは変異後の再ビルドすら収まらず、
# 全件 TIMED OUT を終了コード 0 で返す。詳細は wi-493。
gremlins unleash --workers "${2:-2}" --timeout-coefficient "${3:-60}"
'''

[tasks.build-go]
description = "Build all Go packages with version metadata"
run = '''
#!/usr/bin/env sh
set -eu
git_commit=$(git rev-parse HEAD 2>/dev/null || echo unknown)
build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo unknown)
version=${VERSION:-0.0.0-dev}
go build -ldflags "-X github.com/ambi/idmagic/backend/shared/version.Version=$version -X github.com/ambi/idmagic/backend/shared/version.GitCommit=$git_commit -X github.com/ambi/idmagic/backend/shared/version.BuildDate=$build_date" ./...
'''

