# frontend — Architecture ledger
# この context が所有する module 台帳。path はこのファイルからの相対。
# 散文の設計正本は ARCHITECTURE.md。書式は ARCHITECTURE_FORMAT.md (ADR-143)。
context: frontend
updated_at: 2026-07-26
modules:
  frontend-lib:
    path: src/lib
    responsibility: i18n、validation、navigation 等の browser 共有 capability。
    context: System
    layer: adapters
    role: technical_shared
  frontend-i18n:
    path: src/lib/i18n
    responsibility: browser UI の locale と翻訳辞書基盤。
    context: System
    layer: adapters
    role: technical_shared
  frontend-utils:
    path: src/lib/utils.ts
    responsibility: UI 表示値の純粋な変換 helper。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: frontend-i18n
        via: technical_shared
      - module: frontend-types
        via: technical_shared
  frontend-types:
    path: src/types.ts
    responsibility: browser UI の共有 wire/value 型。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: frontend-lib
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
  frontend-admin-nav:
    path: src/lib/adminNav.ts
    responsibility: 管理 UI navigation の組み立て。
    context: System
    layer: adapters
    role: binding
    depends_on:
      - module: frontend-api
        via: published_interface
      - module: frontend-lib
        via: technical_shared
      - module: frontend-shell-i18n
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
  frontend-system-nav:
    path: src/lib/systemNav.ts
    responsibility: system UI navigation の組み立て。
    context: System
    layer: adapters
    role: binding
    depends_on:
      - module: frontend-lib
        via: technical_shared
      - module: frontend-shell-i18n
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
  frontend-branding-hook:
    path: src/lib/useTenantBranding.ts
    responsibility: tenant branding API を React state へ結ぶ hook。
    context: System
    layer: adapters
    role: binding
    depends_on:
      - module: frontend-api
        via: published_interface
      - module: frontend-types
        via: technical_shared
  frontend-shell-i18n:
    path: src/components/shell.i18n.ts
    responsibility: UI shell の翻訳辞書。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: frontend-lib
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
  frontend-router:
    path: src/router.tsx
    responsibility: TanStack Router と browser error boundary。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: frontend-api
        via: published_interface
      - module: frontend-lib
        via: technical_shared
      - module: frontend-routes
        via: published_interface
      - module: frontend-i18n
        via: technical_shared
  frontend-api:
    path: src/api
    responsibility: browser UI と Go API の wire binding。
    context: System
    layer: adapters
    role: binding
    depends_on:
      - module: frontend-lib
        via: technical_shared
      - module: frontend-types
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
  frontend-components:
    path: src/components
    responsibility: UI shell と共有 presentation component。
    context: System
    layer: adapters
    role: technical_shared
    depends_on:
      - module: frontend-admin-nav
        via: published_interface
      - module: frontend-api
        via: published_interface
      - module: frontend-lib
        via: technical_shared
      - module: frontend-branding-hook
        via: published_interface
      - module: frontend-shell-i18n
        via: technical_shared
      - module: frontend-system-nav
        via: published_interface
      - module: frontend-i18n
        via: technical_shared
      - module: frontend-utils
        via: technical_shared
  frontend-features:
    path: src/features
    responsibility: 管理・self-service・認証 UI feature。
    context: System
    layer: adapters
    role: binding
    depends_on:
      - module: frontend-api
        via: published_interface
      - module: frontend-components
        via: technical_shared
      - module: frontend-lib
        via: technical_shared
      - module: frontend-types
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
      - module: frontend-utils
        via: technical_shared
  frontend-routes:
    path: src/routes
    responsibility: browser route と feature composition。
    context: System
    layer: adapters
    role: binding
    depends_on:
      - module: frontend-api
        via: published_interface
      - module: frontend-components
        via: technical_shared
      - module: frontend-features
        via: published_interface
      - module: frontend-lib
        via: technical_shared
      - module: frontend-types
        via: technical_shared
      - module: frontend-i18n
        via: technical_shared
  frontend:
    path: "."
    responsibility: React browser runtime と配信設定。
    context: System
    layer: infrastructure
    role: composition_root
    depends_on:
      - module: frontend-api
        via: published_interface
      - module: frontend-components
        via: technical_shared
      - module: frontend-features
        via: published_interface
      - module: frontend-lib
        via: technical_shared
      - module: frontend-router
        via: technical_shared
      - module: frontend-routes
        via: published_interface
      - module: frontend-i18n
        via: technical_shared
