# 全エントリーが 1 枚の共有スキーマ infra/schema/postgres.sql を指すので、
# 既定のままでは context ごとの models.go にスキーマ内の全テーブルの構造体が並ぶ。
# omit_unused_structs: true は、そのエントリーの query が参照しない構造体を出力から外す。
# 生成エントリーを新しく足すときも同じ設定を書く。
version: "2"
sql:
  - engine: "postgresql"
    schema: "infra/schema/postgres.sql"
    queries: "backend/application/internal/db_postgres"
    gen:
      go:
        package: "db_postgres"
        out: "backend/application/internal/db_postgres"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_result_struct_pointers: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: false
