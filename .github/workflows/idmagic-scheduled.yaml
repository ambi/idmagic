name: IdMagic scheduled

# 重く、日常の変更ではほとんど結果が変わらない検査を、push と PR の CI（idmagic-ci.yaml）の待ち時間から外す。
# 失敗は、GitHub が定期実行の失敗を cron を最後に変更した利用者へ通知する既定の経路で届く。
on:
  schedule:
    # 毎日 UTC 18:47（日本時間 3:47）。混雑する毎時 0 分を避ける。
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idmagic-scheduled
  cancel-in-progress: false

jobs:
  envoy:
    name: Test the MCP gateway behind a real Envoy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Install dependencies
        run: mise run setup-tools
      - name: Test the MCP gateway behind a real Envoy
        run: mise run test-envoy-mcp-gateway

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: go,javascript-typescript
      - uses: github/codeql-action/analyze@v4
