name: IdMagic CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend, SCL, and UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: just setup
      - name: Verify Core (Tools & Configs)
        run: |
          just check
          just check-api-compat
          just traceability-strict
          just test-tools
          just typecheck-tools
      - name: Go lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: ./...
      - name: Test Go (Race Detector)
        run: just test-go-race
      - name: Verify UI (Lint & Format)
        run: |
          just format-check-ui
          just lint-ui
      - name: Test UI (Coverage)
        run: just test-ui-cover
      - name: Build UI
        run: just build-ui
      - name: Upload UI coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  schema-convergence:
    name: Verify psqldef schema convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Verify empty-database convergence
        run: just check-schema

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go,javascript-typescript
      - uses: github/codeql-action/analyze@v3

