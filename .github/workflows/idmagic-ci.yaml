name: IdMagic CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    name: Plan verification groups
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      go: ${{ steps.selection.outputs.go }}
      ui: ${{ steps.selection.outputs.ui }}
      browser: ${{ steps.selection.outputs.browser }}
      schema: ${{ steps.selection.outputs.schema }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: bun
      - name: Select verification groups
        id: selection
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mise run plan-ci -- "$CI_BASE" "$CI_HEAD"

  verify:
    name: Verify specification, backend, and UI
    runs-on: ubuntu-latest
    needs: [plan, spec, go-lint, go-test, ui, ui-e2e, schema-convergence]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: bun
      - name: Require every selected verification group to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: mise run check-ci-results

  spec:
    name: Verify specification and repository tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Install tooling dependencies
        run: mise run setup-tools
      - name: Verify specification and generated references
        run: mise run check-ci-spec -- "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Verify repository tools
        run: |
          mise run test-tools
          mise run typecheck-tools
          mise run lint-tools
      - name: Verify repository sources (shell scripts, workflows, secrets)
        run: mise run lint-repo

  go-lint:
    name: Lint Go
    needs: [plan]
    if: ${{ needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Go lint
        run: mise run lint-go

  go-test:
    name: Test Go
    needs: [plan]
    if: ${{ needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Go のキャッシュを復元するようにしても、前回の成功を再生せず実際に実行する。
      GOFLAGS: -count=1
      VERIFICATION_REQUIRE_DB: "1"
      VERIFICATION_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Install dependencies
        run: mise run setup-tools
      - name: Test Go
        run: mise run test-go
      - name: Verify generated Go references
        run: |
          mise run check-config-reference
          mise run check-route-reference
          mise run check-gateway-routes
      - name: Publish verification results
        if: ${{ !cancelled() }}
        run: mise run report-verification -- .verification/test-go.json
      - name: Upload verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error

  ui:
    name: Verify UI
    needs: [plan]
    if: ${{ needs.plan.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Install UI dependencies
        run: mise run install-ui
      - name: Verify UI (Dependencies, Lint, Format & Types)
        run: |
          mise run check-ui-dependencies
          mise run format-check-ui
          mise run lint-ui
          mise run typecheck-ui
      - name: Test UI (Coverage)
        run: mise run test-ui-cover
      - name: Build UI
        run: mise run build-ui
      - name: Upload UI coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ブラウザー E2E はローカルの標準ゲートから外してある (wi-497)。スタック起動を要求するのは
  # このテストだけであり、静的検査と単体テストのたびに毎回払う費用ではない。後退検出はここが持つ。
  ui-e2e:
    name: Run the browser end-to-end tests
    needs: [plan]
    if: ${{ needs.plan.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Install dependencies
        run: mise run setup
      - name: Test UI (End-to-end)
        run: mise run test-ui-e2e

  schema-convergence:
    name: Verify psqldef schema convergence
    needs: [plan]
    if: ${{ needs.plan.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Verify empty-database convergence
        run: mise run check-schema

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: go,javascript-typescript
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Require a reason and an unexpired deadline on every suppression
        run: mise run check-vulnerability-suppressions
      # 終了コードを残したまま失敗する。0 は検出なし、1 は検出あり、それ以外は検査器自身の
      # 失敗である。後段のアップロードはこの 3 つ目を SARIF ごと捨てるために status を読む。
      - name: Scan Go and Bun dependencies
        id: scan
        run: |
          set +e
          mise run audit-dependencies -- --format=sarif --output-file=osv-results.sarif
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      # 走査が落ちたときこそ到達性の出力が要る。抑止の理由はこれを根拠に書くためである。
      - name: Report Go vulnerabilities the code reaches
        if: ${{ !cancelled() }}
        run: mise run audit-go-reachability
      # fork からの Pull Request には security-events: write が渡らないので、アップロードだけを飛ばす。
      # 検査器自身が失敗したときも飛ばす。中身が 0 件の SARIF を上げると、code scanning 側では
      # 既存のアラートが解決済みとして閉じられ、問い合わせ障害が「脆弱性 0 件」として残る。
      - name: Upload OSV-Scanner SARIF
        if: >-
          ${{
            always() &&
            contains(fromJSON('["0", "1"]'), steps.scan.outputs.status) &&
            hashFiles('osv-results.sarif') != '' &&
            (
              github.event_name == 'push' ||
              (
                github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner-source
